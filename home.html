<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta name="rostrick-orientation" content="portrait">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة الإعلانات — RosTrick</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f4f7f5;color:#1b2a28;line-height:1.7}
  @media (prefers-color-scheme:dark){body{background:#071719;color:#e6f3f0}}
  h1{font-size:1.2rem;margin:0 0 4px} .sub{opacity:.7;font-size:.85rem;margin-bottom:14px}
  button{display:block;width:100%;padding:13px;margin:8px 0;border:0;border-radius:12px;background:#1f9d8f;color:#fff;font:inherit;font-weight:700}
  button.alt{background:#5d6f6b}
  #state{padding:10px 12px;border-radius:10px;background:rgba(31,157,143,.12);margin-bottom:10px;font-size:.9rem}
  #log{font:12px/1.6 ui-monospace,monospace;direction:ltr;text-align:left;background:rgba(0,0,0,.08);padding:10px;border-radius:10px;height:200px;overflow:auto;white-space:pre-wrap}
  #coins{font-size:1.1rem;font-weight:800;margin:10px 0}
</style>
<style id="rt-ux-noselect">*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text}</style><style id="rt-ux-notap">*{-webkit-tap-highlight-color:transparent}</style></head>
<body>
<h1>تجربة الإعلانات</h1>
<div class="sub">افتح هذه الصفحة داخل تطبيقك بعد تفعيل الإعلانات (يُفضَّل وضع الاختبار).</div>
<div id="state">…</div>
<div id="coins">🪙 الرصيد: <span id="c">0</span></div>

<button onclick="RosTrickAds.showBanner('bottom')">إظهار بانر (أسفل)</button>
<button class="alt" onclick="RosTrickAds.showBanner('top')">إظهار بانر (أعلى)</button>
<button class="alt" onclick="RosTrickAds.hideBanner()">إخفاء البانر</button>
<button onclick="inter()">إعلان بيني</button>
<button onclick="reward()">إعلان مكافأة (+10 🪙)</button>
<div id="log"></div>

<script>
  var coins = 0;
  function log(t){ var l=document.getElementById('log'); l.textContent += t + "\n"; l.scrollTop = l.scrollHeight; }
  function refresh(){
    var a = window.RosTrickAds;
    document.getElementById('state').textContent = !a ? 'الواجهة RosTrickAds غير موجودة (هذه الصفحة خارج التطبيق).'
      : !a.enabled ? 'الإعلانات غير مفعّلة في هذا التطبيق (فعّلها من إعدادات البناء ثم أعد البناء).'
      : 'الإعلانات مفعّلة — بيني: ' + (a.isReady('interstitial')?'جاهز':'يُحمَّل') + ' | مكافأة: ' + (a.isReady('rewarded')?'جاهز':'يُحمَّل');
  }
  async function inter(){ log('طلب إعلان بيني…'); var ok = await RosTrickAds.showInterstitial(); log(ok ? '✔ عُرض وأُغلق' : '✖ غير جاهز بعد (جرّب بعد قليل)'); refresh(); }
  async function reward(){ log('طلب إعلان مكافأة…'); var ok = await RosTrickAds.showRewarded();
    if (ok) { coins += 10; document.getElementById('c').textContent = coins; log('✔ حصلت على المكافأة'); } else log('✖ لا مكافأة (غير جاهز أو أُغلق قبل الإكمال)'); refresh(); }
  window.addEventListener('rostrick-ad', function(e){ log('حدث: ' + e.detail.type + ' / ' + e.detail.event + (e.detail.ok ? '' : ' (فشل)')); refresh(); });
  setTimeout(refresh, 300); setInterval(refresh, 3000);
</script>
</body>
</html>
