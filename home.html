<!DOCTYPE html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة الروايات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Reem+Kufi&family=Aref+Ruqaa&family=Lalezar&display=swap');
*{box-sizing:border-box}
html{--bg:#10131c;--pn:#181c28;--tx:#e9e4d6;--mu:#8d93a6;--ac:#d6b25e;--ln:#2a3042}
html[data-t=day]{--bg:#eceff4;--pn:#fff;--tx:#1b2030;--mu:#5d6478;--ac:#9a6b12;--ln:#d5dae4}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Tajawal,sans-serif}
.w{max-width:1000px;margin:auto;padding:18px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%}
button{background:var(--ac);color:#14110a;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}
.mu{color:var(--mu)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:18px;width:min(92vw,460px)}
dialog::backdrop{background:#000a}dialog>*{margin:8px 0}
#tt{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#111;padding:8px 18px;border-radius:99px;z-index:9;display:none}
h1{font:700 2.2em Amiri,serif;margin:.6em 0 .2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:16px}
.tl{aspect-ratio:3/4;border-radius:18px;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#f4efe2;margin-bottom:8px;position:relative;overflow:hidden}
.tl:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000c)}
.tl>*{position:relative;z-index:1;margin:2px 0}.tl h3{font:700 1.7em/1.2 Amiri,serif}.tl p{font-size:.85em;opacity:.85}
.pt{font-size:.8em;background:#0008;border-radius:99px;padding:0 10px;align-self:flex-start}
#st{background:var(--sb) center/cover;color:var(--st);min-height:78vh;border-radius:20px;padding:6vh 18px;margin-top:10px;cursor:pointer}
.bx,.cb{max-width:680px;margin:0 auto}
.b{margin:1em 0;font-size:1.25em;line-height:1.95;opacity:0;animation-fill-mode:forwards;animation-duration:1.2s}
img.b{max-width:100%;border-radius:12px}
.fx-none,.fx-type{opacity:1;animation:none}
.fx-fade{animation-name:fd}.fx-zoom{animation-name:zm}.fx-slide{animation-name:sl}.fx-glow{animation-name:gl}.fx-shake{animation-name:sk;animation-duration:.6s}
@keyframes fd{to{opacity:1}}
@keyframes zm{from{transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes sl{from{transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes gl{to{opacity:1;text-shadow:0 0 14px currentColor}}
@keyframes sk{0%{opacity:1}20%{opacity:1;transform:translateX(-8px)}40%{opacity:1;transform:translateX(8px)}60%{opacity:1;transform:translateX(-5px)}100%{opacity:1;transform:none}}
.tb{height:6px;border-radius:9px;background:color-mix(in srgb,var(--st) 18%,transparent);overflow:hidden;margin:18px 0 6px}
.tb i{display:block;height:100%;width:100%;background:var(--ac)}
.ch{display:block;width:100%;margin:8px 0;text-align:right;font-size:1.1em;background:color-mix(in srgb,var(--st) 9%,transparent);color:var(--st);border:1px solid color-mix(in srgb,var(--st) 25%,transparent);padding:12px 16px;border-radius:12px;transition:.2s}
.ch:hover{background:color-mix(in srgb,var(--st) 16%,transparent)}
.ch.bad{background:#e5484d44;border-color:#e5484d}.ch.good{background:#30a46c55;border-color:#30a46c}
.ch.pick{transform:scale(.96);background:var(--ac);color:#111}
@media(prefers-reduced-motion:reduce){.b{animation-duration:.01s}}
</style>
<div class="w">
 <div class="row"><span id="who" class="mu"></span><span class="sp"></span>
  <button class="g" id="bl" onclick="bell()">🔔</button><button class="g" onclick="tth()">☾ / ☀</button><button class="g" id="lg"></button></div>
 <div id="ls"><h1>مكتبة الروايات</h1><p class="mu">اختر روايتك، وقرارك هو من يكتب النهاية.</p><div class="grid" id="gr"></div></div>
 <div id="gm" hidden>
  <div class="row"><button class="g" onclick="back()">رجوع للمكتبة</button><span class="sp"></span><button class="g" onclick="setd()">الإعدادات</button><button class="g" onclick="lk(GM)">♥</button><button class="g" onclick="cmts(GM)">💬 التعليقات</button></div>
  <div id="st"></div></div>
</div><div id="tt"></div>
<script>
const DB='https://clean-sequencer-422716-g8-default-rtdb.firebaseio.com',KEY='';
const $=s=>document.querySelector(s),h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;k.startsWith('on')?e[k]=v:k=='class'?e.className=v:e.setAttribute(k,v===true?'':v)}c.flat().forEach(x=>e.append(x?.nodeType?x:(x??'')));return e};
const api=async(m,p,b)=>{const r=await fetch(DB+'/'+p+'.json'+(KEY?'?auth='+KEY:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
const get=p=>api('GET',p),put=(p,b)=>api('PUT',p,b),del=p=>api('DELETE',p);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const me=()=>JSON.parse(localStorage.sg_user||'null');
const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const dlg=(...c)=>{const d=h('dialog',{},...c);d.onclose=()=>d.remove();document.body.append(d);d.showModal();return d};
const closeBtn=()=>h('button',{class:'g',onclick:e=>e.target.closest('dialog').close()},'إغلاق');
const dl=(n,t)=>{const a=h('a',{href:URL.createObjectURL(new Blob([t],{type:'application/json'})),download:n});a.click()};
const kv=s=>Object.fromEntries(s.split(/[,،]/).map(x=>x.split('=').map(y=>y.trim())).filter(x=>x[0]).map(([k,v=''])=>[k,v=='true'?true:v=='false'?false:v===''||isNaN(v)?v:+v]));
document.documentElement.dataset.t=localStorage.sg_theme||'night';
const tth=()=>{const d=document.documentElement;d.dataset.t=localStorage.sg_theme=d.dataset.t=='day'?'night':'day'};
async function login(name,acc,pw){const id=acc.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g,'_');if(!id||!pw||!name)throw'أكمل جميع الحقول';const u=await get('users/'+id);let nm=name;if(!u){const salt=crypto.randomUUID();await put('users/'+id,{name,acc,salt,hash:await sha(salt+pw),created:Date.now()})}else{if(u.hash!==await sha(u.salt+pw))throw'كلمة المرور غير صحيحة';nm=u.name}localStorage.sg_user=JSON.stringify({id,name:nm})}
function authDlg(cb){const n=h('input',{placeholder:'إسم المستخدم'}),a=h('input',{placeholder:'إسم الحساب'}),p=h('input',{type:'password',placeholder:'كلمة المرور'}),er=h('small',{class:'mu'});const d=dlg(h('h3',{},'تسجيل الدخول'),h('p',{class:'mu'},'إن لم يكن الحساب موجودًا فسيُنشأ تلقائيًا.'),n,a,p,er,h('div',{class:'row'},h('button',{onclick:async()=>{try{await login(n.value.trim(),a.value,p.value);d.close();cb()}catch(e){er.textContent=typeof e=='string'?e:'تعذّر الاتصال'}}},'دخول'),closeBtn()))}
async function nots(){const u=me();let a={},b={};try{a=await get('notifs/'+u.id)||{};b=await get('notifs/_all')||{}}catch(e){}return[...Object.values(a),...Object.values(b)].sort((x,y)=>y.d-x.d)}
async function bell(){if(!me())return authDlg(()=>location.reload());const l=await nots();localStorage['sg_seen_'+me().id]=Date.now();$('#bl').textContent='🔔';dlg(h('h3',{},'الإشعارات'),...(l.length?l.map(n=>h('div',{class:'card'},n.m,h('small',{class:'mu'},' '+new Date(n.d).toLocaleDateString('ar')))):[h('p',{class:'mu'},'لا توجد إشعارات')]),closeBtn())}
function bar(){const u=me();$('#who').textContent=u?'أهلًا '+u.name:'تتصفح كزائر';const b=$('#lg');b.textContent=u?'خروج':'دخول';b.onclick=()=>u?(localStorage.removeItem('sg_user'),location.reload()):authDlg(()=>location.reload());$('#bl').style.display=u?'':'none';if(u)nots().then(l=>{const n=l.filter(x=>x.d>(+localStorage['sg_seen_'+u.id]||0)).length;if(n)$('#bl').textContent='🔔 '+n})}

let LIST={},U,S,P,GM,V0,pre=0,T=[],cm='',au=new Audio(),sx=new Audio(),fs=+localStorage.sg_fs||1,mute=localStorage.sg_mute=='1';
async function load(){try{const a=await get('games')||{},l=await get('likes')||{};LIST={};for(const k in a)if(a[k].status=='approved')LIST[k]={...a[k],id:k,likes:Object.keys(l[k]||{}).length};localStorage.sg_list=JSON.stringify(LIST)}catch(e){LIST=JSON.parse(localStorage.sg_list||'{}');toast('وضع بدون اتصال')}draw()}
function draw(){const g=$('#gr');g.innerHTML='';const a=Object.values(LIST).sort((x,y)=>y.updated-x.updated);if(!a.length)g.append(h('p',{class:'mu'},'لا توجد روايات منشورة بعد.'));a.forEach(x=>{const hu=[...x.title].reduce((s,c)=>s+c.charCodeAt(0),0)%360,bg=x.cover?`url("${x.cover.replace(/["\\]/g,'')}")`:`linear-gradient(160deg,hsl(${hu} 38% 24%),hsl(${(hu+50)%360} 45% 11%))`;
g.append(h('div',{},h('div',{class:'tl',style:'background-image:'+bg},x.part>1?h('span',{class:'pt'},'الجزء '+x.part+(LIST[x.prev]?' من '+LIST[x.prev].title:'')):'',h('h3',{},x.title),h('p',{},(x.desc||'').slice(0,90)),localStorage['sg_game_'+x.id]?h('span',{class:'pt'},'متاح دون اتصال'):''),h('div',{class:'row'},h('button',{onclick:()=>start(x.id)},'العب'),h('button',{class:'g',onclick:()=>lk(x)},'♥ '+x.likes),h('button',{class:'g',onclick:()=>cmts(x)},'💬'))))})}
async function lk(g){const u=me();if(!u)return authDlg(()=>location.reload());if(g.id=='preview')return;try{const l=await get('likes/'+g.id+'/'+u.id);l?await del('likes/'+g.id+'/'+u.id):await put('likes/'+g.id+'/'+u.id,true);g.likes=(g.likes||0)+(l?-1:1);draw();toast(l?'أُزيل الإعجاب':'أعجبتك الرواية ♥')}catch(e){toast('لا اتصال')}}
async function cmts(g){const box=h('div'),ta=h('textarea',{placeholder:'اكتب تعليقك',maxlength:500});const dr=async()=>{box.innerHTML='';let c={};try{c=await get('comments/'+g.id)||{}}catch(e){box.append('لا اتصال');return}Object.values(c).sort((a,b)=>b.d-a.d).forEach(x=>box.append(h('div',{class:'card'},h('b',{},x.n),h('p',{},x.t))));if(!Object.keys(c).length)box.append(h('p',{class:'mu'},'كن أول من يعلّق'))};
dlg(h('h3',{},g.title),ta,h('button',{onclick:async()=>{const u=me();if(!u)return authDlg(()=>location.reload());const t=ta.value.trim();if(!t)return;try{await put('comments/'+g.id+'/c'+Date.now().toString(36),{u:u.id,n:u.name,t,d:Date.now()});ta.value='';dr()}catch(e){toast('تعذّر الإرسال')}}},'إرسال'),box,closeBtn());dr()}

/* ---- المشغّل ---- */
async function loadStory(m){const k='sg_game_'+m.id,c=JSON.parse(localStorage[k]||'null');if(c&&c.v==m.updated)return c.story;try{const s=await get('stories/'+m.id);try{localStorage[k]=JSON.stringify({v:m.updated,story:s})}catch(e){}return s}catch(e){if(c)return c.story;throw e}}
const pk=id=>'sg_p_'+id+'_'+(U?U.id:'guest');
async function getProg(id){let l=JSON.parse(localStorage[pk(id)]||'null');if(U)try{const r=await get('progress/'+U.id+'/'+id);if(r&&(!l||r.t>l.t))l=r}catch(e){}return l}
function persist(){if(pre)return;const o={...P,t:Date.now()};localStorage[pk(GM.id)]=JSON.stringify(o);if(U)put('progress/'+U.id+'/'+GM.id,o).catch(()=>{})}
async function start(id,pr){pre=pr?1:0;U=me();if(pr){S=JSON.parse(localStorage.sg_preview);GM={id:'preview',title:S.title}}else{GM=LIST[id];try{S=await loadStory(GM)}catch(e){return toast('تعذّر التحميل: لا اتصال ولا نسخة محفوظة')}}
S.theme=S.theme||{};V0={};if(GM.prev){const q=await getProg(GM.prev);V0={...(q?.vars||{})}}
const p=pr?null:await getProg(GM.id);P=p&&!p.done&&S.scenes[p.scene]?p:{scene:S.start,vars:{...V0},ch:'',done:0};
const t=S.theme,n=t.mode!='day',st=$('#st');st.style.setProperty('--sb',t.mode=='custom'?(t.bg||'#10131c'):n?'#0c0f16':'#f2efe8');st.style.setProperty('--st',t.mode=='custom'?(t.text||'#eee'):n?'#ece7da':'#1d1b17');st.style.fontFamily=(t.font||'Amiri')+',serif';st.style.fontSize=fs+'em';
$('#ls').hidden=1;$('#gm').hidden=0;go(P.scene)}
const clr=()=>{T.forEach(x=>{clearTimeout(x);clearInterval(x)});T=[]};
const ok=o=>!o||Object.entries(o).every(([k,v])=>String(P.vars[k])==String(v));
const bgi=u=>`url("${u.replace(/["\\]/g,'')}")`;
function back(){clr();au.pause();cm='';$('#gm').hidden=1;$('#ls').hidden=0;load()}
function add(box,b,now){const f=now?'none':b.fx||'fade';if(b.img)box.append(h('img',{class:'b fx-'+f,src:b.img}));if(!b.t)return;const e=h('p',{class:'b fx-'+f});if(b.color)e.style.color=b.color;if(b.font)e.style.fontFamily=b.font;if(b.size)e.style.fontSize=b.size+'em';if(b.who)e.append(h('b',{},b.who+': '));const t=b.t;if(f=='type'){const s=h('span');e.append(s);let k=0;T.push(setInterval(()=>{s.textContent=t.slice(0,++k)},35))}else e.append(t);box.append(e);e.scrollIntoView({behavior:'smooth',block:'end'})}
function go(id){clr();const sc=S.scenes[id];if(!sc)return fin();P.scene=id;persist();const st=$('#st');st.innerHTML='';const im=sc.bg||S.theme.img;st.style.backgroundImage=im?'linear-gradient(#0007,#000a),'+bgi(im):'';
if(sc.music){if(sc.music=='stop'){au.pause();cm=''}else if(sc.music!=cm){cm=sc.music;au.pause();au=new Audio(cm);au.loop=true;au.volume=.5;if(!mute)au.play().catch(()=>{})}}if(sc.sfx&&!mute){sx=new Audio(sc.sfx);sx.play().catch(()=>{})}
let bl=[...(sc.blocks||[])];if(sc.chapter&&sc.chapter!=P.ch){const c=(S.chapters||[]).find(x=>x.id==sc.chapter);P.ch=sc.chapter;if(c){bl=[{t:c.title,fx:'zoom',size:2,delay:0},...bl];if(bl[1])bl[1]={...bl[1],delay:(bl[1].delay||0)+1.5}}}
const box=h('div',{class:'bx'}),cb=h('div',{class:'cb'});st.append(box,cb);let i=0,dn=0;
const nx=()=>{const b=bl[i++];add(box,b);const d=((bl[i]?.delay||0)*1000)+(b.fx=='type'?(b.t||'').length*35:0);T.push(setTimeout(i<bl.length?nx:done,i<bl.length?d:600))};
st.onclick=()=>{if(!dn){clr();while(i<bl.length)add(box,bl[i++],1);done()}};
function done(){if(dn)return;dn=1;const ch=(sc.choices||[]).map((c,k)=>({...c,k})).filter(c=>ok(c.if));
const pick=c=>{Object.assign(P.vars,c.set||{});persist();c.goto?go(c.goto):sc.next?go(sc.next):fin()};
if(!ch.length){if(sc.end||!sc.next)return fin();const b=h('button',{class:'ch'},'متابعة');b.onclick=()=>go(sc.next);cb.append(b);b.scrollIntoView({behavior:'smooth',block:'end'});return}
let lock=0,tb,iv;const bs=ch.map(c=>{const b=h('button',{class:'ch'},c.text);b.onclick=()=>{if(lock)return;lock=1;clr();if(iv){iv.style.width=getComputedStyle(iv).width;iv.style.transition='none'}b.classList.add('pick');T.push(setTimeout(()=>pick(c),450))};return b});
const t=+sc.timer||0;if(t>0){iv=h('i');tb=h('div',{class:'tb'},iv);cb.append(tb)}cb.append(...bs);bs[0].scrollIntoView({behavior:'smooth',block:'end'});
if(t>0){requestAnimationFrame(()=>requestAnimationFrame(()=>{iv.style.transition=`width ${t}s linear`;iv.style.width='0%'}));
T.push(setTimeout(()=>{lock=1;bs.forEach(x=>x.classList.add('bad'));let d=ch.findIndex(c=>c.k==(+sc.default||0));if(d<0)d=0;bs[d].classList.replace('bad','good');tb.style.opacity=0;T.push(setTimeout(()=>pick(ch[d]),1300))},t*1000))}}
if(bl.length)T.push(setTimeout(nx,(bl[0].delay||0)*1000));else done()}
function fin(){clr();P.done=1;persist();const st=$('#st');st.onclick=null;st.innerHTML='';const nxp=Object.values(LIST).find(x=>x.prev==GM.id);st.append(h('div',{class:'cb',style:'text-align:center'},h('p',{class:'b fx-zoom',style:'font-size:2em'},'انتهت الرواية'),nxp?h('button',{class:'ch',onclick:()=>start(nxp.id)},'ابدأ الجزء التالي: '+nxp.title):'',h('button',{class:'ch',onclick:()=>{P={scene:S.start,vars:{...V0},ch:'',done:0};go(S.start)}},'أعد من البداية'),h('button',{class:'ch',onclick:back},'العودة للمكتبة')))}
function setd(){const r=h('input',{type:'range',min:.8,max:1.6,step:.1,value:fs,oninput:e=>{fs=+e.target.value;localStorage.sg_fs=fs;$('#st').style.fontSize=fs+'em'}}),m=h('input',{type:'checkbox',checked:mute,onchange:e=>{mute=e.target.checked;localStorage.sg_mute=mute?1:0;mute?au.pause():au.play().catch(()=>{})}}),f=h('input',{type:'file',accept:'.json',onchange:async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!S.scenes[o.scene])throw 0;P=o;P.done=0;persist();d.close();go(P.scene)}catch(x){toast('ملف حفظ غير صالح')}}});
const d=dlg(h('h3',{},'الإعدادات'),h('label',{},'حجم الخط',r),h('label',{class:'row'},m,'كتم الصوت'),h('div',{class:'row'},h('button',{class:'g',onclick:()=>dl('save-'+GM.id+'.json',JSON.stringify(P))},'تصدير الحفظ'),h('button',{class:'g',onclick:()=>f.click()},'استيراد حفظ')),h('button',{class:'g',onclick:()=>{P={scene:S.start,vars:{...V0},ch:'',done:0};d.close();go(S.start)}},'إعادة من البداية'),closeBtn())}
bar();pre=new URLSearchParams(location.search).has('preview');if(pre){LIST={};start(null,1)}else load();
</script>
