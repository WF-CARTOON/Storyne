<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار showSaveFilePicker</title>
<style>
  :root{color-scheme:dark light}
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#0f1419;color:#e6edf3}
  h1{font-size:18px;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  button{flex:1 1 140px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
  button.alt{background:#334155}
  #status{padding:10px 12px;border-radius:10px;background:#1c2530;margin-bottom:12px;font-size:14px;line-height:1.8}
  #log{background:#0b0f14;border-radius:10px;padding:10px;min-height:160px;font:13px/1.8 ui-monospace,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word}
  .ok{color:#4ade80}.bad{color:#f87171}
</style>
</head>
<body>
<h1>اختبار showSaveFilePicker</h1>
<div id="status">جارٍ الفحص…</div>
<div class="row">
  <button id="bCheck" class="alt">إعادة الفحص</button>
  <button id="bTxt">حفظ ملف نصي</button>
  <button id="bJson">حفظ JSON</button>
  <button id="bClear" class="alt">مسح السجل</button>
</div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
function log(msg, cls){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'  '+msg;
  $('log').appendChild(line);
}
function check(tag){
  const bridge = typeof window.RosTrickSaveBridge;
  const picker = typeof window.showSaveFilePicker;
  const ok = picker === 'function';
  log('['+tag+'] RosTrickSaveBridge: '+bridge+' | showSaveFilePicker: '+picker+' | secure: '+window.isSecureContext, ok ? 'ok' : 'bad');
  $('status').innerHTML =
    'الجسر (RosTrickSaveBridge): <b>'+bridge+'</b><br>'+
    'الدالة (showSaveFilePicker): <b class="'+(ok?'ok':'bad')+'">'+picker+'</b>';
  return ok;
}
async function save(name, text, mime){
  if (typeof window.showSaveFilePicker !== 'function'){
    log('showSaveFilePicker غير متاحة الآن — أعد الفحص بعد ثانيتين من فتح الصفحة', 'bad');
    return;
  }
  try{
    log('فتح نافذة الحفظ…');
    const h = await window.showSaveFilePicker({
      suggestedName: name,
      types: [{description: name, accept: {[mime]: [name.slice(name.lastIndexOf('.'))]}}]
    });
    log('تم اختيار: '+h.name);
    const w = await h.createWritable();
    await w.write(text);
    await w.close();
    log('تمت الكتابة والإغلاق بنجاح', 'ok');
  }catch(e){
    if (e && e.name === 'AbortError') log('أُلغي الحفظ من المستخدم');
    else log('فشل: '+(e && e.name)+' — '+(e && e.message), 'bad');
  }
}
$('bCheck').onclick = () => check('يدوي');
$('bClear').onclick = () => { $('log').textContent = ''; };
$('bTxt').onclick = () => save('اختبار.txt', 'مرحباً من RosTrick\n'+new Date().toISOString(), 'text/plain');
$('bJson').onclick = () => save('test.json', JSON.stringify({ok:true,time:Date.now()},null,2), 'application/json');

log('UA: '+navigator.userAgent.slice(0,90));
check('فوري');
setTimeout(() => check('بعد 1.5ث'), 1500);
setTimeout(() => check('بعد 4ث'), 4000);
</script>
</body>
</html>
