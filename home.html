<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070c">
<title>مملكة الدقائق المسروقة — نموذج المرحلة 5</title>
<style>
:root{--ink:#e4ddcc;--dim:rgba(228,221,204,.56);--faint:rgba(228,221,204,.3);--line:rgba(228,221,204,.14);--brass:#d6a54a;--brass2:#8f6a26;
  --deep:#05070c;--teal:#2fd6c4;--danger:#d98a80;--sheet:rgba(7,10,16,.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:var(--ink);
  font-family:"Noto Sans Arabic","Noto Kufi Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,"DejaVu Sans",system-ui,sans-serif;font-weight:300}
#app{position:fixed;left:0;top:0;right:0;bottom:0;direction:ltr;overflow:hidden}
/* the picture is ONE opaque canvas (sky, parallax backdrops, wall gears, ground, props, hero, vignette + grain are all blitted into it); the fade is a plain overlay.
   Everything except the canvas only moves by transform or opacity, so the graphics chip does that work instead of the canvas rasteriser. */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#05070c;contain:layout paint}
#stage canvas{display:block}
#game{position:absolute;left:0;top:0;width:100%;height:100%}
#fade{position:absolute;pointer-events:none;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;visibility:hidden}
button{font:inherit;color:inherit}

/* ---------- HUD: small and quiet, fades out when nothing changes ---------- */
#hud{position:absolute;left:0;top:0;right:0;pointer-events:none;z-index:5;display:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px);
  justify-content:space-between;align-items:flex-start;transition:opacity .7s}
#hud.on{display:flex}
#hud.idle{opacity:.4}
#hud-left{display:flex;flex-direction:column;gap:9px;align-items:flex-start}
#hp{display:flex;gap:7px}
#hp i{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--brass);display:block;position:relative;background:rgba(5,7,12,.55);transition:border-color .3s,opacity .3s}
#hp i::before,#hp i::after{content:"";position:absolute;left:50%;bottom:50%;width:1.5px;margin-left:-.75px;background:var(--brass);transform-origin:50% 100%;border-radius:1px}
#hp i::before{height:5px;transform:rotate(-60deg)}
#hp i::after{height:7px;transform:rotate(60deg)}
#hp i.lost{border-color:var(--faint);opacity:.55}
#hp i.lost::before,#hp i.lost::after{opacity:0}
#hp i.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1.55)}100%{transform:scale(1)}}
#sp{width:112px;height:2px;background:rgba(228,221,204,.18);position:relative;transition:height .2s}
#sp i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teal);transition:width .15s}
#sp.full{height:3px}
#sp.full i{box-shadow:0 0 9px var(--teal);animation:glow 1.1s infinite alternate}
#sp.deny{animation:shake .25s}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#gears{display:flex;align-items:center;gap:6px;font-weight:400;font-size:15px;color:var(--dim);font-family:system-ui,sans-serif}
#gears svg{width:15px;height:15px;fill:none;stroke:var(--brass);stroke-width:1.8;stroke-linejoin:round}
#gears b{font-weight:400;min-width:1.5em}
#gears.pop b{animation:pop .3s}
#lostc{display:flex;align-items:center;font-weight:400;font-size:15px;color:var(--dim);font-family:system-ui,sans-serif;direction:ltr}
#lostc svg{width:15px;height:15px;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:round;margin-right:6px}
#lostc b{font-weight:400;min-width:2em}
#lostc.pop b{animation:pop .3s}
#boss{position:absolute;left:50%;top:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:34vw;max-width:440px;min-width:200px;transform:translateX(-50%);z-index:5;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;text-align:center}
#boss.on{opacity:1;visibility:visible}
#boss-name{font-size:14px;letter-spacing:.06em;color:var(--ink);margin-bottom:5px;text-shadow:0 1px 3px #000}
#boss-bar{position:relative;height:9px;border:1px solid var(--brass);background:rgba(5,7,12,.7);direction:ltr}
#boss-fill{display:block;height:100%;width:100%;background:#c9573f;transition:width .25s}
#boss.p2 #boss-fill{background:#e0564a;box-shadow:0 0 8px rgba(224,86,74,.7)}
#boss-bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--brass);opacity:.8;text-decoration:none}
#btn-pause{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(214,165,74,.55);background:rgba(5,7,12,.5);padding:0;cursor:pointer;opacity:.7;display:flex;align-items:center;justify-content:center}
#btn-pause svg{width:100%;height:100%}
#btn-pause .t{stroke:rgba(214,165,74,.6);stroke-width:1}
#btn-pause .b{fill:var(--ink)}
#btn-pause:active{background:rgba(47,214,196,.2);border-color:var(--teal)}
#perf{position:absolute;left:8px;bottom:8px;margin:0;z-index:6;display:none;pointer-events:none;direction:ltr;text-align:left;
  font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#9fffe8;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:4px;white-space:pre}
#perf.on{display:block}
html.noanim *{animation:none!important;transition:none!important}
#dx{position:absolute;top:3px;left:50%;transform:translateX(-50%);z-index:9;display:none;flex-wrap:wrap;gap:3px;justify-content:center;max-width:46%;pointer-events:auto;direction:ltr}
#dx.on{display:flex}
#dx button{font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;padding:5px 6px;border-radius:4px;border:1px solid rgba(228,221,204,.55);background:rgba(5,7,12,.72);color:#e4ddcc;cursor:pointer;min-width:30px}
#dx button.x{color:#ff9a8a;border-color:#ff9a8a;text-decoration:line-through;opacity:.85}
#dx button.a{color:#06121a;background:var(--teal);border-color:var(--teal)}

#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%) translateY(-6px);opacity:0;z-index:30;pointer-events:none;
  background:rgba(5,8,14,.82);border-top:1px solid rgba(47,214,196,.6);border-bottom:1px solid var(--line);padding:9px 24px;font-size:16px;font-weight:300;
  letter-spacing:.02em;transition:opacity .3s,transform .3s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- touch controls: brass watch dials ---------- */
#touch{position:absolute;left:env(safe-area-inset-left,0px);top:0;right:env(safe-area-inset-right,0px);bottom:0;z-index:8;display:none;pointer-events:none;--k:5px;--ta:.75}
#touch.on{display:block}
#stick-zone{position:absolute;left:0;top:0;bottom:0;width:48%;pointer-events:auto;touch-action:none}
#stick-base{border-radius:50%;pointer-events:none}
#stick-base{position:absolute;width:calc(var(--k)*26);height:calc(var(--k)*26);transform:translate(-50%,-50%);display:none;opacity:calc(var(--ta) + .2)}
#stick-base.on{display:block}
#stick-base svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.dial-face{fill:rgba(7,10,16,.5);stroke:rgba(214,165,74,.7);stroke-width:1.2}
.dial-mt{fill:none;stroke:rgba(214,165,74,.4)}
.dial-ht{fill:none;stroke:rgba(228,221,204,.75)}
#stick-hand{stroke:var(--teal);stroke-width:1.6;stroke-linecap:round;opacity:.9}
#stick-knob{position:absolute;left:50%;top:50%;width:calc(var(--k)*12);height:calc(var(--k)*12);border-radius:50%;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,#d9ad55 0 3.5deg,#a67c33 3.5deg 7deg);box-shadow:0 0 0 2px rgba(23,18,28,.92),0 3px 12px rgba(0,0,0,.55)}
#stick-knob i{position:absolute;left:22%;top:22%;right:22%;bottom:22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c8963a 60%,#7a5518);box-shadow:inset 0 0 0 1px rgba(23,18,28,.6)}
.tb{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;opacity:var(--ta);transition:transform .08s,opacity .25s;color:var(--ink)}
.tb svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;overflow:visible}
.tb .face{fill:rgba(7,10,16,.8);stroke:rgba(214,165,74,.9);stroke-width:1.6;transition:fill .08s,stroke .08s}
.tb .mt{fill:none;stroke:rgba(214,165,74,.5)}
.tb .ht{fill:none;stroke:rgba(228,221,204,.85)}
.tb .ic{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .08s}
.tb .cd{fill:none;stroke:rgba(4,6,10,.7)}
.tb .ring{fill:none;stroke:var(--teal);stroke-width:2.6;stroke-linecap:round}
.tb.p{transform:scale(.92)}
.tb.p .face{fill:rgba(32,44,64,.92);stroke:var(--teal)}
.tb.p .ic{stroke:#ffffff}
.tb.ready .ring{filter:drop-shadow(0 0 3px var(--teal))}
.tb.ready .ic{stroke:#bff6ee}
.tb .lb{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-size:calc(var(--k)*2.3);font-weight:400;line-height:1;color:rgba(228,221,204,.85);pointer-events:none;letter-spacing:.02em}
.tb.nolb .lb{display:none}
.tb.lbl:not(.nolb) .ic{transform:translateY(-6px)}
#tb-interact:not(.ready){opacity:calc(var(--ta)*.3);transform:scale(.86)}
#tb-interact.ready .face{stroke:var(--teal)}
#tb-interact.ready{animation:pulse 1.2s infinite alternate}
@keyframes pulse{from{opacity:calc(var(--ta)*.62)}to{opacity:var(--ta)}}
#tb-jump{right:calc(var(--k)*5);bottom:calc(var(--k)*6);width:calc(var(--k)*23);height:calc(var(--k)*23)}
#tb-attack{right:calc(var(--k)*31);bottom:calc(var(--k)*6);width:calc(var(--k)*20);height:calc(var(--k)*20)}
#tb-dodge{right:calc(var(--k)*6);bottom:calc(var(--k)*32);width:calc(var(--k)*18);height:calc(var(--k)*18)}
#tb-special{right:calc(var(--k)*27);bottom:calc(var(--k)*29);width:calc(var(--k)*15);height:calc(var(--k)*15)}
#tb-interact{right:calc(var(--k)*54);bottom:calc(var(--k)*18);width:calc(var(--k)*15);height:calc(var(--k)*15)}

/* ---------- screens: flat, dark, text-first ---------- */
.screen{position:absolute;left:0;top:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px;
  background:radial-gradient(ellipse at 50% 55%,rgba(4,6,10,.58),rgba(4,6,10,.9));opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility 0s linear .35s}
.screen.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease,visibility 0s}
#scr-start{background:radial-gradient(ellipse at 50% 55%,rgba(4,6,10,.8),rgba(4,6,10,.95))}
#scr-pause{background:rgba(4,6,10,.78)}
#scr-settings,#scr-controls,#scr-perf{background:rgba(4,6,10,.84)}
.start{display:flex;align-items:center;justify-content:center;gap:clamp(24px,7vw,110px);width:100%;max-width:1100px;width:min(1100px,100%);padding:0 4vw}
.brand{flex:1 1 52%;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.emblem{width:230px;height:230px;max-width:38vh;max-height:38vh;width:min(38vh,230px);height:min(38vh,230px);margin-bottom:16px;margin-bottom:clamp(10px,3vh,26px);overflow:visible}
.emblem .ring{fill:none;stroke:var(--line);stroke-width:1}
.emblem .tk{stroke:rgba(228,221,204,.55);stroke-width:1.1}
.emblem .tk.h{stroke:rgba(228,221,204,.9);stroke-width:2}
.emblem .hand{stroke:var(--ink);stroke-linecap:round}
.emblem .gap{fill:var(--teal);animation:blink 2.4s infinite ease-in-out}
.emblem #emb-sec{stroke:var(--teal);stroke-width:1;stroke-linecap:round;transition:transform .28s cubic-bezier(.3,1.7,.5,1);transform-origin:100px 100px}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.title{font-size:4.6vw;font-size:clamp(28px,5.2vw,58px);font-weight:300;text-align:center;margin:0;line-height:1.25;color:#f1ead8;letter-spacing:0}
html[lang=en] .title{letter-spacing:.05em}
.sub{text-align:center;color:var(--dim);margin:10px 0 0;font-size:15px;font-size:clamp(12px,1.6vw,16px);letter-spacing:.04em}
.menu{flex:1 1 40%;display:flex;flex-direction:column;min-width:0;max-width:420px}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:0;cursor:pointer;padding:12px 4px;padding:clamp(8px,1.9vh,15px) 4px;font-size:20px;font-size:clamp(16px,2.5vw,22px);
  font-weight:300;letter-spacing:.02em;color:var(--dim);border-bottom:1px solid var(--line);transition:color .2s,gap .25s;touch-action:manipulation;font-family:inherit}
.mi i{display:block;width:0;height:1px;background:var(--teal);transition:width .25s}
.mi:hover{color:#f6efdc;gap:12px;outline:none}
.mi:focus-visible{color:#f6efdc;gap:12px;outline:none}
.mi:hover i{width:22px}
.mi:focus-visible i{width:22px}
.mi.main{color:#f1ead8}
.mi.danger{color:var(--danger)}
.mi:active{color:var(--teal)}
.menu .note{margin:12px 4px 0;margin:clamp(8px,2vh,18px) 4px 0;font-size:12px;line-height:1.6;color:var(--faint)}
.pause{display:flex;flex-direction:column;align-items:center;width:380px;max-width:100%;width:min(380px,100%)}
.pause h2{margin:0 0 16px;margin:0 0 clamp(8px,2.6vh,22px);font-size:28px;font-size:clamp(22px,3.2vw,32px);font-weight:300;letter-spacing:.06em;color:#f1ead8}
.pause .menu{width:100%}
.sheet{width:680px;max-width:100%;width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:4px}
.sheet header{padding:16px 22px 6px}
.sheet h2{margin:0;font-size:22px;font-weight:300;letter-spacing:.05em;color:#f1ead8}
.sheet h2::after{content:"";display:block;width:28px;height:1px;background:var(--teal);margin-top:9px}
.sheet .body{overflow:auto;padding:0 22px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.sheet footer{display:flex;gap:22px;align-items:center;justify-content:space-between;padding:10px 22px 14px;border-top:1px solid var(--line)}
.lnk{all:unset;cursor:pointer;font-size:16px;color:var(--dim);padding:8px 2px;border-bottom:1px solid transparent;touch-action:manipulation;font-family:inherit;font-weight:300}
.lnk:hover{color:#f6efdc;border-bottom-color:var(--teal)}
.lnk:focus-visible{color:#f6efdc;border-bottom-color:var(--teal)}
.lnk.main{color:#f1ead8}
.lnk.danger{color:var(--danger)}
.sec{margin:16px 0 2px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
html[lang=ar] .sec{letter-spacing:.04em;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;color:#d9d3c4}
.row label{flex:1;min-width:0}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:14px;color:var(--dim);border-bottom:1px solid transparent;touch-action:manipulation;font-family:inherit}
.seg button:hover{color:#f6efdc}
.seg button.on{color:#f6efdc;border-bottom-color:var(--teal)}
.sw{width:44px;height:24px;border-radius:12px;border:1px solid rgba(228,221,204,.38);position:relative;background:transparent;cursor:pointer;padding:0;flex:0 0 auto;transition:border-color .2s;touch-action:manipulation}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:14px;height:14px;border-radius:50%;background:rgba(228,221,204,.6);transition:transform .2s,background .2s}
.sw.on{border-color:var(--teal)}
.sw.on::after{transform:translateX(20px);background:var(--teal)}
input[type=range]{-webkit-appearance:none;appearance:none;direction:ltr;width:220px;max-width:44vw;width:min(220px,44vw);height:30px;margin:0;padding:0;cursor:pointer;touch-action:pan-y;
  background:linear-gradient(90deg,var(--teal) var(--p,50%),rgba(228,221,204,.25) var(--p,50%)) center/100% 2px no-repeat;border-radius:0}
input[type=range]::-webkit-slider-runnable-track{height:30px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#05070c;border:2px solid var(--teal);margin-top:7px}
input[type=range]::-moz-range-track{height:2px;background:transparent}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#05070c;border:2px solid var(--teal)}
input[type=range]:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
.note{color:var(--dim);font-size:13px;margin:10px 0 0;line-height:1.6}
.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.key{font:400 14px ui-monospace,Menlo,Consolas,system-ui,sans-serif;min-width:58px;min-height:32px;padding:4px 8px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;touch-action:manipulation}
.key:hover{border-color:var(--faint)}
.key.empty{opacity:.45}
.key.listen{border-color:var(--teal);color:var(--teal);animation:glow .6s infinite alternate}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:14px;touch-action:manipulation;font-family:inherit}
.chip:hover{color:#f6efdc;border-color:var(--teal)}
.chip:focus-visible{color:#f6efdc;border-color:var(--teal)}
.chip:active{background:rgba(47,214,196,.15)}
table.res{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;text-align:center}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:6px 4px}
table.res th{color:var(--dim);font-weight:400;font-size:12px}
.verdict{font-size:20px;text-align:center;margin:12px 0;color:#f1ead8}
#stress-live{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:12;display:none;background:rgba(5,8,14,.88);border-top:1px solid var(--teal);border-bottom:1px solid var(--line);
  padding:9px 22px;font-size:16px;text-align:center}
#stress-live.on{display:block}
#rotate{position:absolute;left:0;top:0;right:0;bottom:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;
  background:var(--deep);text-align:center;padding:30px;font-size:20px}
#rotate.on{display:flex}
#rotate .ph{width:64px;height:104px;border:2px solid var(--brass);border-radius:12px;animation:rot 2.2s infinite ease-in-out;position:relative}
#rotate .ph::after{content:"";position:absolute;left:50%;top:8px;width:16px;height:2px;margin-left:-8px;background:var(--brass);opacity:.6}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* WebViews without flex "gap" (Chrome before 84): the same spacing as margins (script adds html.ngap when it detects that) */
.ngap #hud-left>*+*{margin-top:9px}
.ngap #hp i+i{margin-inline-start:7px}
.ngap #gears>*+*{margin-inline-start:6px}
.ngap #dx button{margin:1.5px}
.ngap .start>*+*{margin-inline-start:7vw}
.ngap .sheet footer>*+*{margin-inline-start:22px}
.ngap .row>*+*{margin-inline-start:16px}
.ngap .seg>*{margin:2px}
.ngap .keys>*{margin:3px}
.ngap .chips>*{margin:3px}
.ngap #rotate>*+*{margin-top:20px}
.ngap .mi i{margin-inline-end:0;transition:width .25s,margin .25s}
.ngap .mi:hover i{margin-inline-end:12px}
@media (max-height:520px){
  .screen{padding:6px}
  .emblem{width:120px;height:120px;max-width:34vh;max-height:34vh;width:min(34vh,120px);height:min(34vh,120px);margin-bottom:6px}
  .sub{margin-top:4px}
  .mi{padding:7px 4px;font-size:16px}
  .menu .note{display:none}
  .sheet header{padding:10px 18px 2px}
  .sheet h2{font-size:19px}
  .sheet .body{padding:0 18px 4px}
  .sheet footer{padding:6px 18px 10px}
  .row{padding:7px 0;font-size:15px}
  .sec{margin-top:10px}
  .note{font-size:12px}
}
@media (prefers-reduced-motion:reduce){#hp i.pop,#sp.full i,.key.listen,#rotate .ph,.emblem .gap,#tb-interact.ready{animation:none}.screen{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">

/* ---------- 2. small helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const rnd = (a, b) => a + Math.random() * (b - a);
function rng32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 3. storage (localStorage with in-memory fallback) ---------- */
const Store = (function () {
  let ok = true; const mem = {};

    ok: ok,
    get(k) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { let s; try { s = JSON.stringify(v); } catch (e) { return false; }
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; return true; } catch (e) { mem[k] = s; return false; } },
    del(k) { try { if (ok) localStorage.removeItem(k); } catch (e) { /* ignore */ } delete mem[k]; }
  };
})();

}

  const d = defaults(), o = Store.get(SAVE_KEY);

  pick('shake', v => typeof v === 'boolean');
  if (o.keys && typeof o.keys === 'object') {
    ACTIONS.forEach(a => { if (Array.isArray(o.keys[a])) d.keys[a] = o.keys[a].filter(x => typeof x === 'string').slice(0, 3); });

  }
  if (o.stress && typeof o.stress === 'object') d.stress = o.stress;
  return d;
}
let S = loadSettings();
function persist() { Store.set(SAVE_KEY, S); }

  P.x += dx;
  const tx0 = Math.floor((P.x - hw) / U), tx1 = Math.floor((P.x + hw - 0.001) / U);
  const ty0 = Math.floor((P.y - P.h) / U), ty1 = Math.floor((P.y - 0.001) / U);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    if (!solidT(tileAt(tx, ty))) continue;
    if (dx > 0) P.x = Math.min(P.x, tx * U - hw - 0.001); else P.x = Math.max(P.x, (tx + 1) * U + hw + 0.001);
    P.vx = 0;
  }
}
function moveY(dy) {
  const hw = P.w / 2, prevBottom = P.y, prevTop = P.y - P.h;
  P.onGround = false;
  P.y += dy;
  if (dy >= 0) {
    const tx0 = Math.floor((P.x - hw + 0.5) / U), tx1 = Math.floor((P.x + hw - 0.5) / U);
    const ty0 = Math.floor((prevBottom - 1) / U), ty1 = Math.floor(P.y / U);
    for (let ty = ty0; ty <= ty1; ty++) {
      const top = ty * U;
      if (!(prevBottom <= top + 0.5 && P.y >= top)) continue;
      for (let tx = tx0; tx <= tx1; tx++) {
        const v = tileAt(tx, ty);
        if (solidT(v) || (v === 2 && P.drop <= 0)) { P.y = top; P.vy = 0; P.onGround = true; }
      }
    }
  } else {
    const tx0 = Math.floor((P.x - hw + 0.5) / U), tx1 = Math.floor((P.x + hw - 0.5) / U);
    const newTop = P.y - P.h;
    const ty0 = Math.floor(newTop / U), ty1 = Math.floor((prevTop - 1) / U);
    for (let ty = ty1; ty >= ty0; ty--) {
      const bot = (ty + 1) * U;
      if (!(prevTop >= bot - 0.5 && newTop < bot)) continue;
      let hit = false;
      for (let tx = tx0; tx <= tx1; tx++) if (solidT(tileAt(tx, ty))) { hit = true; break; }
      if (!hit) continue;
      let fixed = false;                              // corner correction: slide around a clipped ledge
      for (let off = 3; off <= 12 && !fixed; off += 3) {
        for (let s = -1; s <= 1 && !fixed; s += 2) if (boxFree(P.x + s * off, P.y)) { P.x += s * off; fixed = true; }
      }
      if (!fixed) { P.y = bot + P.h; P.vy = 0; Cam.shake(2, 0.06); }
    }
  }
}

function depenetrate() {            // safety net: if the box still overlaps a solid tile (corner clips, teleports), push it out the shortest way
  const hw = P.w / 2;
  for (let it = 0; it < 3; it++) {
    const x0 = Math.floor((P.x - hw + 0.01) / U), x1 = Math.floor((P.x + hw - 0.01) / U);
    const y0 = Math.floor((P.y - P.h + 0.01) / U), y1 = Math.floor((P.y - 0.01) / U);
    let moved = false;
    for (let ty = y0; ty <= y1 && !moved; ty++) for (let tx = x0; tx <= x1 && !moved; tx++) {
      if (!solidT(tileAt(tx, ty))) continue;
      const tl = tx * U, tr = tl + U, tt = ty * U, tb = tt + U;
      const pl = (P.x + hw) - tl, pr = tr - (P.x - hw), pu = P.y - tt, pd = tb - (P.y - P.h);
      const m = Math.min(pl, pr, pu, pd);
      if (m === pu) { P.y = tt; if (P.vy > 0) P.vy = 0; P.onGround = true; }
      else if (m === pd) { P.y = tb + P.h; if (P.vy < 0) P.vy = 0; }
      else if (m === pl) { P.x = tl - hw - 0.001; if (P.vx > 0) P.vx = 0; }
      else { P.x = tr + hw + 0.001; if (P.vx < 0) P.vx = 0; }
      moved = true;
    }
    if (!moved) break;
  }
  if (!boxFree(P.x, P.y)) {                                    // still buried (deep overlap): lift straight up to the first free spot
    for (let d = 2; d <= 10 * U; d += 2) if (boxFree(P.x, P.y - d)) { P.y -= d; P.vy = Math.min(P.vy, 0); P.vx = 0; break; }
  }
}

/* --- state helpers --- */
function setState(s) { P.state = s; P.st = 0; }
function hasSupport() {   // both sides at least half a unit over solid / one-way tiles: used for the "last safe platform"
  const ty = Math.floor((P.y + 2) / U), m = 0.5 * U;
  const a = tileAt(Math.floor((P.x - m) / U), ty), b = tileAt(Math.floor((P.x + m) / U), ty);
  return (a === 1 || a === 2) && (b === 1 || b === 2);
}
function startJump() {
  P.vy = -TUNE.jumpV; P.onGround = false; P.coyote = 0; P.jumped = true; P.cutDone = false; P.stable = 0;
  Input.consume('jump'); Snd.play('jump'); FX.dust(P.x, P.y, 4, -P.dir); P.squash = -0.18;
  setState('jump');
}
function startDodge() {
  const ax = Input.axisX();
  P.dodgeDir = Math.abs(ax) > 0.3 ? sgn(ax) : P.dir; P.dir = P.dodgeDir;
  P.dodgeCd = TUNE.dodgeT + TUNE.dodgeCool; P.inv = Math.max(P.inv, TUNE.dodgeInv);
  Input.consume('dodge'); Snd.play('dodge'); FX.dust(P.x, P.y, 5, -P.dir); P.trailT = 0;
  setState('dodge');
}
function startAttack(n) {
  P.combo = n; P.phase = 'wind'; P.atkId = ++Game.atkSeq; P.atkHit = false;
  Input.consume('attack'); P.vx *= 0.35; Snd.play('swing', n); setState('attack');
}
function startAirAttack() {
  P.phase = 'wind'; P.atkId = ++Game.atkSeq; P.atkHit = false; P.airUsed = true;
  Input.consume('attack'); Snd.play('swing', 1); setState('airattack');
}
function startInteract(e) {
  P.target = e; P.didAct = false; P.dir = e.x >= P.x ? 1 : -1; P.vx = 0; Input.consume('interact');
  Snd.play('interact'); setState('interact');
}
function startSpecial() {
  Input.consume('special'); P.vx = 0; P.didAct = false; P.inv = Math.max(P.inv, TUNE.specialT); setState('special');
  FX.glow(P.x, P.y - 40, 50, 2, 0.5);
}
function hurtPlayer(srcX, dmg) {
  if (P.inv > 0 || P.dead || P.respawning) return false;
  P.hp = Math.max(0, P.hp - dmg); HUD.dirty = true; HUD.popIdx = P.hp;
  P.inv = TUNE.hurtInv; P.blink = TUNE.hurtInv; P.flash = 0.2; P.combo = 0; P.comboWin = 0;
  Game.hitStop = Math.max(Game.hitStop, 0.06); Cam.shake(7, 0.2);
  FX.sparks(P.x, P.y - 36, 8, 7);
  if (P.hp <= 0) { die(); return true; }
  const away = P.x >= srcX ? 1 : -1;
  P.vx = away * TUNE.hurtKB; P.vy = -TUNE.hurtLift; P.onGround = false; P.stun = TUNE.hurtStun;
  Snd.play('hurt'); setState('hurt');
  return true;
}
function die() {
  P.dead = true; P.vx = 0; P.hp = 0; Snd.play('death'); setState('death'); Cam.shake(6, 0.3);
}

/* --- attack hit detection --- */
function attackBox() {
  const d = P.dir, front = P.w / 2;
  if (P.state === 'airattack') {
    const x0 = d > 0 ? P.x - 0.3 * U : P.x - AIR_ATK.range, x1 = d > 0 ? P.x + AIR_ATK.range : P.x + 0.3 * U;
    return [x0, P.y - P.h - 0.1 * U, x1, P.y + 0.9 * U];
  }
  const r = ATK[P.combo].range;
  const x0 = d > 0 ? P.x + front - 6 : P.x - front - r, x1 = d > 0 ? P.x + front + r : P.x - front + 6;
  return [x0, P.y - P.h - 0.1 * U, x1, P.y + 4];
}
function doHits(dmg, heavy, stop) {
  const b = attackBox(); let n = 0;
  Hit.box = b; popBubbles(b);
  for (let i = 0; i < Level.ents.length; i++) {
    const e = Level.ents[i], eb = entBox(e);
    if (!eb || e.dead) continue;
    if (rectsOverlap(b[0], b[1], b[2], b[3], eb[0], eb[1], eb[2], eb[3]) && damageEnt(e, dmg, P.dir, heavy, P.atkId)) n++;
  }
  if (n > 0) {
    if (!P.atkHit) {
      P.atkHit = true; Snd.play('hit', heavy);
      Game.hitStop = Math.max(Game.hitStop, stop); Cam.shake(heavy ? 6 : 3, heavy ? 0.16 : 0.09);
      P.special = Math.min(100, P.special + 20 * n); HUD.dirty = true;
    }
  }
  return n;
}

/* --- main per-step update --- */
function playerUpdate(dt) {
  const p = P;
  p.st += dt; p.animT += dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.blink > 0) p.blink -= dt;
  if (p.flash > 0) p.flash -= dt;
  if (p.dodgeCd > 0) p.dodgeCd -= dt;
  if (p.drop > 0) p.drop -= dt;
  if (p.landT > 0) p.landT -= dt;
  if (p.landLock > 0) p.landLock -= dt;
  if (p.comboWin > 0) p.comboWin -= dt;
  p.squash *= Math.max(0, 1 - 9 * dt);

  const ctl = Input.enabled && !p.respawning && !p.dead;
  const ax = ctl ? Input.axisX() : 0;
  p.lastAxis = ax;
  p.noGrav = false;

  switch (p.state) {
    case 'death': updDeath(dt); break;
    case 'hurt': updHurt(dt); break;
    case 'dodge': updDodge(dt); break;
    case 'attack': updAttack(dt, ctl); break;
    case 'airattack': updAirAttack(dt, ax); break;
    case 'interact': updInteract(dt); break;
    case 'special': updSpecial(dt); break;
    default: updFree(dt, ax, ctl);
  }

  /* gravity + integration */
  if (!p.noGrav) {
    let g = TUNE.grav;
    if (p.vy > 0) g *= TUNE.fallMult;
    else if (p.jumped && Math.abs(p.vy) < TUNE.apexBand && Input.held('jump')) g *= TUNE.apexMult;
    p.vy = Math.min(TUNE.maxFall, p.vy + g * dt);
  }
  p.preVy = p.vy;
  moveX(p.vx * dt);
  moveY(p.vy * dt);
  depenetrate();

  /* landing */
  if (p.onGround && !p.wasGround) onLand();
  if (p.onGround) { p.coyote = TUNE.coyote; p.jumped = false; p.airUsed = false; }
  else if (p.coyote > 0) p.coyote -= dt;
  p.wasGround = p.onGround;

  /* footsteps */
  if (p.onGround && (p.state === 'walk' || p.state === 'run')) {
    p.stepDist += Math.abs(p.vx) * dt;
    const stride = p.state === 'run' ? 1.5 * U : 1.0 * U;
    if (p.stepDist > stride) { p.stepDist = 0; Snd.play('step', tileAt(Math.floor(p.x / U), Math.floor((p.y + 2) / U))); if (p.state === 'run') FX.dust(p.x, p.y, 2, -p.dir); }
  } else if (!p.onGround) p.stepDist = 0;

  /* last safe platform */
  if (p.onGround && !p.dead && hasSupport() && p.state !== 'hurt') {
    p.stable += dt;
    if (p.stable > 0.25) { p.safeX = p.x; p.safeY = p.y; }
  } else p.stable = 0;

  /* hazards */
  if (!p.dead && !p.respawning) {
    const tx0 = Math.floor((p.x - p.w / 2) / U), tx1 = Math.floor((p.x + p.w / 2) / U);
    const ty0 = Math.floor((p.y - p.h) / U), ty1 = Math.floor((p.y - 1) / U);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      if (tileAt(tx, ty) !== 3) continue;
      if (rectsOverlap(p.x - p.w / 2 + 5, p.y - p.h + 10, p.x + p.w / 2 - 5, p.y, tx * U + 5, ty * U + 0.4 * U, (tx + 1) * U - 5, (ty + 1) * U)) hurtPlayer(tx * U + U / 2, 1);
    }
    if (p.y - p.h > Level.h * U + 30) pitFall();
  }

  /* animation state for ground/air */
  if (p.state === 'idle' || p.state === 'walk' || p.state === 'run' || p.state === 'jump' || p.state === 'fall') pickLocomotionState();
  if (p.state === 'idle') p.idleT += dt; else p.idleT = 0;

  /* interaction target */
  p.target = (p.onGround && (p.state === 'idle' || p.state === 'walk' || p.state === 'run')) ? nearInteract() : (p.state === 'interact' ? p.target : null);
}

function pickLocomotionState() {
  const p = P, old = p.state;
  let s;
  if (!p.onGround) s = p.vy < 0 ? 'jump' : 'fall';
  else {
    const sp = Math.abs(p.vx);
    s = sp < 0.25 * U ? 'idle' : (sp <= TUNE.walk * 1.18 ? 'walk' : 'run');
  }
  if (s !== old) { p.state = s; p.st = 0; }
}

function onLand() {
  const p = P, v = p.preVy;
  if (p.state === 'airattack') return;
  if (v > 4 * U) {
    const hard = v > TUNE.hardLandV;
    p.hardLand = hard; p.landT = hard ? 0.36 : 0.21; p.landLock = hard ? 0.12 : 0;
    p.squash = hard ? 0.3 : 0.15;
    Snd.play('land', hard); FX.dust(p.x, p.y, hard ? 8 : 4, 0);
    if (hard) Cam.shake(5, 0.15);
  }
}

/* --- free movement (idle / walk / run / jump / fall) --- */
function updFree(dt, ax, ctl) {
  const p = P;
  if (Math.abs(ax) > 0.1) p.dir = ax > 0 ? 1 : -1;
  const mag = Math.min(1, Math.abs(ax));
  let target = 0;
  if (mag > 0.05) {
    target = mag < 0.6 ? TUNE.walk * (mag / 0.6) : TUNE.walk + (TUNE.run - TUNE.walk) * ((mag - 0.6) / 0.4);
    if (ctl && Input.held('walk')) target = Math.min(target, TUNE.walk);
    target *= sgn(ax);
  }
  const g = p.onGround;
  let acc = g ? TUNE.accG : TUNE.accA; const dec = g ? TUNE.decG : TUNE.decA;
  if (p.landLock > 0) acc *= 0.5;
  if (target === 0) p.vx = approach(p.vx, 0, dec * dt);
  else if (sgn(p.vx) === sgn(target) && Math.abs(p.vx) > Math.abs(target)) p.vx = approach(p.vx, target, dec * dt);
  else {
    const rev = sgn(p.vx) !== sgn(target) && Math.abs(p.vx) > 20;
    p.vx = approach(p.vx, target, acc * (rev ? TUNE.turn : 1) * dt);
  }
  if (!ctl) return;

  /* variable jump height */
  if (p.jumped && p.vy < 0 && !p.cutDone && !Input.held('jump')) {
    if (p.vy < -TUNE.cutV) p.vy = -TUNE.cutV;
    p.cutDone = true;
  }

  /* actions, in priority order */
  if (p.dodgeCd <= 0 && p.onGround && Input.peek('dodge', TUNE.dbuf)) { startDodge(); return; }
  if (p.onGround && Input.peek('special', 0.2)) {
    if (p.special >= 100) { startSpecial(); return; }
    Input.consume('special'); Snd.play('deny'); UI.denySpecial();
  }
  if (p.onGround && p.target && Input.peek('interact', 0.2)) { startInteract(p.target); return; }
  if (Input.peek('attack', TUNE.abuf)) {
    if (p.onGround) { startAttack(p.comboWin > 0 ? p.nextCombo : 0); return; }
    if (!p.airUsed) { startAirAttack(); return; }
  }
  if (Input.peek('jump', TUNE.jbuf)) {
    if (p.onGround && Input.down() && tileAt(Math.floor((p.x - 8) / U), Math.floor((p.y + 2) / U)) === 2 &&
        tileAt(Math.floor((p.x + 8) / U), Math.floor((p.y + 2) / U)) === 2) {
      p.drop = 0.22; p.onGround = false; p.y += 2; Input.consume('jump'); return;
    }
    if (p.onGround || p.coyote > 0) startJump();
  }
}

/* --- dodge --- */
function updDodge(dt) {
  const p = P, tn = Math.min(1, p.st / TUNE.dodgeT);
  const v0 = 1.5 * TUNE.dodgeDist / TUNE.dodgeT;
  p.vx = p.dodgeDir * v0 * (1 - tn * tn);
  p.trailT += dt;
  if (p.trailT > 0.03) {
    p.trailT = 0;
    for (let i = p.trail.length - 1; i > 0; i--) { const a = p.trail[i], b = p.trail[i - 1]; a.x = b.x; a.y = b.y; a.a = b.a; a.dir = b.dir; }
    const f = p.trail[0]; f.x = p.x; f.y = p.y; f.a = 0.55; f.dir = p.dir;
  }
  if (p.st >= TUNE.dodgeT) { p.vx = p.dodgeDir * TUNE.walk * 0.8; setState('idle'); pickLocomotionState(); }
}

/* --- attacks --- */
function updAttack(dt, ctl) {
  const p = P, a = ATK[p.combo], t = p.st;
  p.vx = approach(p.vx, 0, TUNE.decG * 0.7 * dt);
  const total = a.wind + a.act + a.rec;
  if (t < a.wind) p.phase = 'wind';
  else if (t < a.wind + a.act) {
    if (p.phase !== 'act') { p.phase = 'act'; p.vx = p.dir * a.lunge; if (a.heavy) Cam.shake(2, 0.1); }
    doHits(a.dmg, a.heavy, a.stop);
  } else p.phase = 'rec';
  if (p.phase === 'rec' && ctl) {
    if (p.dodgeCd <= 0 && Input.peek('dodge', TUNE.dbuf)) { startDodge(); return; }
    if (Input.peek('jump', TUNE.jbuf) && p.onGround) { startJump(); return; }
    if (Input.peek('attack', 0.25)) { startAttack((p.combo + 1) % 3); return; }
  }
  if (t >= total) {
    p.nextCombo = (p.combo + 1) % 3; p.comboWin = 0.3; p.phase = '';
    setState('idle'); pickLocomotionState();
  }
}
function updAirAttack(dt, ax) {
  const p = P, a = AIR_ATK, t = p.st;
  if (Math.abs(ax) > 0.1) p.dir = ax > 0 ? 1 : -1;
  p.vx = approach(p.vx, ax * TUNE.run * 0.6, TUNE.accA * 0.6 * dt);
  if (t < a.wind) { p.phase = 'wind'; p.vy = Math.min(p.vy, 2 * U) * 0.5; p.noGrav = true; }
  else if (t < a.wind + a.act) {
    if (p.phase !== 'act') { p.phase = 'act'; p.vy = 13 * U; }
    p.noGrav = true; doHits(a.dmg, false, a.stop);
  } else p.phase = 'rec';
  if (p.onGround && p.phase !== 'wind') {
    if (p.phase === 'act') { FX.dust(p.x, p.y, 7, 0); Cam.shake(3, 0.1); Snd.play('land', true); }
    p.phase = ''; setState('idle'); pickLocomotionState(); p.landT = 0.2; return;
  }
  if (t >= a.wind + a.act + a.rec) { p.phase = ''; setState('fall'); }
}

/* --- hurt / death / interact / special --- */
function updHurt(dt) {
  const p = P;
  p.vx = approach(p.vx, 0, TUNE.decA * 0.5 * dt);
  if (p.st >= p.stun) { setState('idle'); pickLocomotionState(); }
}
function updDeath(dt) {
  const p = P;
  p.vx = approach(p.vx, 0, TUNE.decG * dt);
  if (p.st >= TUNE.deathT && !p.respawning) {
    p.respawning = true; UI.toast(t('m_died'));
    Game.fadeTo(1, 0.45, function () { respawnAtCheckpoint(); Game.fadeTo(0, 0.5); });
  }
}
function updInteract(dt) {
  const p = P;
  p.vx = approach(p.vx, 0, TUNE.decG * dt);
  if (!p.didAct && p.st >= TUNE.interactAt) { p.didAct = true; if (p.target) activate(p.target); }
  if (p.st >= TUNE.interactT) { setState('idle'); pickLocomotionState(); }
}
function updSpecial(dt) {
  const p = P;
  p.vx = 0; p.vy = 0; p.noGrav = true;
  if (!p.didAct && p.st >= TUNE.specialAt) {
    p.didAct = true; p.special = 0; HUD.dirty = true;
    const id = ++Game.atkSeq, cx = p.x, cy = p.y - 36;
    Snd.play('special'); Cam.shake(8, 0.3);
    FX.ring(cx, cy, TUNE.specialR, 9, 0.45); FX.ring(cx, cy, TUNE.specialR * 0.65, 2, 0.35); FX.glow(cx, cy, 90, 1, 0.5);
    FX.sparks(cx, cy, 14, 9);
    let n = 0;
    Hit.box = null; Hit.cx = cx; Hit.cy = cy; Hit.r = TUNE.specialR; popBubbles(null, cx, cy, TUNE.specialR);
    for (let i = 0; i < Level.ents.length; i++) {
      const e = Level.ents[i], eb = entBox(e);
      if (!eb || e.dead) continue;
      const ex = clamp(cx, eb[0], eb[2]), ey = clamp(cy, eb[1], eb[3]);
      if (Math.hypot(ex - cx, ey - cy) <= TUNE.specialR && damageEnt(e, 3, e.x >= cx ? 1 : -1, true, id)) n++;
    }
    if (n > 0) { Snd.play('hit', true); Game.hitStop = Math.max(Game.hitStop, 0.09); }
  }
  if (p.st >= TUNE.specialT) { setState('idle'); pickLocomotionState(); }
}

/* --- pit fall + respawn --- */
function pitFall() {
  const p = P;
  if (p.respawning || p.dead) return;
  Snd.play('pit'); p.respawning = true; p.vx = 0; p.vy = 0; p.noGrav = true;
  p.hp = Math.max(0, p.hp - 1); HUD.dirty = true; HUD.popIdx = p.hp; UI.toast(t('m_pit'));
  Game.fadeTo(1, 0.3, function () {
    if (p.hp <= 0) { p.dead = true; respawnAtCheckpoint(); Game.fadeTo(0, 0.5); return; }
    const sx = p.safeX, sy = p.safeY;
    resetPlayer(sx, sy);
    p.inv = TUNE.hurtInv; p.blink = TUNE.hurtInv; p.respawning = false;
    Cam.update(0.016, true); Game.fadeTo(0, 0.35);
  });
}
function respawnAtCheckpoint() {
  P.hp = P.hpMax; P.special = 100; HUD.dirty = true; resetEncounters();
  resetPlayer(checkpoint.x, checkpoint.y);
  P.inv = TUNE.hurtInv; P.blink = TUNE.hurtInv;
  Cam.update(0.016, true);
}

/* ---------- 14. ambience director: the ticking world ----------
   Logic runs even while audio is still locked, so the gears on screen always step with the same beat as the sound.
   - world heartbeat: a faint tick about once a second; sometimes it misses a step (gears hesitate), sometimes it doubles
   - pendulum clocks: each save clock ticks at the exact extremes of its drawn pendulum, panned and attenuated by distance
   - random gear / chain / steam / creak events, density depends on the zone the player stands in
   - tension: the heartbeat quickens and grows when health is low */
const Amb = (function () {
  const RANGE = 17 * U;
  const clockN = [];

/* ---- arena furniture: table legs, shelf brackets, tool racks, the gate ---- */

  for (let i = 0; i < 4; i++) { const lx = (AR.tabL + 0.5 + i * ((AR.tabR - AR.tabL - 1) / 3)) * U; c.fillRect(lx - 9, ty + 12, 18, 2 * U - 12); }

/* ---- Cleaner-7 ---- */
function drawBoss(c, b) {

        c.strokeStyle = 'rgba(224,86,74,' + (0.3 + 0.5 * q) + ')'; c.lineWidth = 3; c.beginPath(); c.arc(nx, ny, BOSS.puffR * (0.7 + 0.3 * q), 0, 6.3); c.stroke();
      }
    }
  } else if (st === 'steamT' || st === 'steam') {
    for (let i = 0; i < b.vents.length; i++) {

        const k = Math.min(1, b.st / BOSS.steamWarn);
        c.fillStyle = 'rgba(255,179,71,' + (0.2 + 0.4 * k) + ')'; c.beginPath(); c.ellipse(vx, G * U - 3, BOSS.steamW * (0.8 + 0.5 * k), 6, 0, 0, 6.3); c.fill();
        c.fillStyle = 'rgba(224,86,74,' + (0.04 + 0.12 * k) + ')'; c.fillRect(vx - BOSS.steamW, G * U - BOSS.steamH, BOSS.steamW * 2, BOSS.steamH);
        c.fillStyle = '#2c3441'; c.fillRect(vx - 14, G * U - 5, 28, 5);
      } else if (b.st < BOSS.steamT) {

    c.strokeStyle = 'rgba(224,180,100,0.7)'; c.lineWidth = 3; c.lineCap = 'round';
    for (let i = 0; i < 4; i++) { const a = b.spin + i * 1.5708, px = b.x + Math.cos(a) * BOSS.spinR, py = G * U - BOSS.spinTop * 0.5 + Math.sin(a) * BOSS.spinTop * 0.4; c.beginPath(); c.moveTo(b.x, G * U - BOSS.spinTop * 0.5); c.lineTo(px, py); c.stroke(); }
  }

  const jx = b.shake > 0 ? Math.sin(b.shake * 100) * 3 : 0, wob = st === 'dizzy' ? Math.sin(b.st * 9) * 0.05 : st === 'break' ? Math.sin(b.st * 40) * 0.03 : st === 'dying' ? Math.sin(b.st * 30) * 0.04 : 0;
  c.save(); c.translate(b.x + jx, b.y - b.jy);
  c.fillStyle = 'rgba(0,0,0,' + (0.32 - Math.min(0.2, b.jy / (3 * U))) + ')'; c.beginPath(); c.ellipse(0, b.jy, 1.5 * U * (1 - b.jy / (6 * U)), 7, 0, 0, 6.3); c.fill();

  c.fillStyle = S2; rrect(c, -1.35 * U, -3.45 * U, 1.9 * U, 1.5 * U, 14); c.fill();

  /* main body */
  c.fillStyle = S1; rrect(c, -1.35 * U, -2.35 * U, 2.7 * U, 1.75 * U, 22); c.fill();
  c.fillStyle = S3; rrect(c, -1.2 * U, -2.3 * U, 2.4 * U, 0.35 * U, 10); c.fill();
  c.fillStyle = BR; c.fillRect(-1.35 * U, -1.35 * U, 2.7 * U, 7);
  c.fillStyle = 'rgba(0,0,0,0.25)'; for (let i = 0; i < 4; i++) c.fillRect(-1.0 * U + i * 0.38 * U, -1.2 * U, 6, 0.4 * U);                // vents
  if (ph2) { c.strokeStyle = '#10151c'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-0.2 * U, -2.3 * U); c.lineTo(0.05 * U, -1.9 * U); c.lineTo(-0.15 * U, -1.6 * U); c.lineTo(0.2 * U, -1.2 * U); c.stroke(); }
  /* head and lens */
  c.fillStyle = S1; rrect(c, 0.1 * U, -3.05 * U, 1.1 * U, 0.8 * U, 12); c.fill();
  const lens = sleeping ? '#2b2f38' : hot ? CBC.red : (st === 'stun' || st === 'dizzy') ? '#7aa0b8' : CBC.amber;
  c.fillStyle = '#10151c'; c.beginPath(); c.arc(0.78 * U, -2.65 * U, 0.27 * U, 0, 6.3); c.fill();
  c.fillStyle = white ? '#fff' : lens; c.beginPath(); c.arc(0.78 * U, -2.65 * U, 0.19 * U, 0, 6.3); c.fill();

  c.fillStyle = S2; c.beginPath(); c.moveTo(1.3 * U, -0.9 * U - 0.3 * U); c.lineTo(1.3 * U + (0.45 + 0.1 * open) * U, -0.9 * U - nh * U * 0.5 - 0.1 * U); c.lineTo(1.3 * U + (0.45 + 0.1 * open) * U, -0.9 * U + nh * U * 0.5 + 0.1 * U); c.lineTo(1.3 * U, -0.9 * U + 0.3 * U); c.closePath(); c.fill();
  c.fillStyle = '#0b0e14'; c.beginPath(); c.ellipse(1.75 * U + 0.1 * U * open, -0.9 * U, 0.1 * U, nh * U * 0.5, 0, 0, 6.3); c.fill();
  /* near arm (in front) */
  if (!b.armBroken) drawBossArm(c, b, S1, BR, false, st);
  else { c.fillStyle = S2; c.fillRect(0.7 * U, -1.9 * U, 0.35 * U, 0.3 * U); c.strokeStyle = '#ffb347'; c.lineWidth = 2; if (((Game.time * 6) | 0) % 3 === 0) { c.beginPath(); c.moveTo(1.05 * U, -1.75 * U); c.lineTo(1.2 * U + 6, -1.9 * U); c.moveTo(1.05 * U, -1.75 * U); c.lineTo(1.25 * U, -1.6 * U); c.stroke(); } }
  c.restore();
}
function drawBossArm(c, b, col, brass, far, st) {
  let ang = 0.55;                                                         // resting: hanging forward-down
  if (st === 'sweepT') ang = -1.9 + 0.2 * Math.sin(b.st * 30);                // raised behind the head
  else if (st === 'sweepJ') ang = -0.5 + 0.9 * Math.min(1, b.st / (BOSS.leapT / (b.phase === 2 ? BOSS.fast : 1)));
  else if (st === 'spinT') ang = -0.1;
  else if (st === 'spin') ang = 0;
  else if (st === 'sleep') ang = 1.2;
  else ang = 0.55 + Math.sin(b.wph * 3 + (far ? 1.5 : 0)) * 0.08;
  const len = 1.5 * U, sx = 0.75 * U, sy = -1.8 * U;
  const ex = sx + Math.cos(ang) * len, ey = sy + Math.sin(ang) * len;
  c.save();
  c.strokeStyle = col; c.lineWidth = 11; c.lineCap = 'round'; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
  c.strokeStyle = brass; c.lineWidth = 3; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
  c.translate(ex, ey); c.rotate(ang + (st === 'sweepJ' || st === 'spin' ? 1.57 : 0.3));
  c.fillStyle = '#6a5030'; c.fillRect(-4, -4, 8, 8);                                                       // broom head: handle block + bristles
  c.fillStyle = far ? '#7a6540' : '#a58250'; c.beginPath(); c.moveTo(-0.3 * U, 4); c.lineTo(0.3 * U, 4); c.lineTo(0.38 * U, 0.65 * U); c.lineTo(-0.38 * U, 0.65 * U); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 1.5; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 0.1 * U, 6); c.lineTo(i * 0.12 * U, 0.6 * U); c.stroke(); }
  c.restore();
}

/* ---------- 19. canvas sizing, quality, language ---------- */
const canvas = $('#game');
function applyQuality() {
  const q = S.quality;
  Game.lowFx = (q === 'low');
  Game.particleCap = q === 'low' ? 800 : (q === 'medium' ? 2000 : PMAX);
  Game.dprCap = q === 'low' ? 1 : (q === 'medium' ? 1.5 : 2);
  unshedLoad();
}
function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  Game.portrait = vh > vw * 1.02;

    else { if (st === 'grain') Game.fx.grain = 0; else if (st === 'vig') Game.fx.vig = 0; else if (st === 'near') Game.fx.near = 0; return true; }

  const f = Game.fade;
  if (f.a !== f.target) f.a = approach(f.a, f.target, f.speed * dt);
  if (f.a === f.target && f.cb) { const cb = f.cb; f.cb = null; cb(); }
}
function newWorld(fromSave) {
  buildLevel();
  const sv = fromSave ? S.progress : null;
  checkpoint = sv ? { x: sv.cp.x, y: sv.cp.y } : { x: Level.spawn.x, y: Level.spawn.y };
  resetPlayer(checkpoint.x, checkpoint.y);
  P.special = 100; P.gears = sv ? sv.gears : 0;
  if (sv) {
    for (let i = 0; i < Level.ents.length; i++) {
      const e = Level.ents[i];
      if (e.t === 'gear' && sv.got.indexOf(e.uid) >= 0) e.got = true;
      else if (e.t === 'barrel' && sv.brk.indexOf(e.uid) >= 0) e.dead = true;
      else if (e.t === 'lever' && sv.door) e.on = true;
      else if (e.t === 'lost' && sv.lost.indexOf(e.uid) >= 0) { e.got = true; Level.lostN++; }
      else if (e.t === 'fwall' && sv.fw.indexOf(e.uid) >= 0) { e.dead = true; for (let r = 0; r < e.rows; r++) Level.grid[(e.ty + r) * LW + e.tx] = 0; }
    }
    Level.doorOpen = sv.door; Level.doorAnim = sv.door ? 1 : 0;
    if (sv.boss && Level.boss) { Level.bossDown = true; Level.boss.dead = true; Level.boss.state = 'dead'; }
  }
  const want = pulsesFor(Level.lostN);
  if (P.hpMax !== want || HUD.built === false || $('#hp').children.length !== want) { P.hpMax = want; HUD.build(); }
  P.hp = P.hpMax; Cam.lock = null; HUD.bossDirty = true; HUD.lostSig = -1;
  Game.fade.a = 0; Game.fade.target = 0; Game.fade.cb = null; Game.hitStop = 0;
  pAliveN = 0; pFreeTop = PMAX; for (let i = 0; i < PMAX; i++) pFree[i] = PMAX - 1 - i;
  Cam.update(0.016, true); HUD.dirty = true;
}
function startGame(cont) {
  if (cont && !S.progress) { UI.toast(t('m_nosave')); return; }
  newWorld(cont); Game.state = 'play'; Game.pausedByRotate = false; UI.stack = []; UI.hideAll();
  Input.clearAll(); Snd.resume(); $('#hud').classList.add('on'); Touch.refresh(); applyPerfHud();
  Game.fade.a = 1; Game.fadeTo(0, 1.1);          // the world fades in out of black
}
function toMenu() {
  Game.state = 'menu'; Input.clearAll(); newWorld(false); UI.stack = []; UI.showRaw('scr-start'); $('#hud').classList.remove('on'); Touch.refresh();
}
function restartFromSave() { newWorld(!!S.progress); UI.resume(); }

/* ---------- 22b. diagnostics panel: shows with the performance HUD while playing; finds what costs frames on a given phone ---------- */
const DX = {
  on: { far: 1, mid: 1, near: 1, gears: 1, grain: 1, vig: 1, world: 1, hud: 1, touch: 1, css: 1, audio: 1, fps30: 0, walk: 0 },
  def: { far: 1, mid: 1, near: 1, gears: 1, grain: 1, vig: 1, world: 1, hud: 1, touch: 1, css: 1, audio: 1, fps30: 0, walk: 0 },
  keys: ['far', 'mid', 'near', 'gears', 'grain', 'vig', 'world', 'hud', 'touch', 'css', 'audio', 'fps30', 'walk'],
  btn: {}, walking: false, dir: 1, lastX: 0, stuck: 0,
  build() {
    const box = $('#dx'), self = this;
    this.keys.forEach(function (k) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = k; self.btn[k] = b;
      b.addEventListener('click', function (e) { e.stopPropagation(); self.on[k] = self.on[k] ? 0 : 1; self.apply(); });
      box.appendChild(b);
    });
    this.apply();
  },
  changed() { for (const k in this.def) if (this.on[k] !== this.def[k]) return true; return false; },
  apply() {
    const o = this.on;
    const vis = function (sel, v) { const e = $(sel); if (e) e.style.visibility = v ? '' : 'hidden'; };
    vis('#hud', o.hud); vis('#touch', o.touch);
    document.documentElement.classList.toggle('noanim', !o.css);
    if (!o.audio) Snd.suspend(); else if (Snd.state === 'suspended') Snd.resume();
    for (const k in this.btn) { const feat = (k === 'fps30' || k === 'walk'); this.btn[k].className = feat ? (o[k] ? 'a' : '') : (o[k] ? '' : 'x'); }
  },
  reset() { for (const k in this.def) this.on[k] = this.def[k]; this.apply(); },
  sync() {
    $('#dx').classList.toggle('on', !!S.perfHud && Game.state === 'play');
    if (!S.perfHud && this.changed()) this.reset();                           // never leave things switched off once the HUD is hidden
    if (!this.on.audio && Snd.state === 'running') Snd.suspend();
  },
  drive() {                                                                  // "walk": the hero paces the flat training yard by himself (no finger on the screen)
    const T = Input.touch, w = this.on.walk && Game.state === 'play';
    if (!w) { if (this.walking) { T.right = false; T.left = false; this.walking = false; } return; }
    if (!this.walking) {
      this.walking = true; this.dir = 1; this.stuck = 0;
      if (P.x / U < 96 || P.x / U > 118) { resetPlayer(100 * U, 18 * U); Cam.update(0.016, true); }
      this.lastX = P.x;
    }
    const tx = P.x / U;
    if (tx > 117.5) this.dir = -1; else if (tx < 98.5) this.dir = 1;
    if (Math.abs(P.x - this.lastX) < 0.5) { if (++this.stuck > 40) { this.dir = -this.dir; this.stuck = 0; } } else this.stuck = 0;
    this.lastX = P.x;
    T.right = this.dir > 0; T.left = this.dir < 0;
  }
};

/* ---------- 23. main loop ---------- */
function update(dt) {
  fadeStep(dt);
  Amb.setState(Game.state);
  if (Game.state === 'pause' || Game.testHold) return;
  DX.drive();
  Game.time += dt;
  if (Game.hitStop > 0) { Game.hitStop -= dt; Cam.update(dt, false); return; }
  Input.enabled = (Game.state === 'play');
  const n = Math.max(1, Math.ceil(dt / MAX_STEP)), h = dt / n;
  for (let i = 0; i < n; i++) { Input.tick(h); playerUpdate(h); worldUpdate(h); }
  updateParticles(dt); updatePopups(dt); updateBots(dt);
  Amb.update(dt);
  Cam.update(dt, false);
  HUD.update();
  spawnMotes(dt);
  Touch.setReady('interact', !!P.target && Game.state === 'play');
  Touch.setReady('special', P.special >= 100);
  Touch.setCharge('special', P.special / 100);
  Touch.setCooldown('dodge', P.dodgeCd / (TUNE.dodgeT + TUNE.dodgeCool));
  if (Game.state === 'menu' && Amb.steps !== embSteps) { embSteps = Amb.steps; $('#emb-sec').style.transform = 'rotate(' + (embSteps * 6 % 360) + 'deg)'; }   // the emblem's second hand ticks with the world beat
}
let embSteps = -1, moteT = 0;
function spawnMotes(dt) {                       // slow dust motes drifting through the light
  if (Game.lowFx || Game.state === 'stress') return;
  moteT -= dt; if (moteT > 0) return;
  moteT = 0.14;
  emit(PT.MOTE, Cam.x + rnd(0, Game.viewW), Cam.y + rnd(0, VIEW_H), rnd(-10, 10), rnd(-16, -4), rnd(4, 7), rnd(1.4, 3), Math.random() < 0.7 ? 1 : 5, 0);
}
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) { lastTs = ts; return; }
  const raw = ts - lastTs;
  if (raw <= 0) return;
  if (DX.on.fps30 && raw < 30) return;                                       // diagnostic: even 30 fps pacing (skips alternate vsyncs, time accumulates)
  lastTs = ts;
  const dt = Math.min(raw / 1000, MAX_FRAME);
  const t0 = performance.now();
  update(dt);
  const t1 = performance.now();
  render();
  const t2 = performance.now();
  if (raw < 400) { Perf.record(raw, t1 - t0, t2 - t1); }
  Stress.frame(raw, t1 - t0, t2 - t1);
}

/* ---------- 24. wiring ---------- */
$('#b-continue').addEventListener('click', function () { startGame(true); });
$('#b-new').addEventListener('click', function () { startGame(false); });
$('#b-controls').addEventListener('click', function () { UI.nav('scr-controls'); });
$('#b-settings').addEventListener('click', function () { UI.nav('scr-settings'); });
$('#b-perf').addEventListener('click', function () { UI.nav('scr-perf'); });
$('#p-resume').addEventListener('click', function () { UI.resume(); });
$('#p-restart').addEventListener('click', function () { restartFromSave(); });
$('#p-controls').addEventListener('click', function () { UI.nav('scr-controls'); });
$('#p-settings').addEventListener('click', function () { UI.nav('scr-settings'); });
$('#p-perf').addEventListener('click', function () { UI.nav('scr-perf'); });
$('#p-menu').addEventListener('click', function () { toMenu(); });
$('#s-back').addEventListener('click', function () { UI.back(); });
$('#c-back').addEventListener('click', function () { UI.back(); });
$('#c-reset').addEventListener('click', function () { S.keys = JSON.parse(JSON.stringify(DEFAULT_KEYS)); Input.rebuild(); persist(); UI.renderControls(); Snd.play('ui'); });
$('#perf-back').addEventListener('click', function () { UI.back(); });
$('#perf-run').addEventListener('click', function () { Stress.start(); });
document.addEventListener('keydown', function (e) {                    // arrow-key navigation between menu buttons
  if (!UI.anyOpen() || Remap.listening) return;
  if (e.code !== 'ArrowDown' && e.code !== 'ArrowUp') return;
  const el = document.querySelector('.screen.show'); if (!el) return;
  const btns = Array.prototype.slice.call(el.querySelectorAll('.mi, .lnk')).filter(function (b) { return b.offsetParent !== null; });
  if (!btns.length) return;
  const i = btns.indexOf(document.activeElement), nx = e.code === 'ArrowDown' ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
  btns[i < 0 ? 0 : nx].focus(); e.preventDefault();
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { Input.clearAll(); if (Game.state === 'play') UI.openPause(); Snd.suspend(); }
  else lastTs = 0;
});

/* ---------- 25. boot ---------- */
window.__KSM_errors = [];
window.addEventListener('error', function (e) { window.__KSM_errors.push(String(e.message) + ' @' + (e.lineno || '?')); });
window.addEventListener('unhandledrejection', function (e) { window.__KSM_errors.push('promise: ' + String(e.reason)); });

ctx = canvas.getContext('2d', { alpha: false });
buildAtlas(); buildBackgrounds(); buildBotSprite();
Art.load(ART_CONFIG);
Input.rebuild(); applyQuality(); HUD.build();
newWorld(false);
resize();
(function () {                                           // old WebViews (Chrome < 84) ignore flex "gap": mark the page so the CSS can use margins instead
  try {
    const d = document.createElement('div'); d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    d.innerHTML = '<i></i><i></i>'; d.firstChild.style.height = d.lastChild.style.height = '1px'; document.body.appendChild(d);
    const ok = d.scrollHeight === 3; document.body.removeChild(d); if (!ok) document.documentElement.classList.add('ngap');
  } catch (e) { /* assume it is supported */ }
})();
applyLangDOM(); applyPerfHud(); DX.build();
try { Game.reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { /* keep default */ }
(function () {                                  // start-screen emblem: 60 minute ticks with one stolen (the gap at 12), hands stopped at 11:59
  const g = $('#emb-ticks'); let h = '';
  for (let i = 1; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r0 = big ? 78 : 83, r1 = 88;
    h += '<line class="tk' + (big ? ' h' : '') + '" x1="' + (100 + Math.sin(a) * r0).toFixed(2) + '" y1="' + (100 - Math.cos(a) * r0).toFixed(2) + '" x2="' + (100 + Math.sin(a) * r1).toFixed(2) + '" y2="' + (100 - Math.cos(a) * r1).toFixed(2) + '"/>';
  }
  g.innerHTML = h;
})();
UI.showRaw('scr-start');
if (!Store.ok) setTimeout(function () { UI.toast(t('s_storage'), 7000); }, 600);
requestAnimationFrame(frame);

/* test hooks used by the automated checks (read-only helpers; they do not change gameplay rules) */
window.__KSM = {
  DX: DX, shed: shedLoad, unshed: unshedLoad, applyQuality: function () { applyQuality(); resize(); }, RES: RES,
  U: U, TUNE: TUNE, P: P, Game: Game, Level: Level, Input: Input, Art: Art, Snd: Snd, Amb: Amb, Cam: Cam, Perf: Perf, Stress: Stress, UI: UI, S: function () { return S; },
  start: startGame,
  W: { damageEnt: damageEnt, hurtPlayer: hurtPlayer, resetEncounters: resetEncounters, respawn: respawnAtCheckpoint, newWorld: newWorld, CB: CB, BOSS: BOSS, AR: AR, Hit: Hit, HUD: HUD, startBossFight: startBossFight, spawnTool: spawnTool, bossQuake: bossQuake, collectLost: collectLost, snapshot: snapshotProgress, persist: persist, pulsesFor: pulsesFor, nextAttack: nextAttack, bossStartAttack: bossStartAttack },
  dbg: function () { return { ctx: ctx, BG: BG, drawBackdrop: drawBackdrop, drawTiles: drawTiles, drawEntities: drawEntities, drawNader: drawNader, drawSigns: drawSigns, drawParticles: drawParticles, drawPrompt: drawPrompt, overlayFor: overlayFor, render: render, VIEW_H: VIEW_H }; },
  hold: function (v) { Game.testHold = !!v; },
  sim: function (sec, step) {
    const h = step || (1 / 120), n = Math.round(sec / h);
    Input.enabled = true;
    for (let i = 0; i < n; i++) {
      if (Game.hitStop > 0) { Game.hitStop -= h; continue; }
      Input.tick(h); playerUpdate(h); worldUpdate(h); updateParticles(h); updatePopups(h); Game.time += h; fadeStep(h);
    }
    Cam.update(sec, false);
  },
  tp: function (tx, ty) { resetPlayer(tx * U, ty * U); Cam.update(0.016, true); },
  sheet: function (name, cols, rows) {                      // debug: register a labelled test sheet to exercise the sprite path
    const cell = 128, cv = mk(cols * cell, rows * cell), c = cv.getContext('2d');
    c.font = '700 40px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = 0; i < cols * rows; i++) {
      const x = (i % cols) * cell, y = ((i / cols) | 0) * cell;
      c.fillStyle = 'hsl(' + (i * 30) + ',60%,45%)'; c.fillRect(x + 4, y + 4, cell - 8, cell - 8);
      c.fillStyle = '#fff'; c.fillText(String(i), x + cell / 2, y + cell / 2);
    }
    Art.add(name, cv, cols, rows);
  },
  clearSheets: function () { Art.sheets = {}; }
};
})();
