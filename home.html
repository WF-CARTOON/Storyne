<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تحميل اللعبة</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; background:#0b0f1a; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  }
  .game-btn{
    all:unset; box-sizing:border-box; cursor:pointer; width:100%; max-width:340px; text-align:center;
    padding:16px 20px; border-radius:16px; font-size:17px; font-weight:700; color:#fff;
    /* --rt-progress يضبطها القالب أثناء التحميل (مثل 37%) فيمتلئ الزر */
    background:linear-gradient(90deg,#2dd4bf var(--rt-progress,0%),#0d9488 0);
    box-shadow:0 10px 26px rgba(13,148,136,.32);
    transition:transform .15s, opacity .15s;
  }
  .game-btn:active{transform:scale(.97);}
  .game-btn[rostrick-state="downloading"]{opacity:.9; pointer-events:none;}
  .game-btn[rostrick-state="ready"]{background:linear-gradient(135deg,#16a34a,#4ade80); color:#04210f;}
  .game-btn[rostrick-state="error"]{background:linear-gradient(135deg,#b91c1c,#f87171);}
</style>
</head>
<body>
  <button class="game-btn" onCreate="rostrickpages" rostrick="h2.html" rtnd="تحميل اللعبة" rtid="تشغيل اللعبة" progress="true"></button>
<button class="game-btn" onCreate="rostrickpages" rostrick="test-push.html" rtnd="تحميل اللعبة" rtid="تشغيل اللعبة" progress="true"></button>
</body>
</html>
