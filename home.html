<style>
#app{--b:#10131a;--f:#e8eaf0;--c:#1c2230;--a:#e0a43a;background:var(--b);color:var(--f);min-height:100vh;font-family:Tahoma,system-ui,sans-serif;direction:rtl;padding:12px}
#app[data-t=light]{--b:#f4f1ea;--f:#222;--c:#fff;--a:#b5651d}
#app *{box-sizing:border-box}#app [hidden]{display:none!important}
#app input,#app textarea,#app select,#app button{font:inherit;background:var(--c);color:var(--f);border:1px solid #8886;border-radius:8px;padding:8px;margin:3px 0}
#app input,#app textarea{width:100%}#app button{cursor:pointer;background:var(--a);color:#111;border:0;width:auto;font-weight:700}
#app .card{background:var(--c);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 6px #0004}
#app .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#app .m{opacity:.7;font-size:.85em}
#ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}#ls .card{cursor:pointer;text-align:center}
#st{min-height:65vh;padding:20px;border-radius:12px;background-size:cover;background-position:center;position:relative}
#tx p{margin:.6em 0;line-height:1.9;font-size:1.2em}.ch{text-align:center;font-size:2em}
.fade{animation:fd 1.5s}.zoom{animation:zm .8s}.shake{animation:sk .5s}.slide{animation:sl .8s}
@keyframes fd{from{opacity:0}}@keyframes zm{from{transform:scale(2.2);opacity:0}}@keyframes sl{from{transform:translateX(60px);opacity:0}}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#cb button{display:block;width:100%;margin:6px 0;padding:12px;background:#000a;color:#fff;border:1px solid #fff6}
#tm{height:5px;background:var(--a);width:100%}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
#app{--b:#0c0f17;--c:#171c2a;--c2:#212839;--a:#f0b54a;--f:#eef0f6;--l:#ffffff18;background:radial-gradient(1100px 560px at 85% -10%,#2b2257 0,transparent 60%),var(--b);font-family:Tajawal,'Segoe UI',Tahoma,system-ui,sans-serif;padding:0 0 48px;line-height:1.7}
#app[data-t=light]{--b:#f6f2ea;--c:#fff;--c2:#f2ece1;--a:#c0701a;--f:#2a2420;--l:#0000001a;background:radial-gradient(1000px 500px at 85% -10%,#ffe3b0 0,transparent 60%),var(--b)}
#app>*{max-width:960px;width:calc(100% - 24px);margin-left:auto;margin-right:auto}
#app>.row:first-child{position:sticky;top:0;z-index:5;max-width:none;width:100%;padding:12px 18px;margin:0 0 14px;background:color-mix(in srgb,var(--b) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}
#app>.row:first-child>b{flex:1;font-size:1.25em;font-weight:800}
#app .card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;box-shadow:0 8px 24px #0003}
#app summary{cursor:pointer;font-weight:700}
#app input,#app textarea,#app select{background:var(--c2);border:1px solid var(--l);border-radius:10px;padding:10px 12px;transition:.2s}
#app input:focus,#app textarea:focus,#app select:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px #f0b54a33}
#app button{background:linear-gradient(135deg,var(--a),#ff8f5a);color:#1a1205;border-radius:10px;padding:9px 16px;box-shadow:0 2px 8px #0003;transition:.15s}
#app button:hover{transform:translateY(-1px);filter:brightness(1.1)}#app button.d{background:#e5484d;color:#fff}
#app a{color:var(--a)}
#ls{gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
#ls .card{padding:0;overflow:hidden;transition:.2s}#ls .card:hover{transform:translateY(-4px) scale(1.02)}
#ls img{aspect-ratio:3/4;object-fit:cover;display:block;border-radius:0!important}
#ls h3{margin:0;min-height:230px;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#4a3490,#12182b);color:#fff;font-size:1.5em}
#ls .m{padding:10px 12px}
#st{border:1px solid var(--l);box-shadow:0 20px 60px #0006;padding:28px}
#tx p{text-shadow:0 2px 10px #0009}
#cb button{border-radius:12px;backdrop-filter:blur(6px);transition:.2s}#cb button:hover{border-color:var(--a);background:#000d;transform:none}
#tm{border-radius:4px}
#sc .card{border-right:4px solid var(--a)}
</style>
<div id="app">
<div class="row"><b>🎮 الألعاب القصصية</b><button onclick="tg()">🌓</button><button onclick="$('#nl').hidden=!$('#nl').hidden">🔔 <span id="nc">0</span></button><span id="ou" hidden><span id="un"></span> <button onclick="delete L.ssp_user;location.reload()">خروج</button></span></div>
<div id="nl" class="card" hidden></div>
<div id="lg" class="card"><b>تسجيل الدخول (اختياري، مطلوب للإعجاب والتعليق)</b><input id="lu" placeholder="اسم المستخدم"><input id="la" placeholder="اسم الحساب"><input id="lp" type="password" placeholder="كلمة المرور"><button onclick="dl()">دخول / إنشاء حساب</button></div>
<div id="ls"></div>
<div id="pl" hidden>
<div class="row"><button onclick="cl()">✖ إغلاق</button><button onclick="lk()">❤ <span id="lc">0</span></button></div>
<div id="st"><div id="tx"></div><div id="tm" hidden></div><div id="cb"></div></div>
<div class="card"><b>التعليقات</b><div id="cm"></div><input id="ci" placeholder="اكتب تعليقًا"><button onclick="sc()">إرسال</button></div>
</div></div>
<script>
const $=s=>document.querySelector(s),L=localStorage,app=$('#app');
// ===== إعدادات Firebase: ضعها هنا =====
const FB={url:'https://clean-sequencer-422716-g8-default-rtdb.firebaseio.com/',secret:''}; // url مثال: 'https://xxxx-default-rtdb.firebaseio.com' — secret اختياري
const cfg=()=>window.SSP_FB||FB;
async function db(p,m='GET',b){const c=cfg();if(!c.url)throw'ضع رابط RTDB في الإعدادات';const[a,q]=p.split('?');const r=await fetch(c.url.replace(/\/$/,'')+'/'+a+'.json?'+(q||'')+(c.secret?'&auth='+c.secret:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw'خطأ '+r.status;return r.json()}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const me=()=>JSON.parse(L.ssp_user||'null'),E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function dl(){try{const u=$('#lu').value.trim().toLowerCase(),a=$('#la').value.trim(),p=$('#lp').value;if(!u||!p)return;const id=(await H(u)).slice(0,16),h=await H(u+':'+p+':ssp'),r=await db('users/'+id);if(!r)await db('users/'+id,'PUT',{u,a,h});else if(r.h!==h)return alert('كلمة المرور خاطئة');L.ssp_user=JSON.stringify({id,u,a:r?r.a:a});location.reload()}catch(e){alert(e)}}
function tg(){L.ssp_t=app.dataset.t=app.dataset.t=='dark'?'light':'dark'}
app.dataset.t=L.ssp_t||'dark';
let G,S,V,lastCh,tk=0,au=new Audio;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function init(){const u=me();$('#lg').hidden=!!u;$('#ou').hidden=!u;if(u)$('#un').textContent=u.a;
try{const g=await db('games?orderBy="status"&equalTo="approved"')||{};for(const[id,x]of Object.entries(g)){const d=document.createElement('div');d.className='card';d.innerHTML=(x.cover?`<img src="${E(x.cover)}" style="width:100%;border-radius:8px">`:`<h3>${E(x.title)}</h3>`)+`<div class=m>${E(x.title)} · ${E(x.au)} · ❤ ${Object.keys(x.likes||{}).length}</div>`;d.onclick=()=>play(id);$('#ls').append(d)}
if(u){const n=[...Object.values(await db('notifs/all')||{}),...Object.values(await db('notifs/'+u.id)||{})].sort((a,b)=>b.ts-a.ts);$('#nc').textContent=n.length;$('#nl').innerHTML=n.map(x=>`<div>• ${E(x.t)}</div>`).join('')||'لا إشعارات'}}catch(e){$('#ls').textContent=e}}
async function play(id){const m=await db('games/'+id),d=await db('gdata/'+id);if(!d)return;G={id,...m};S=d.scenes||[];V={};
if(m.prev){const u=me();let s=u&&await db('saves/'+u.id+'/'+m.prev);s=s||JSON.parse(L['ssp_s_'+m.prev]||'null');if(s)V=s.v||{}}
const t=m.th||{},st=$('#st');st.style.background=t.m=='light'?'#f4f1ea':t.m=='custom'?t.bg||'#000':'#0b0d12';st.style.color=t.m=='light'?'#222':t.m=='custom'?t.fg||'#fff':'#eee';if(t.img)st.style.backgroundImage=`url(${t.img})`;
$('#ls').hidden=true;$('#pl').hidden=false;lastCh='';cm();$('#lc').textContent=Object.keys(m.likes||{}).length;go(S[0]&&S[0].id)}
function cl(){tk++;au.pause();$('#pl').hidden=true;$('#ls').hidden=false}
function sv(){const o={v:V},u=me();if(u)db('saves/'+u.id+'/'+G.id,'PUT',o).catch(()=>0);else L['ssp_s_'+G.id]=JSON.stringify(o)}
const pr=(r,n)=>(r||'').split('\n').filter(x=>x.trim()).map(x=>x.split('|').map(y=>y.trim()));
const sub=t=>(t||'').replace(/\{(\w+)\}/g,(m,k)=>V[k]??'');
async function go(id){const t=++tk,s=S.find(x=>x.id==id),tx=$('#tx'),cb=$('#cb'),tm=$('#tm');tx.innerHTML='';cb.innerHTML='';tm.hidden=true;
if(!s){tx.innerHTML='<h2 class=ch>— النهاية —</h2>';sv();return}
sv();if(s.bg)$('#st').style.backgroundImage=`url(${s.bg})`;
if(s.music&&au.getAttribute('src')!=s.music){au.src=s.music;au.loop=true;au.play().catch(()=>0)}
if(s.ch&&s.ch!=lastCh){lastCh=s.ch;tx.innerHTML=`<h2 class=ch>${E(s.ch)}</h2>`;await wait(2200);if(t!=tk)return;tx.innerHTML=''}
for(const[a,d,c,f,z,n,sf]of pr(s.lines)){await wait((+d||0)*1000);if(t!=tk)return;const p=document.createElement('p');if(c)p.style.color=c;if(z)p.style.fontSize=z+'px';if(n)p.style.fontFamily=n;if(f&&f!='type')p.className=f;if(sf)new Audio(sf).play().catch(()=>0);tx.append(p);const x=sub(a);
if(f=='type'){for(const ch of x){p.textContent+=ch;await wait(40);if(t!=tk)return}}else p.textContent=x}
const cs=pr(s.choices);if(!cs.length){await wait(1500);if(t==tk)go(null);return}
const pick=c=>{if(t!=tk)return;tk++;(c[2]||'').split(',').forEach(kv=>{const[k,v]=kv.split('=').map(x=>x.trim());if(k)V[k]=isNaN(v)?v:+v});go(c[1])};
cs.forEach(c=>{const b=document.createElement('button');b.textContent=sub(c[0]);b.onclick=()=>pick(c);cb.append(b)});
const T=+s.timer;if(T>0){tm.hidden=false;tm.style.transition='none';tm.style.width='100%';tm.offsetWidth;tm.style.transition=`width ${T}s linear`;tm.style.width='0';await wait(T*1000);if(t!=tk)return;pick(cs.find(c=>c[1]==s.to)||[...cs[0].slice(0,1),s.to||'',''])}}
async function lk(){const u=me();if(!u)return alert('سجّل الدخول أولًا');const p=`games/${G.id}/likes/${u.id}`;if(await db(p))await db(p,'DELETE');else await db(p,'PUT',true);$('#lc').textContent=Object.keys(await db(`games/${G.id}/likes`)||{}).length}
async function cm(){const c=await db(`games/${G.id}/comments`)||{};$('#cm').innerHTML=Object.values(c).map(x=>`<div><b>${E(x.u)}:</b> ${E(x.t)}</div>`).join('')}
async function sc(){const u=me();if(!u)return alert('سجّل الدخول أولًا');const t=$('#ci').value.trim();if(!t)return;await db(`games/${G.id}/comments`,'POST',{u:u.a,t,ts:Date.now()});$('#ci').value='';cm()}
init();
</script>
