<!DOCTYPE html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة الروايات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Reem+Kufi&family=Aref+Ruqaa&family=Lalezar&display=swap');
*{box-sizing:border-box; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0) !important;}[hidden]{display:none!important}
html{--bg:#0e1118;--pn:#161a24;--p2:#1e2331;--tx:#ece7db;--mu:#9aa1b4;--ac:#e0b862;--on:#1a1408;--ln:#272d3d;--rd:#e5675d;--gn:#3fb27f;--sh:0 10px 30px #0006;color-scheme:dark;scroll-behavior:smooth}
html[data-t=day]{--bg:#f4f1e9;--pn:#fffdf8;--p2:#efeadf;--tx:#25221b;--mu:#6c675b;--ac:#9a6410;--on:#fff;--ln:#ddd6c5;--rd:#c4493f;--gn:#238a5c;--sh:0 10px 28px #3a2f1a1c;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.75 Tajawal,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:960px;margin:auto;padding:20px 18px 70px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
textarea{min-height:84px;resize:vertical}
button{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:8px 18px;min-height:40px;cursor:pointer;font-weight:700;transition:.15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.g:hover{background:var(--p2)}
button.r{background:var(--rd);color:#fff}button.k{background:var(--gn);color:#fff}button.s{min-height:32px;padding:3px 12px;font-size:.88em}
button.on{outline:2px solid var(--ac);outline-offset:1px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.sub{background:var(--p2)}
.mu{color:var(--mu)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
h1,h2,h3{font-family:Amiri,serif;margin:.5em 0;line-height:1.3}h1{font-size:2.4em}h2{font-size:1.7em}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:20px;width:min(94vw,480px);max-height:88vh;padding:20px;box-shadow:var(--sh)}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}dialog>*{margin:10px 0}
#tt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:99px;z-index:99;display:none;box-shadow:var(--sh);font-weight:700}
.st,.chip{display:inline-block;font-size:.8em;border-radius:99px;padding:1px 12px;border:1px solid var(--ln);background:var(--p2);color:var(--mu)}
.st.approved{color:var(--gn);border-color:var(--gn)}.st.pending{color:var(--ac);border-color:var(--ac)}.st.rejected,.st.suspended{color:var(--rd);border-color:var(--rd)}
.nv{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--ln);background:color-mix(in srgb,var(--pn) 88%,transparent);backdrop-filter:blur(10px)}
.nv a{color:var(--mu);text-decoration:none;padding:6px 16px;border-radius:10px;font-weight:700}.nv a:hover{background:var(--p2);color:var(--tx)}.nv a.on{background:var(--ac);color:var(--on)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.w{max-width:1040px}
input[type=search]{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;margin-top:20px}
.it .row{margin-top:10px}.it .row button:first-child{flex:1}
.tl,.cv{aspect-ratio:3/4;border-radius:20px;background-size:cover;background-position:center;box-shadow:var(--sh)}
.tl{display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#f4efe2;position:relative;overflow:hidden;cursor:pointer;transition:.25s}
.tl:hover{transform:translateY(-4px)}.tl:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}
.tl>*{position:relative;z-index:1;margin:2px 0}.tl h3{font-size:1.6em;margin:.2em 0}.tl p{font-size:.85em;opacity:.85;margin:0}
.pt{font-size:.78em;background:#0009;border-radius:99px;padding:0 10px;align-self:flex-start}
.hero{display:grid;grid-template-columns:230px 1fr;gap:30px;margin-top:20px;align-items:start}
@media(max-width:700px){.hero{grid-template-columns:1fr}.cv{max-width:220px;margin:auto;width:100%}}
.hero h1{margin:.1em 0}.ds{font-size:1.12em;line-height:2;white-space:pre-line}.hero .row{margin:12px 0}
.ct{margin:6px 0;white-space:pre-wrap}
#st{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--sb) center/cover;color:var(--st);padding:15vh 22px 45vh;cursor:pointer;scroll-behavior:smooth}
#gm{position:fixed;inset:0;height:100dvh;z-index:50;background:var(--sb);color:var(--st)}
#gm:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px #0007}
#hb{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(#000b,transparent);transition:.35s}
#hb.hide{opacity:0;transform:translateY(-100%);pointer-events:none}
#hb button{background:#0008;color:#f4efe2;border:1px solid #fff2;backdrop-filter:blur(6px);min-width:42px;padding:6px 12px}
#hc{color:#f4efe2;opacity:.85;text-align:center;font-weight:500}
#hm{position:fixed;top:10px;left:10px;z-index:2;opacity:.3;background:transparent;color:var(--st);border:0;min-width:44px;font-size:1.5em;padding:0}#hm:hover{opacity:.9}
.w{position:relative}body.rd .nv{display:none}#hm{display:none!important}.hl{background:linear-gradient(90deg,var(--ac),var(--tx));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2.8em}
#ov{position:relative;isolation:isolate}#ov:before{content:"";position:absolute;inset:-30px -18px auto;height:440px;background:var(--cv) center/cover;filter:blur(46px) saturate(1.2);opacity:.38;z-index:-1;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.br{font:700 1.35em Amiri,serif;color:var(--ac);padding:2px 10px;margin-inline-end:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.stat{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:10px 16px}.stat b{display:block;font:700 1.9em Amiri,serif;color:var(--ac);line-height:1.2}

.bx,.cb{max-width:40em;margin:0 auto}
.b{margin:1em 0;font-size:1.25em;line-height:2.05;opacity:0;animation-fill-mode:forwards;animation-duration:1.2s}
img.b{max-width:100%;border-radius:14px}
.fx-none,.fx-type{opacity:1;animation:none}
.fx-fade{animation-name:fd}.fx-zoom{animation-name:zm}.fx-slide{animation-name:sl}.fx-glow{animation-name:gl}.fx-shake{animation-name:sk;animation-duration:.6s}
@keyframes fd{to{opacity:1}}
@keyframes zm{from{transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes sl{from{transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes gl{to{opacity:1;text-shadow:0 0 14px currentColor}}
@keyframes sk{0%{opacity:1}20%{opacity:1;transform:translateX(-8px)}40%{opacity:1;transform:translateX(8px)}60%{opacity:1;transform:translateX(-5px)}100%{opacity:1;transform:none}}
.tb{height:5px;border-radius:9px;background:color-mix(in srgb,var(--st) 16%,transparent);overflow:hidden;margin:22px 0 10px}
.tb i{display:block;height:100%;width:100%;background:var(--ac);border-radius:9px}
.ch{display:flex;gap:12px;align-items:center;width:100%;margin:10px 0;text-align:right;font-size:1.08em;font-weight:500;min-height:54px;background:color-mix(in srgb,var(--st) 7%,transparent);color:var(--st);border:1px solid color-mix(in srgb,var(--st) 22%,transparent);padding:12px 16px;border-radius:14px;transition:.18s}
.ch:hover{background:color-mix(in srgb,var(--st) 15%,transparent);transform:translateX(-3px);filter:none}
.ch .nm{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.82em;background:color-mix(in srgb,var(--st) 15%,transparent)}
.ch.bad{background:#e5484d33;border-color:#e5484d}.ch.good{background:#30a46c44;border-color:#30a46c}
.ch.pick{transform:scale(.97);background:var(--ac);color:var(--on);border-color:var(--ac)}
.end{text-align:center;margin-top:3em;opacity:0;animation:fd 1.4s forwards}.end h2{font-size:2.6em;margin:.1em 0}.end .orn{font-size:1.6em;color:var(--ac)}.end .sm{opacity:.75;margin-bottom:1.4em}
</style>
<header class="nv"><span class="br">✦ روايات</span><a class="on" href="home.html">الرئيسية</a><a href="create.html">إنشاء</a><a href="admin.html">الإدارة</a></header>
<div class="w">
 <div class="row"><span id="who" class="mu"></span><span class="sp"></span><button class="g" id="bl" onclick="bell()">🔔</button><button class="g" onclick="tth()">☾ / ☀</button><button class="g" id="lg"></button></div>
 <section id="ls"><h1 class="hl">مكتبة الروايات</h1><p class="mu">اختر روايتك، وقرارك هو من يكتب النهاية.</p><input id="q" type="search" placeholder="ابحث باسم الرواية أو الكاتب…" oninput="draw()"><div class="row" id="so" style="margin-top:12px"></div><div class="grid" id="gr"></div></section>
 <section id="ov" hidden></section>
 <section id="gm" hidden>
  <div id="hb" class="hide"><button onclick="toOv()" title="خروج">✕</button><span class="sp" id="hc"></span><button id="glk" onclick="lk(GM,this)">♡</button><button id="gcm" onclick="cmts(GM)">💬</button><button onclick="fsz()" title="ملء الشاشة">⛶</button><button onclick="menu()" title="القائمة">⚙</button></div>
  <button id="hm" onclick="wake(1)" aria-label="إظهار القائمة">⋯</button>
  <div id="st"></div></section>
</div><div id="tt"></div>
<script>
const DB='https://clean-sequencer-422716-g8-default-rtdb.firebaseio.com',KEY='';
const $=s=>document.querySelector(s),h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;k.startsWith('on')?e[k]=v:k=='class'?e.className=v:e.setAttribute(k,v===true?'':v)}c.flat().forEach(x=>e.append(x?.nodeType?x:(x??'')));return e};
const api=async(m,p,b)=>{const r=await fetch(DB+'/'+p+'.json'+(KEY?'?auth='+KEY:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
const get=p=>api('GET',p),put=(p,b)=>api('PUT',p,b),del=p=>api('DELETE',p),patch=(p,b)=>api('PATCH',p,b);
let _tt;const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',2800)};
const dlg=(...c)=>{const d=h('dialog',{},...c);d.onclose=()=>d.remove();document.body.append(d);d.showModal();return d};
const closeBtn=()=>h('button',{class:'g',onclick:e=>e.target.closest('dialog').close()},'إغلاق');
document.documentElement.dataset.t=localStorage.sg_theme||'night';
const tth=()=>{const d=document.documentElement;d.dataset.t=localStorage.sg_theme=d.dataset.t=='day'?'night':'day'};

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const me=()=>JSON.parse(localStorage.sg_user||'null');
const dl=(n,t)=>{const a=h('a',{href:URL.createObjectURL(new Blob([t],{type:'application/json'})),download:n});document.body.append(a);a.click();a.remove()};
async function login(name,acc,pw){const id=acc.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g,'_');if(!id||!pw||!name)throw'أكمل جميع الحقول';const u=await get('users/'+id);let nm=name;if(!u){const salt=crypto.randomUUID();await put('users/'+id,{name,acc,salt,hash:await sha(salt+pw),created:Date.now()})}else{if(u.hash!==await sha(u.salt+pw))throw'كلمة المرور غير صحيحة';nm=u.name}localStorage.sg_user=JSON.stringify({id,name:nm})}
function authDlg(cb){const n=h('input',{placeholder:'إسم المستخدم'}),a=h('input',{placeholder:'إسم الحساب'}),p=h('input',{type:'password',placeholder:'كلمة المرور'}),er=h('small',{class:'mu'});const d=dlg(h('h3',{},'تسجيل الدخول'),h('p',{class:'mu'},'إن لم يكن الحساب موجودًا فسيُنشأ تلقائيًا.'),n,a,p,er,h('div',{class:'row'},h('button',{onclick:async()=>{try{await login(n.value.trim(),a.value,p.value);d.close();cb()}catch(e){er.textContent=typeof e=='string'?e:'تعذّر الاتصال'}}},'دخول'),closeBtn()))}
async function nots(){const u=me();let a={},b={};try{a=await get('notifs/'+u.id)||{};b=await get('notifs/_all')||{}}catch(e){}return[...Object.values(a),...Object.values(b)].sort((x,y)=>y.d-x.d)}
async function bell(){if(!me())return authDlg(()=>location.reload());const l=await nots();localStorage['sg_seen_'+me().id]=Date.now();$('#bl').textContent='🔔';dlg(h('h3',{},'الإشعارات'),...(l.length?l.map(n=>h('div',{class:'card'},n.m,h('div',{},h('small',{class:'mu'},new Date(n.d).toLocaleDateString('ar'))))):[h('p',{class:'mu'},'لا توجد إشعارات')]),closeBtn())}
function bar(){const u=me();$('#who').textContent=u?'أهلًا '+u.name:'تتصفح كزائر';const b=$('#lg');b.textContent=u?'خروج':'دخول';b.onclick=()=>u?(localStorage.removeItem('sg_user'),location.reload()):authDlg(()=>location.reload());$('#bl').style.display=u?'':'none';if(u)nots().then(l=>{const n=l.filter(x=>x.d>(+localStorage['sg_seen_'+u.id]||0)).length;if(n)$('#bl').textContent='🔔 '+n})}

let SORT='new',LIST={},U,S,P,GM,V0={},pre=0,T=[],cm='',au=new Audio(),sx=new Audio(),fs=+localStorage.sg_fs||1,vol=localStorage.sg_vol==null?.5:+localStorage.sg_vol,mute=localStorage.sg_mute=='1';
const hue=t=>[...t].reduce((s,c)=>s+c.charCodeAt(0),0)%360;
const cover=x=>x.cover?`url("${x.cover.replace(/["\\]/g,'')}")`:`linear-gradient(160deg,hsl(${hue(x.title)} 38% 26%),hsl(${(hue(x.title)+50)%360} 45% 12%))`;
const heart=g=>(g.liked?'♥ ':'♡ ')+(g.likes||0);
async function load(){try{const a=await get('games')||{},l=await get('likes')||{},u=me();LIST={};for(const k in a)if(a[k].status=='approved')LIST[k]={...a[k],id:k,likes:Object.keys(l[k]||{}).length,liked:!!(u&&l[k]&&l[k][u.id])};localStorage.sg_list=JSON.stringify(LIST)}catch(e){LIST=JSON.parse(localStorage.sg_list||'{}');toast('وضع بدون اتصال')}draw()}
function draw(){const so=$('#so');so.innerHTML='';[['new','الأحدث'],['likes','الأكثر إعجابًا']].forEach(([k,l])=>so.append(h('button',{class:'g s'+(SORT==k?' on':''),onclick:()=>{SORT=k;draw()}},l)));const g=$('#gr'),q=($('#q').value||'').trim();g.innerHTML='';const a=Object.values(LIST).filter(x=>!q||((x.title||'')+(x.desc||'')+(x.ownerName||'')).includes(q)).sort((x,y)=>SORT=='likes'?y.likes-x.likes:y.updated-x.updated);if(!a.length)g.append(h('p',{class:'mu'},q?'لا نتائج مطابقة.':'لا توجد روايات منشورة بعد.'));
a.forEach(x=>{const lb=h('button',{class:'g'},heart(x));lb.onclick=()=>lk(x,lb);g.append(h('article',{class:'it'},h('div',{class:'tl',tabindex:0,role:'button',onclick:()=>openOv(x.id),onkeydown:e=>e.key=='Enter'&&openOv(x.id),style:'background-image:'+cover(x)},x.part>1?h('span',{class:'pt'},'الجزء '+x.part+(LIST[x.prev]?' من '+LIST[x.prev].title:'')):'',h('h3',{},x.title),h('p',{},(x.desc||'').slice(0,90))),h('div',{class:'row'},h('button',{onclick:()=>openOv(x.id)},'اقرأ'),lb,h('button',{class:'g',onclick:()=>cmts(x)},'💬'))))})}
async function lk(g,b){const u=me();if(!u)return authDlg(()=>{bar();lk(g,b)});if(g.id=='preview')return;try{const l=await get('likes/'+g.id+'/'+u.id);l?await del('likes/'+g.id+'/'+u.id):await put('likes/'+g.id+'/'+u.id,true);g.liked=!l;g.likes=Math.max(0,(g.likes||0)+(l?-1:1));if(LIST[g.id]&&LIST[g.id]!==g){LIST[g.id].likes=g.likes;LIST[g.id].liked=g.liked}document.querySelectorAll('[data-lk="'+g.id+'"]').forEach(x=>x.textContent=heart(g));if(b)b.textContent=heart(g);toast(l?'أُزيل الإعجاب':'أعجبتك الرواية ♥')}catch(e){toast('لا اتصال')}}
async function cmts(g){if(g.id=='preview')return toast('التعليقات غير متاحة في المعاينة');const box=h('div'),ta=h('textarea',{placeholder:'اكتب تعليقك…',maxlength:500});
const dr=async()=>{box.innerHTML='';let c={};try{c=await get('comments/'+g.id)||{}}catch(e){box.append(h('p',{class:'mu'},'لا اتصال'));return}
const ks=Object.keys(c).sort((a,b)=>c[b].d-c[a].d);if(!ks.length)box.append(h('p',{class:'mu'},'كن أول من يعلّق'));
ks.forEach(i=>{const x=c[i],u=me(),mine=u&&x.u==u.id,cd=h('div',{class:'card sub'});
const view=()=>{cd.innerHTML='';cd.append(h('div',{class:'row'},h('b',{},x.n),h('small',{class:'mu'},new Date(x.d).toLocaleDateString('ar')+(x.ed?' · معدّل':'')),h('span',{class:'sp'}),mine?h('button',{class:'g s',onclick:edit},'تعديل'):'',mine?h('button',{class:'g s',onclick:rmv},'حذف'):''),h('p',{class:'ct'},x.t))};
const edit=()=>{const e=h('textarea',{maxlength:500},x.t);cd.innerHTML='';cd.append(e,h('div',{class:'row'},h('button',{onclick:async()=>{const v=e.value.trim();if(!v)return toast('التعليق فارغ');try{const n={...x,t:v,ed:Date.now()};await put('comments/'+g.id+'/'+i,n);Object.assign(x,n);view();toast('تم التعديل')}catch(_){toast('تعذّر الحفظ')}}},'حفظ'),h('button',{class:'g',onclick:view},'إلغاء')))};
const rmv=async()=>{if(!confirm('حذف تعليقك؟'))return;try{await del('comments/'+g.id+'/'+i);cd.remove();toast('تم الحذف')}catch(_){toast('تعذّر الحذف')}};
view();box.append(cd)})};
dlg(h('h3',{},g.title),ta,h('button',{onclick:async()=>{const u=me();if(!u)return authDlg(()=>{bar();toast('يمكنك التعليق الآن')});const t=ta.value.trim();if(!t)return;try{await put('comments/'+g.id+'/c'+Date.now().toString(36),{u:u.id,n:u.name,t,d:Date.now()});ta.value='';dr()}catch(e){toast('تعذّر الإرسال')}}},'إرسال'),box,closeBtn());dr()}

/* ---- صفحة التعريف ---- */
async function loadStory(m){const k='sg_game_'+m.id,c=JSON.parse(localStorage[k]||'null');if(c&&c.v==m.updated)return c.story;try{const s=await get('stories/'+m.id);try{localStorage[k]=JSON.stringify({v:m.updated,story:s})}catch(e){}return s}catch(e){if(c)return c.story;throw e}}
const pk=id=>'sg_p_'+id+'_'+(U?U.id:'guest');
async function getProg(id){let l=JSON.parse(localStorage[pk(id)]||'null');if(U)try{const r=await get('progress/'+U.id+'/'+id);if(r&&(!l||r.t>l.t))l=r}catch(e){}return l}
function persist(){if(pre)return;const o={...P,t:Date.now()};localStorage[pk(GM.id)]=JSON.stringify(o);if(U)put('progress/'+U.id+'/'+GM.id,o).catch(()=>{})}
async function delSave(id){localStorage.removeItem(pk(id));if(U)await del('progress/'+U.id+'/'+id)}
async function openOv(id){clr();au.pause();cm='';U=me();GM=LIST[id];$('#ls').hidden=1;exitRead();const o=$('#ov');o.hidden=0;o.innerHTML='<p class="mu">جارٍ التحميل…</p>';scrollTo(0,0);
try{S=await loadStory(GM)}catch(e){toast('تعذّر التحميل: لا اتصال ولا نسخة محفوظة');return back()}
