<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ساحة العمالقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a 16:9 projector screen centred in a dark theatre. Menus are paper title-cards laid over the canvas.
   One committed look (1930s ink and paper), so the page is intentionally single-theme with explicit colors. */
:root{--paper:#ecd9a8;--paper-d:#cfb47a;--ink:#1b1410;--red:#d4452a;--gold:#eab13c;--teal:#2c7a7b;--cream:#fff4d6;--theatre:#150f0b;
--font-d:'Lalezar','Cairo',system-ui,sans-serif;--font-b:'Cairo',system-ui,sans-serif;--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--theatre);color:var(--cream);font-family:var(--font-b);direction:rtl;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;width:100%;height:100%;display:grid;place-items:center}
#stage{position:relative;width:960px;height:540px;background:#000;overflow:hidden;border-radius:calc(var(--u)*14);box-shadow:0 0 0 calc(var(--u)*6) #0b0705,0 20px 60px #000a}
#cv{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
#fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;display:block}
#fx .vg{top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(20,10,0,0) 50%,rgba(20,10,0,.6) 100%)}
#fx .sl{top:0;right:0;bottom:0;left:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,rgba(0,0,0,0) 1px 3px)}
#fx .gr{top:-48px;right:-48px;bottom:-48px;left:-48px;background-image:var(--grain);background-size:192px 192px;opacity:.55;animation:gshift .6s steps(1) infinite}
@keyframes gshift{0%{transform:translate(0,0)}20%{transform:translate(-23px,14px)}40%{transform:translate(17px,-31px)}60%{transform:translate(-9px,-12px)}80%{transform:translate(26px,22px)}}
body.lite #fx .gr{animation:none}
#ui{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{background:var(--paper);color:var(--ink);border:calc(var(--u)*5) solid var(--ink);border-radius:calc(var(--u)*18);box-shadow:calc(var(--u)*10) calc(var(--u)*10) 0 var(--ink);padding:calc(var(--u)*20) calc(var(--u)*28);width:calc(var(--u)*580);max-width:96%;max-height:calc(var(--u)*500);overflow:auto;text-align:center;transform:rotate(-.5deg);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.panel.wide{width:calc(var(--u)*820)}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}}
h1{font-family:var(--font-d);font-weight:400;font-size:calc(var(--u)*84);line-height:1;margin:0 0 calc(var(--u)*4);color:var(--red);-webkit-text-stroke:calc(var(--u)*3) var(--ink);paint-order:stroke fill;text-shadow:calc(var(--u)*4) calc(var(--u)*5) 0 var(--ink);}
h2{font-family:var(--font-d);font-weight:400;font-size:calc(var(--u)*38);margin:0 0 calc(var(--u)*8);color:var(--ink)}
.sub{font-weight:700;font-size:calc(var(--u)*19);margin:0 0 calc(var(--u)*16);opacity:.8}
.btns{display:flex;flex-direction:column;gap:calc(var(--u)*12);align-items:center}
.row{display:flex;gap:calc(var(--u)*10);justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--font-d);font-size:calc(var(--u)*26);background:var(--cream);color:var(--ink);border:calc(var(--u)*4) solid var(--ink);border-radius:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*22);min-width:calc(var(--u)*230);box-shadow:0 calc(var(--u)*5) 0 var(--ink);cursor:pointer;transition:transform .08s}
.btn:hover{transform:translateY(calc(var(--u)*-2)) rotate(-1deg)}
.btn:active{transform:translateY(calc(var(--u)*4)) scale(1.04,.94);box-shadow:0 calc(var(--u)*1) 0 var(--ink)}
.btn.big{background:var(--red);color:var(--cream);font-size:calc(var(--u)*34);-webkit-text-stroke:calc(var(--u)*1.2) var(--ink);paint-order:stroke fill}
.btn.sm{min-width:0;font-size:calc(var(--u)*20);padding:calc(var(--u)*4) calc(var(--u)*14)}
.btn:focus-visible,.lv:focus-visible,.opt:focus-visible{outline:calc(var(--u)*4) solid var(--teal);outline-offset:2px}
.btn.on,.opt.on{background:var(--gold)}
.wn{font-family:var(--font-d);font-size:calc(var(--u)*22);text-align:right;margin:calc(var(--u)*10) 0 calc(var(--u)*4);display:flex;justify-content:space-between}
.wn small{font-family:var(--font-b);font-weight:700;font-size:calc(var(--u)*14);opacity:.7;align-self:center}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(var(--u)*6)}
.lv{font-family:var(--font-d);font-size:calc(var(--u)*22);background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*9);padding:calc(var(--u)*3) 0;height:calc(var(--u)*50);cursor:pointer;position:relative;line-height:1}
.lv i{position:absolute;left:calc(var(--u)*3);bottom:calc(var(--u)*1);font-style:normal;font-size:calc(var(--u)*13);color:var(--red)}
.lv.mega{background:var(--gold)}
.lv.lock{opacity:.35;cursor:not-allowed}
.lv:not(.lock):active{transform:scale(.93)}
.opts{display:grid;gap:calc(var(--u)*8);text-align:right}
.opt{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:calc(var(--u)*19);background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*10);padding:calc(var(--u)*6) calc(var(--u)*14);cursor:pointer;font-family:var(--font-b);color:var(--ink);width:100%;text-align:right}
.opt b{font-family:var(--font-d);font-weight:400;font-size:calc(var(--u)*20)}
.help{font-size:calc(var(--u)*15);font-weight:700;line-height:1.7;text-align:right;opacity:.85;margin-top:calc(var(--u)*10)}
.grade{font-family:var(--font-d);font-size:calc(var(--u)*120);line-height:.9;color:var(--red);-webkit-text-stroke:calc(var(--u)*3) var(--ink);paint-order:stroke fill;text-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 var(--ink);transform:rotate(-6deg);display:inline-block;animation:pop .5s .15s both cubic-bezier(.2,1.8,.4,1)}
.stats{display:flex;justify-content:center;gap:calc(var(--u)*22);font-weight:900;font-size:calc(var(--u)*20);margin:calc(var(--u)*8) 0 calc(var(--u)*14)}
.stats span{display:block;font-size:calc(var(--u)*14);opacity:.65}
.ibtn{position:absolute;top:calc(var(--u)*10);left:calc(var(--u)*10);width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:50%;border:calc(var(--u)*3) solid var(--ink);background:var(--cream);color:var(--ink);font-size:calc(var(--u)*16);font-weight:900;cursor:pointer;opacity:.85;padding:0}
.ibtn[hidden]{display:none}
#boot{position:absolute;top:0;right:0;bottom:0;left:0;background:#150f0b;display:grid;place-content:center;gap:calc(var(--u)*14);text-align:center;z-index:5;transition:opacity .5s}
#boot .bt{font-family:var(--font-d);font-size:calc(var(--u)*64);color:var(--gold)}
#boot .bar{width:calc(var(--u)*320);height:calc(var(--u)*12);border:calc(var(--u)*3) solid var(--gold);border-radius:99px;overflow:hidden;margin:auto}
#boot .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
#boot .bs{font-weight:700;opacity:.7;font-size:calc(var(--u)*16)}
#touch{position:absolute;left:0;right:0;bottom:0;padding:0 16px 12px 16px;display:flex;justify-content:space-between;align-items:flex-end;direction:ltr;pointer-events:none;z-index:4}
#touch[hidden]{display:none}
.pad{display:flex;gap:16px;align-items:flex-end;pointer-events:none}
.acts{display:grid;gap:10px 14px;align-items:end;justify-items:center;pointer-events:none;grid-template-areas:"sup dash up" ". jump shoot"}
#touch.swp .acts{grid-template-areas:"sup up dash" ". shoot jump"}
#touch.mir{flex-direction:row-reverse}
#touch.mir .acts{grid-template-areas:"up dash sup" "shoot jump ."}
#touch.mir.swp .acts{grid-template-areas:"dash up sup" "jump shoot ."}
.tb.p{width:var(--tbp,72px);height:var(--tbp,72px);font-size:26px}
.tb{pointer-events:auto;touch-action:none;font-family:var(--font-d);font-size:17px;width:var(--tbn,56px);height:var(--tbn,56px);border-radius:50%;border:4px solid var(--ink);background:rgba(236,217,168,.82);color:var(--ink);padding:0;box-shadow:0 4px 0 var(--ink);line-height:1}
.tb.s{width:var(--tbs,44px);height:var(--tbs,44px);font-size:14px}
.tb.m{width:var(--tbp,72px);height:var(--tbp,72px);font-size:20px}
.tb.r{background:rgba(212,69,42,.88);color:var(--cream)}
.tb.dn{transform:translateY(4px) scale(.94);box-shadow:0 0 0 var(--ink);filter:brightness(1.12)}
#rot{position:absolute;top:0;right:0;bottom:0;left:0;background:#150f0b;color:var(--gold);font-family:var(--font-d);font-size:30px;display:none;place-content:center;text-align:center;z-index:9;padding:24px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:grid}}
.slots{display:grid;gap:calc(var(--u)*10);text-align:right}
.slot{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*10);background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*14)}
.slot.cur{background:var(--gold)}
.slot b{font-family:var(--font-d);font-weight:400;font-size:calc(var(--u)*24);display:block}
.slot small{font-weight:700;font-size:calc(var(--u)*14);opacity:.75;display:block}
.slot .row{flex-wrap:nowrap}
.btn.red{background:var(--red);color:var(--cream)}
.code{width:100%;height:calc(var(--u)*120);direction:ltr;text-align:left;font:calc(var(--u)*12)/1.3 monospace;background:var(--cream);color:var(--ink);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8);resize:none;user-select:text;-webkit-user-select:text;touch-action:auto;word-break:break-all}
.row>.opt{width:auto;flex:1 1 0;min-width:0;justify-content:center;gap:calc(var(--u)*8)}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);text-align:right}
.ch{background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*10);padding:calc(var(--u)*6) calc(var(--u)*12);font-family:var(--font-b);color:var(--ink);cursor:pointer;text-align:right;font-weight:900;font-size:calc(var(--u)*17);line-height:1.3}
.ch small{display:block;font-weight:700;font-size:calc(var(--u)*13);opacity:.75}
.ch.done{background:#cfe9a8}.ch.lock{opacity:.4;cursor:not-allowed}
.up{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*10);background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*12);padding:calc(var(--u)*6) calc(var(--u)*14);text-align:right;font-weight:900;font-size:calc(var(--u)*18)}
.up small{display:block;font-weight:700;font-size:calc(var(--u)*13);opacity:.75}
.coin{font-family:var(--font-d);font-size:calc(var(--u)*30);color:#8a5a00}
.vc{position:absolute;top:0;bottom:0;width:var(--cw,100px);display:flex;pointer-events:none}
.vc.L{left:0}.vc.R{right:0}
#vcols{position:absolute;top:0;right:0;bottom:0;left:0;z-index:4;pointer-events:none;direction:ltr}
#vcols[hidden]{display:none}
.vt{flex:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:6px;direction:ltr}
.vt[data-pl="0"]{background:linear-gradient(#4a0f08,#2a0905)}
.vt[data-pl="1"]{background:linear-gradient(#081f4a,#050f26)}
.vt .tb{width:var(--bs,56px);height:var(--bs,56px);font-size:calc(var(--bs,56px)*.24);color:#fff;border-color:#000;box-shadow:0 3px 0 #000}
.vt[data-pl="0"] .tb{background:rgba(212,69,42,.95)}.vt[data-pl="1"] .tb{background:rgba(47,111,208,.95)}
.vt .tb.dn{filter:brightness(1.35)}
#stage.play{border-radius:0;box-shadow:none}
@media (prefers-reduced-motion:reduce){.panel,.grade{animation:none}}
.cn{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#ffd23c;border:.12em solid #1b1410;vertical-align:-.1em;box-sizing:border-box}.ngap .btns>*+*{margin-top:calc(var(--u)*12)}
.ngap .row>*{margin:calc(var(--u)*5)}
.ngap .stats>*+*{margin-right:calc(var(--u)*22)}
.ngap .pad>*+*{margin-left:16px}
.ngap .sel>*+*{margin-right:8px}
.ngap .slot>*+*,.ngap .up>*+*{margin-right:calc(var(--u)*10)}
.ngap .row>.opt>*+*{margin-right:calc(var(--u)*8)}
.ngap .vt>*{margin:4px}
.ngap #boot>*+*{margin-top:calc(var(--u)*14)}
.csk{position:absolute;left:12px;top:42px;z-index:7;pointer-events:auto}.kings{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*10);margin:calc(var(--u)*8) 0}
.kg{background:var(--cream);border:calc(var(--u)*3) solid var(--ink);border-radius:calc(var(--u)*12);padding:calc(var(--u)*8);text-align:center}
.kg .kp{position:relative;height:calc(var(--u)*92);display:flex;align-items:center;justify-content:center}
.kg img{max-width:100%;max-height:100%;display:block}
.kg .q{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:calc(var(--u)*64);color:#fff4d6;text-shadow:0 0 calc(var(--u)*6) #000}
.kg.x .kp:before,.kg.x .kp:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:calc(var(--u)*11);margin-top:calc(var(--u)*-5.5);background:#d4452a;border:calc(var(--u)*2.5) solid var(--ink);border-radius:99px;transform:rotate(45deg)}
.kg.x .kp:after{transform:rotate(-45deg)}
.kg small{display:block;margin-top:calc(var(--u)*4);font-weight:900;font-size:calc(var(--u)*15)}
</style>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="fx"><i class="vg"></i><i class="sl"></i><i class="gr"></i></div>
    <div id="ui"></div>
    <button id="pbtn" class="ibtn" hidden aria-label="إيقاف مؤقت">❚❚</button>
    <div id="boot"><div class="bt">ساحة العمالقة</div><div class="bar"><i id="bar"></i></div><div class="bs" id="bs">تحميل أولي خفيف…</div></div>
  </div>
  <div id="touch" hidden>
    <div class="pad"><button class="tb p" data-k="l" aria-label="يسار">◀</button><button class="tb p" data-k="r" aria-label="يمين">▶</button></div>
    <div class="acts">
      <button class="tb s" data-k="sup" style="grid-area:sup">سوبر</button>
      <button class="tb s" data-k="dash" style="grid-area:dash">اندفاع</button>
      <button class="tb s" data-k="fu" style="grid-area:up" aria-label="إطلاق للأعلى">▲</button>
      <button class="tb m" data-k="jump" style="grid-area:jump">قفز</button>
      <button class="tb m r" data-k="shoot" style="grid-area:shoot">نار</button>
    </div>
  </div>
  <div id="vcols" hidden>
    <div class="vc L"><div class="vt" data-pl="0"><button class="tb" data-p="0" data-k="l">◀</button><button class="tb" data-p="0" data-k="r">▶</button><button class="tb" data-p="0" data-k="fu">▲</button><button class="tb" data-p="0" data-k="shoot">نار</button><button class="tb" data-p="0" data-k="dash">اندفاع</button><button class="tb" data-p="0" data-k="jump">قفز</button></div></div>
    <div class="vc R"><div class="vt" data-pl="1"><button class="tb" data-p="1" data-k="l">◀</button><button class="tb" data-p="1" data-k="r">▶</button><button class="tb" data-p="1" data-k="fu">▲</button><button class="tb" data-p="1" data-k="shoot">نار</button><button class="tb" data-p="1" data-k="dash">اندفاع</button><button class="tb" data-p="1" data-k="jump">قفز</button></div></div>
  </div>
  <div id="rot">أدر جهازك أفقياً<br>لتبدأ المعركة</div>
</div>
<script>'use strict';
/* ================= CORE ================= */
const W=960,H=540,GY=452,TAU=Math.PI*2,INK='#1b1410',CREAM='#fff4d6';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hsl=(h,s,l,a)=>{h=((h%360)+360)%360;s=clamp(s,0,100);l=clamp(l,0,100);return a==null?`hsl(${h} ${s}% ${l}%)`:`hsl(${h} ${s}% ${l}% / ${a})`};
const isMob=(navigator.maxTouchPoints||0)>0||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent||'');
const isTouch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||'ontouchstart' in window;

const DEF={cs:1,sfx:1,amb:1,aim:0,q:0,all:0,wp:'p',mir:0,swp:0,lite:0,fps:0};
let SL={cur:0,slots:[null,null,null,null],o:Object.assign({},DEF)};
try{const v2=JSON.parse(localStorage.getItem('arena100v2')||'null');
 if(v2&&v2.slots){SL.cur=v2.cur|0;SL.slots=[0,1,2,3].map(i=>v2.slots[i]||null);Object.assign(SL.o,v2.o||{})}
 else{const v1=JSON.parse(localStorage.getItem('arena100v1')||'null');if(v1){SL.slots[0]={max:v1.max||1,rank:v1.rank||{},t:Date.now()};Object.assign(SL.o,v1.o||{})}}}catch(e){}
SL.o.all=0;
let save={sn:{},max:1,rank:{},coins:0,up:{hp:0,dm:0,sm:0},chal:{},daily:null,o:SL.o};
function loadSlot(i){SL.cur=i;if(!SL.slots[i])SL.slots[i]={max:1,rank:{},t:Date.now()};const d=SL.slots[i];save.max=d.max||1;save.rank=d.rank||{};save.coins=d.coins|0;save.up=Object.assign({hp:0,dm:0,sm:0},d.up||{});save.chal=d.chal||{};save.daily=d.daily||null;save.sn=d.sn||{}}
loadSlot(SL.cur);
const persist=()=>{try{SL.slots[SL.cur]={max:save.max,rank:save.rank,coins:save.coins,up:save.up,chal:save.chal,daily:save.daily,sn:save.sn,t:Date.now()};localStorage.setItem('arena100v2',JSON.stringify(SL))}catch(e){}};

/* ============ WORLDS ============ */
const WORLDS=[
{n:'غابة الهمس',h:100,s:46,l:0,t:'round',amb:[420,.07],mote:'#fff4d6'},
{n:'غابة الخريف',h:28,s:70,l:0,t:'round',amb:[600,.08],mote:'#ffb347'},
{n:'غابة الصقيع',h:196,s:40,l:8,t:'pine',amb:[900,.09],mote:'#ffffff'},
{n:'مستنقع الضباب',h:150,s:30,l:-8,t:'swamp',amb:[260,.06],mote:'#d8f0c0'},
{n:'غابة الفطر',h:290,s:44,l:-2,t:'mush',amb:[300,.05],mote:'#ff9ad0'},
{n:'غابة الغروب',h:12,s:62,l:-2,t:'round',amb:[500,.07],mote:'#ffd080'},
{n:'غابة الخيزران',h:80,s:44,l:2,t:'bamboo',amb:[800,.07],mote:'#e8ffd0'},
{n:'الغابة المحترقة',h:8,s:60,l:-10,t:'burnt',amb:[170,.11],mote:'#ff8a2e'},
{n:'غابة الليل',h:240,s:42,l:-16,t:'round',amb:[200,.05],mote:'#ffe870',night:1},
{n:'الأطلال القديمة',h:60,s:30,l:-6,t:'ruin',amb:[140,.06],mote:'#fff4d6'}];

/* ============ AUDIO: sound effects + ambience only, no music ============ */
const AU={c:null,m:null,nb:null,
init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.c=new C();this.m=c.createGain();this.m.gain.value=.55;this.m.connect(c.destination);
 const nb=this.nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

/* ============ STAGE STREAMING (GTA-SA style) ============
   A level is as long as 4-6 screens. Only the chunks around the camera exist in memory:
   they are built just before they scroll into view (deterministic per level), and dropped behind you. */

function makeEnc(st){const R=mulberry(st.n*131+5),E=3+Math.floor(st.k/3),out=[],a=950,b=st.LW-1100;for(let i=0;i<E;i++)out.push({x:Math.round(a+(b-a)*(E===1?0:i/(E-1))+R()*60),done:0,waves:[],wi:0,wt:0});return out}
const Stream={nxt:null,
stage(n){const s=(this.nxt&&this.nxt.n===n)?this.nxt:makeStage(n);this.nxt=null;return s},
prime(st,cam){for(const[layer,off,map]of[['near',cam,st.near],['far',cam*FAR,st.far]]){const[a,b]=chunkRange(off);for(let i=a;i<=b;i++)if(!map.has(i))map.set(i,buildChunk(st,layer,i))}},
ahead(n){if(n>100||(this.nxt&&this.nxt.n===n))return;schedule(()=>{const st=makeStage(n);this.nxt=st;const steps=[['near',0],['far',0],['near',-1],['near',1],['far',-1],['far',1]];let i=0;const step=()=>{if(this.nxt!==st||i>=steps.length)return;const[l,idx]=steps[i++];(l==='near'?st.near:st.far).set(idx,buildChunk(st,l,idx));schedule(step)};schedule(step)})},
tick(st,cam,extra){let built=0;for(const[layer,off,map]of[['near',cam,st.near],['far',(cam+extra)*FAR,st.far]]){const[a,b]=chunkRange(off);
  if(!built)for(const i of[b+1,a-1]){if(map.has(i))continue;if(layer==='near'&&(i*W>st.LW+PAD||(i+1)*W<-PAD))continue;if(layer==='far'&&st.boss)continue;map.set(i,buildChunk(st,layer,i));built=1;break}

/* ================= PARTICLES ================= */
const PT=[];
function pt(o){if(PT.length>PCAP&&o.k!=='text'&&o.k!=='ring')return;o.max=o.life;PT.push(o)}
function puff(x,y,n,col=CREAM,sp=140,r0=9){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.2,1)*sp;pt({k:'puff',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,g:-20,life:rnd(.35,.7),r:rnd(r0*.6,r0*1.3),c:col})}}
function stars(x,y,n,col='#ffd23c',sp=300){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.3,1)*sp;pt({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,g:700,life:rnd(.45,.9),r:rnd(7,13),c:col,rot:rnd(0,3),vr:rnd(-8,8)})}}
function ringFx(x,y,r1,col,life=.45,lw=8){pt({k:'ring',x,y,life,r:r1,c:col,lw})}
function popText(x,y,s,col='#ff6fa8'){pt({k:'text',x,y,vx:0,vy:-70,g:0,life:.9,s,c:col})}
function mark(x){pt({k:'mark',x,y:0,life:.5,vx:0,vy:0,g:0})}
function updPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT[i]=PT[PT.length-1];PT.pop();continue}p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.vy=(p.vy||0)+(p.g||0)*dt;if(p.rot!=null)p.rot+=p.vr*dt}}
function drawPT(g){for(const p of PT){const u=p.life/p.max;
 if(p.k==='puff'){g.globalAlpha=Math.min(1,u*1.6);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*(1+(1-u)*.9),0,TAU);g.fill();if(QL>0){g.lineWidth=3;g.strokeStyle=INK;g.stroke()}g.globalAlpha=1}
 else if(p.k==='star'){g.globalAlpha=Math.min(1,u*2);g.strokeStyle=INK;star(g,p.x,p.y,p.r,p.rot,p.c);g.globalAlpha=1}
 else if(p.k==='ring'){g.globalAlpha=u;g.lineWidth=p.lw*u+2;g.strokeStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*(1.8-u*.8)*(1+(1-u)*2),0,TAU);g.stroke();g.globalAlpha=1}
 else if(p.k==='text'){g.globalAlpha=Math.min(1,u*2);txt(g,p.s,p.x,p.y,34,p.c,'center');g.globalAlpha=1}
 else if(p.k==='mark'){const f=Math.sin(u*30)>0;if(f){g.fillStyle='#e5322a';g.strokeStyle=INK;g.lineWidth=3;g.beginPath();g.moveTo(p.x-14,6);g.lineTo(p.x+14,6);g.lineTo(p.x,36);g.closePath();g.fill();g.stroke()}}}}
function txt(g,s,x,y,size,col,al='right',lw){g.save();g.direction='rtl';g.font=`${size}px Lalezar,Cairo,sans-serif`;g.textAlign=al;g.textBaseline='middle';g.lineJoin='round';g.lineWidth=lw||Math.max(4,size/5);g.strokeStyle=INK;g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y);g.restore()}

function* aimed(b,n,gap,sp=340,o){for(let i=0;i<n;i++){const m=mouth0(b);eShot(m.x,m.y,Math.atan2(G.p.y-30-m.y,G.p.x-m.x),sp*spd(),{pink:pk(),...o});SFX.es();yield gap*dtc()}}

const NP=[],PU=[];
const NT={runner:{hp:3,rx:20,ry:30},shooter:{hp:3,rx:20,ry:34},hopper:{hp:4,rx:26,ry:22},flyer:{hp:2,rx:26,ry:20},brute:{hp:14,rx:46,ry:56}};
const NHUE={runner:0,shooter:60,hopper:120,flyer:200,brute:300};
function spawnNPC(type,x,y){const d=NT[type],hp=Math.ceil(d.hp*(1+G.diff*.8));NP.push({type,x,y:y==null?GY:y,vx:0,vy:0,hp,max:hp,rx:d.rx,ry:d.ry,face:-1,t:rnd(0,5),cd:rnd(.5,1.5),flash:0,sx:1,sy:1,air:type==='flyer',onG:true,hue:(WORLDS[G.world].h+NHUE[type])%360,idle:0})}

function hitNPC(q){for(const e of NP){const cy=e.air?e.y:e.y-e.ry,dx=(q.x-e.x)/(e.rx+q.r),dy=(q.y-cy)/(e.ry+q.r);if(dx*dx+dy*dy<1){if(q.pr){q.hs=q.hs||[];if(q.hs.includes(e))continue;q.hs.push(e)}e.hp-=q.dmg;e.flash=.07;SFX.hit();G.p.meter=Math.min(5,G.p.meter+.006*q.dmg);if(e.hp<=0)killNPC(e);return true}}return false}

function updateNPCs(dt){const p=G.p,df=G.diff;
 for(let i=NP.length-1;i>=0;i--){const e=NP[i];e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.sx+=(1-e.sx)*Math.min(1,dt*8);e.sy+=(1-e.sy)*Math.min(1,dt*8);
  const dx=p.x-e.x,ad=Math.abs(dx);if(!p.dead)e.face=dx>=0?1:-1;
  switch(e.type){
  case'runner':e.x+=e.face*(150+df*90)*dt*(p.dead?0:1);break;
  case'shooter':{const want=!e.in?1:ad<300?-1:ad>470?1:0;e.x+=e.face*want*95*dt;e.cd-=dt;if(e.cd<=0&&ad<720&&!p.dead){e.cd=Math.max(1.1,2.3-df*1.1)+rnd(0,.5);e.sx=1.2;e.sy=.85;eShot(e.x+e.face*22,e.y-34,Math.atan2(p.y-30-(e.y-34),dx),300+df*120,{r:9,pink:pk()});SFX.es()}break}
  case'hopper':{if(e.onG){e.cd-=dt;if(e.cd<=0){e.vy=-640-rnd(0,120);e.vx=e.face*(190+df*80);e.onG=false;e.sy=1.3;e.sx=.8}}else{e.vy+=1900*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>=GY){e.y=GY;e.vy=0;e.onG=true;e.cd=Math.max(.3,.9-df*.4);e.sy=.7;e.sx=1.3;puff(e.x,GY,3,CREAM,60,5)}}break}
  case'flyer':{const lo0=(G.lock?G.camLock:G.cam)+50,tx=clamp(p.x+Math.sin(e.t*.8)*220,lo0,lo0+W-100);e.x+=clamp(tx-e.x,-1,1)*(150+df*60)*dt;e.y=e.fy!=null?e.fy+Math.sin(e.t*2.2)*40:e.y;if(e.fy==null)e.fy=e.y;e.cd-=dt;if(e.cd<=0&&Math.abs(tx-e.x)<160&&!p.dead){eShot(e.x,e.y+20,Math.PI/2,80,{r:13,gy:700,kind:'egg'});e.cd=Math.max(1,2.1-df*.8)}break}
  case'brute':{if(ad>80)e.x+=e.face*(70+df*30)*dt;e.cd-=dt;if(e.cd<=0&&ad<460&&!p.dead){e.cd=Math.max(2,3.4-df);e.sy=.75;e.sx=1.2;shake(8);SFX.boom(.4);puff(e.x,GY,6,CREAM,120,9);eShot(e.x+e.face*e.rx,GY-22,e.face>0?0:Math.PI,300*spd(),{r:22,kind:'wave',life:3})}break}}
  const vl=G.lock?G.camLock:G.cam;if(e.x>vl+40&&e.x<vl+W-40)e.in=1;else if(!e.in&&(G.t-(e.born||(e.born=G.t)))>9){e.x=vl+W-70;e.in=1}
  if(e.in&&(e.type==='shooter'||e.type==='flyer')){const lo=(G.lock?G.camLock:G.cam)+34;e.x=clamp(e.x,lo,lo+W-68)}
  const cy=e.air?e.y:e.y-e.ry;
  if(!p.dead&&G.state==='fight'){const ex=(p.x-e.x)/(e.rx+12),ey=(p.y-30-cy)/(e.ry+22);if(ex*ex+ey*ey<1)hurtPlayer()}
  if(e.x<G.cam-500||e.x>G.cam+W+500)NP.splice(i,1)}}

 const i1=tl?tv(VT[0]):human?{mv:(KS.KeyD?1:0)-(KS.KeyA?1:0),jh:KS.KeyW?1:0,dash:KS.KeyS?1:0,shoot:KS.KeyF?1:0,up:KS.KeyG?1:0}

 if(S.heart&&Math.random()<dt*9)S.fx.push({x:S.b.x+rnd(-40,40),y:S.b.y-60,vy:-50-rnd(0,40),l:1.6,r:rnd(7,13)});
 for(const f of S.fx){f.y+=f.vy*dt;f.l-=dt}S.fx=S.fx.filter(f=>f.l>0)}

function csHeart(g,x,y,r){g.save();g.translate(x,y);ink(g,3);g.fillStyle='#e8433b';g.beginPath();g.moveTo(0,r*.9);g.bezierCurveTo(-r*1.6,-r*.2,-r*.7,-r*1.3,0,-r*.4);g.bezierCurveTo(r*.7,-r*1.3,r*1.6,-r*.2,0,r*.9);g.closePath();g.fill();g.stroke();g.restore()}
function csPlayer(g,a,t){if(!a.vis)return;const hopY=a.hop?-Math.abs(Math.sin((t+a.ph)*6))*34:0;
 const p={x:0,y:0,face:a.face,vx:a.run?220:0,vy:0,onG:!a.air&&!a.hop,dash:0,sq:1,t:t+a.ph,hp:3,inv:0,sup:0,dead:0,look:0,trail:[],trT:0,shootT:0,mf:0,aimRel:0,pal:a.pal,meter:0,sc:0,jb:0,coy:0,dcd:0};
 g.save();g.translate(a.x,a.y+hopY);g.scale(a.s,a.s);g.globalAlpha=a.al;drawPlayer(g,p);g.restore()}
function csDrawBoss(g,k,t,alpha,x,y,sc){const b=csBoss(k.w);b.t=t;b.s=(b.mega?1+.025*k.w:1)*sc;b.sx=b.sy=1;b.open=k.talk?.45+.45*Math.sin(t*14):0;b.state=k.dead?'dead':'fight';b.flash=0;b.vis=alpha;
 const A=b.arch;let yy=y;if(yy==null)yy=GY-A.dy*b.s;b.x=x;b.y=yy;
 if(k.dead){b.sy=.92+Math.sin(t*2)*.02;b.flash=((t*5)|0)%3===0?.05:0}
 drawBoss(ctx,b)}
function csCage(g,c,S){if(!c.vis)return;const w=110,h=150,x=c.x,y=c.y+h/2;g.save();ink(g,5);g.strokeStyle=INK;
 g.fillStyle='rgba(30,20,10,.35)';g.fillRect(x-w/2,y-h,w,h);
 g.strokeStyle='#8a6a3a';g.lineWidth=7;
 g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x-w/2,y-h);g.lineTo(x+w/2,y-h);g.lineTo(x+w/2,y);g.stroke();
 for(let i=1;i<5;i++){const bx=x-w/2+i*w/5;if(c.open&&i>=2&&i<=3)continue;g.beginPath();g.moveTo(bx,y);g.lineTo(bx,y-h);g.stroke()}
 g.beginPath();g.moveTo(x-w/2-6,y);g.lineTo(x+w/2+6,y);g.stroke();g.beginPath();g.moveTo(x-w/2-6,y-h);g.lineTo(x+w/2+6,y-h);g.stroke();
 if(!c.open){g.fillStyle='#ffd23c';ink(g,3);g.fillRect(x-9,y-h/2-8,18,16);g.strokeRect(x-9,y-h/2-8,18,16)}
 g.restore()}
function csCaption(g,S){const b=S.beats[S.i];if(!b||!b.s)return;
 const bx=70,bw=W-140,bh=124,by=H-bh-22;
 g.save();g.lineWidth=5;g.strokeStyle=INK;g.fillStyle='#f1e3bf';
 g.beginPath();g.moveTo(bx+16,by);g.arcTo(bx+bw,by,bx+bw,by+bh,16);g.arcTo(bx+bw,by+bh,bx,by+bh,16);g.arcTo(bx,by+bh,bx,by,16);g.arcTo(bx,by,bx+bw,by,16);g.closePath();g.fill();g.stroke();
 const who={h:['سالم','#2d4f9e'],b:['سامي','#e07b1f'],k:['الملك '+KING[S.def.w],'#b3342a'],n:['الراوي','#5a4a3a']}[b.who]||['','#333'];
 if(who[0]){g.font='26px Lalezar,Cairo,sans-serif';g.direction='rtl';g.textAlign='right';g.textBaseline='middle';const tw=g.measureText(who[0]).width+36;
  g.fillStyle=who[1];g.beginPath();g.moveTo(bx+bw-30,by-16);g.lineTo(bx+bw-30-tw,by-16);g.lineTo(bx+bw-30-tw,by+16);g.lineTo(bx+bw-30,by+16);g.closePath();g.fill();g.stroke();
  g.fillStyle='#fff4d6';g.fillText(who[0],bx+bw-48,by)}
 g.font='27px Lalezar,Cairo,sans-serif';g.direction='rtl';g.textAlign='right';g.textBaseline='alphabetic';g.fillStyle=INK;
 if(!S.lines){const mw=bw-60,L=[];let cur=[];for(const w of S.words){const test=cur.concat(w).join(' ');if(cur.length&&g.measureText(test).width>mw){L.push(cur);cur=[w]}else cur.push(w)}if(cur.length)L.push(cur);S.lines=L}
 const shown=Math.floor(S.bt*6)+1;let c=0,ly=by+46;
 for(const L of S.lines){const part=L.slice(0,Math.max(0,shown-c));c+=L.length;if(part.length)g.fillText(part.join(' '),bx+bw-30,ly);ly+=38}
 if(shown>S.words.length&&((S.t*2)|0)%2===0){g.font='17px Lalezar,Cairo,sans-serif';g.textAlign='left';g.fillStyle='#8a7a5a';g.fillText('اضغط للمتابعة ‹',bx+24,by+bh-16)}
 g.restore()}

function csRender(){const g=ctx,S=CS;g.setTransform(RS,0,0,RS,0,0);g.globalAlpha=1;if(!S){return}
 const st=S.st,id=S.id,b=S.beats[S.i]||S.beats[S.beats.length-1];
 g.save();g.translate(0,-64);if(S.shake>0)g.translate(rnd(-1,1)*S.shake*6,rnd(-1,1)*S.shake*6);
 if(csPrimed!==st){Stream.prime(st,0);csPrimed=st}
 drawBack(g,st,0,0);drawNear(g,st,0);g.fillStyle='#2a2216';g.fillRect(-20,H-8,W+40,90);
 // next king silhouette + glow (after-boss scenes)
 if(S.nx){const k=S.def.w+1,gx=830,gy=200;const gr=g.createRadialGradient(gx,gy,10,gx,gy,260);gr.addColorStop(0,'rgba(255,60,40,.55)');gr.addColorStop(1,'rgba(255,60,40,0)');g.fillStyle=gr;g.fillRect(gx-260,gy-260,520,520);
  csDrawBoss(g,{w:k,dead:0,talk:0},S.t,.55,gx,gy+30,.5)}
 g.fillStyle='rgba(16,8,28,'+S.dark+')';g.fillRect(-20,-20,W+40,H+110);
 // shadows
 g.fillStyle='rgba(20,10,0,.3)';for(const a of [S.h,S.b]){if(a.vis&&a.al>0){g.beginPath();g.ellipse(a.x,GY+6,20*a.s,6,0,0,TAU);g.fill()}}
 if(S.k.vis&&(id===0||id===10||(id>=1&&id<=9)))csDrawBoss(g,S.k,S.t,S.k.vis,S.k.x,null,S.k.sc);
 if(S.b.vis&&id!==0&&!(id>=1&&id<=9))csPlayer(g,S.b,S.t);
 else if(S.b.vis)csPlayer(g,S.b,S.t);
 csCage(g,S.cage,S);
 csPlayer(g,S.h,S.t);
 for(const f of S.fx){g.globalAlpha=Math.min(1,f.l);csHeart(g,f.x,f.y,f.r);g.globalAlpha=1}
 g.restore();
 // cinema bars
 g.fillStyle='#0d0907';g.fillRect(0,0,W,34);g.fillRect(0,H-0,W,0);
 if(b.card){const a=Math.min(1,S.bt*1.2);g.globalAlpha=a;txt(g,b.card[0],W/2,H/2-26,id===0?92:70,'#ffd23c','center');txt(g,b.card[1],W/2,H/2+50,28,'#fff4d6','center');g.globalAlpha=1}
 else csCaption(g,S);
 if(S.fade>0){g.fillStyle='rgba(13,9,7,'+S.fade+')';g.fillRect(0,0,W,H)}
 const rem=b.d-S.bt;if(S.i===S.beats.length-1&&rem<.9){g.fillStyle='rgba(13,9,7,'+(1-rem/.9)+')';g.fillRect(0,0,W,H)}}
/* ================= KINGS GALLERY ================= */
const KIMG={};
function kingImg(k,beaten){const key=k+(beaten?'g':'b');if(KIMG[key])return KIMG[key];
 const b=spawnBoss((k+1)*10);b.t=1;b.s=1;b.sx=b.sy=1;b.open=.2;b.flash=0;b.vis=1;b.state='fight';b.x=390;b.y=360;
 const c=document.createElement('canvas');c.width=780;c.height=720;const g=c.getContext('2d');drawBoss(g,b);
 const d=g.getImageData(0,0,780,720).data;let x0=780,y0=720,x1=0,y1=0;
 for(let y=0;y<720;y+=2)for(let x=0;x<780;x+=2){if(d[(y*780+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
 x0=Math.max(0,x0-4);y0=Math.max(0,y0-4);const bw=Math.min(780-x0,x1-x0+8),bh=Math.min(720-y0,y1-y0+8),s=Math.min(1,150/Math.max(bw,bh));
 const o=document.createElement('canvas');o.width=Math.max(1,Math.round(bw*s));o.height=Math.max(1,Math.round(bh*s));const og=o.getContext('2d');og.drawImage(c,x0,y0,bw,bh,0,0,o.width,o.height);
 const im=og.getImageData(0,0,o.width,o.height),p=im.data;
 for(let i=0;i<p.length;i+=4){if(beaten){const l=p[i]*.3+p[i+1]*.59+p[i+2]*.11,v=l*.55+58;p[i]=p[i+1]=p[i+2]=v}else{p[i]=p[i+1]=p[i+2]=0}}
 og.putImageData(im,0,0);return KIMG[key]=o.toDataURL('image/png')}
function kingsHTML(){let n=0,h='';
 for(let k=0;k<10;k++){const beat=!!save.rank[(k+1)*10];if(beat)n++;
  h+=`<div class="kg${beat?' x':''}"><div class="kp"><img alt="" src="${kingImg(k,beat)}">${beat?'':'<span class="q">؟</span>'}</div><small>${beat?'الملك '+KING[k]:'؟؟؟'}</small></div>`}
 return `<div class="panel wide"><h2>ملوك الغابات</h2><p class="sub">اهزم كل ملك لتكشف هويته. هزمت ${ar(n)} من ١٠.</p><div class="kings">${h}</div><div class="row" style="margin-top:12px"><button class="btn" data-a="title">رجوع</button></div></div>`}
</script></body></html>
