<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>محرر الصفحات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sticky toolbar (tabs: text / insert / page) above a gray desk holding one white sheet that scales to fit.
   The sheet and its ink are fixed colors on purpose: they are the exported document and must not follow the theme. */
:root {
  --desk: #e3e8e6;
  --chrome: #fafbfb;
  --chrome-2: #eff2f1;
  --line: #ccd4d1;
  --text: #19211f;
  --muted: #5a6763;
  --accent: #1b6a56;
  --accent-ink: #ffffff;
  --accent-soft: #d6ebe4;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(20,30,28,.12), 0 8px 28px rgba(20,30,28,.14);
  --paper: #ffffff;
  --ink: #15191a;
  --rule: #262b2a;
  --head-bg: #e8ebea;
  --ui-font: 'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #141918; --chrome: #1f2524; --chrome-2: #29302e; --line: #3a4441;
    --text: #e6ecea; --muted: #98a6a1; --accent: #55bfa2; --accent-ink: #0a1511;
    --accent-soft: #24433b; --danger: #ff8a80;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #141918; --chrome: #1f2524; --chrome-2: #29302e; --line: #3a4441;
  --text: #e6ecea; --muted: #98a6a1; --accent: #55bfa2; --accent-ink: #0a1511;
  --accent-soft: #24433b; --danger: #ff8a80;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--ui-font); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { min-height: 100%; display: flex; flex-direction: column; }

/* toolbar */
.chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); border-bottom: 1px solid var(--line); }
.row { padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; }
.row + .row { border-top: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { gap: 4px; padding-block: 6px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.tools { flex-wrap: wrap; align-items: center; }
.tools[hidden], .ctx[hidden] { display: none; }
.ctx { flex-wrap: wrap; background: var(--chrome-2); }
.ctx .lbl { color: var(--muted); font-size: 13px; }
.grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.grp + .grp { padding-inline-start: 8px; margin-inline-start: 4px; border-inline-start: 1px solid var(--line); }
.b { min-width: 34px; height: 34px; padding: 0 10px; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.ctx .b { background: var(--chrome); }
.b:hover { border-color: var(--muted); }
.b.on { background: var(--accent-soft); border-color: var(--accent); }
.b.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.b.primary:disabled { opacity: .55; cursor: progress; }
.b.danger { color: var(--danger); }
.b.danger.arm { background: var(--danger); color: var(--chrome); border-color: var(--danger); }
.b svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sel-in { height: 34px; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 6px; padding: 0 8px; max-width: 100%; }
.ctx .sel-in { background: var(--chrome); }
.num { width: 64px; height: 34px; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 6px; padding: 0 8px; text-align: center; }
input[type="color"] { width: 34px; height: 34px; padding: 2px; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 6px; cursor: pointer; }
input[type="text"].nm { height: 34px; width: 180px; max-width: 100%; border: 1px solid var(--line); background: var(--chrome-2); border-radius: 6px; padding: 0 10px; }
input[type="range"] { accent-color: var(--accent); width: 140px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.fld { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }

/* desk */
.stage { direction: ltr; overflow-x: auto; flex: 1; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fit { margin: 0 auto; position: relative; }
.sheet { position: absolute; top: 0; left: 0; transform-origin: 0 0; box-shadow: var(--shadow); background: #fff; }
.guides { position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--ph) - 2px), rgba(27,106,86,.55) calc(var(--ph) - 2px), rgba(27,106,86,.55) var(--ph)); }
.handle { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; z-index: 6; cursor: nesw-resize; touch-action: none; box-shadow: 0 1px 4px rgba(0,0,0,.4); }

/* the document */
.paper { position: relative; direction: rtl; background: var(--paper); color: var(--ink); font-family: 'Cairo', sans-serif; font-size: 18px; line-height: 1.7; padding: 56px 64px; outline: none; overflow-wrap: anywhere; }
.paper p { margin: 0 0 .6em; }
.paper h1 { font-size: 2em; font-weight: 800; line-height: 1.3; margin: 0 0 .4em; }
.paper h2 { font-size: 1.5em; font-weight: 700; line-height: 1.35; margin: .6em 0 .3em; }
.paper h3 { font-size: 1.2em; font-weight: 700; margin: .5em 0 .3em; }
.paper blockquote { margin: .6em 0; padding: .2em 1em; border-inline-start: 4px solid #8a9692; color: #3d4644; }
.paper ul, .paper ol { margin: 0 0 .6em; padding-inline-start: 1.6em; }
.paper hr { border: 0; border-top: 2px solid var(--rule); margin: 1em 0; }
.paper a { color: #1b5fb0; }
.paper table { width: 100%; border-collapse: collapse; margin: .8em 0; }
.paper td, .paper th { border: 1px solid var(--rule); padding: 8px 10px; vertical-align: top; min-width: 28px; }
.paper th { background: var(--head-bg); font-weight: 700; }
.paper table.nb td, .paper table.nb th { border-color: transparent; }
.paper table.zebra tr:nth-child(even) td { background: #f3f4f2; }
.paper table.tc td, .paper table.tc th { text-align: center; }
.paper img { max-width: 100%; height: auto; cursor: pointer; }
.paper img.sel { outline: 3px solid #1b6a56; outline-offset: 2px; }
.paper img.rd { border-radius: 14px; }
.paper img.bd { border: 2px solid var(--rule); }
.paper .pb { position: relative; height: 0; user-select: none; clear: both; }
.paper .pb::before { content: ""; position: absolute; inset: 0 0 auto; border-top: 2px dashed #1b6a56; }
.paper .pb::after { content: "فاصل صفحة"; position: absolute; top: 4px; inset-inline-start: 0; font: 600 12px/1 'IBM Plex Sans Arabic', sans-serif; color: #1b6a56; background: #fff; padding: 2px 6px; border-radius: 4px; }
.paper .pb.sel { background: rgba(27,106,86,.12); }
.paper.exporting .pb::before, .paper.exporting .pb::after { display: none; }

.toast { position: fixed; z-index: 40; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; padding-inline: 16px; }
.toast span { background: var(--text); color: var(--chrome); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; box-shadow: var(--shadow); max-width: 100%; }
.toast span.show { opacity: 1; }
.hint { color: var(--muted); font-size: 13px; }
.fld select, .fld input { color: var(--text); }
@media (max-width: 560px) {
  .top h1 { font-size: 15px; }
  .b { padding: 0 8px; }
  .tools, .ctx { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .tools .grp, .ctx .grp, .ctx .hint, .ctx .lbl { flex-wrap: nowrap; flex: none; }
}
@media (prefers-reduced-motion: reduce) { .toast span { transition: none; } }
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="chrome" id="chrome">
    <div class="row top">
      <h1>محرر الصفحات</h1>
      <button class="b primary" id="xPdf" type="button">PDF</button>
      <button class="b primary" id="xPng" type="button">PNG</button>
      <button class="b primary" id="xJpg" type="button">JPG</button>
    </div>
    <div class="row tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="text" type="button">النص</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="insert" type="button">إدراج</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="page" type="button">الصفحة</button>
    </div>

    <div class="row tools" data-panel="text">
      <div class="grp">
        <select class="sel-in" id="fontSel" title="الخط" aria-label="الخط">
          <option value="Cairo">Cairo</option>
          <option value="Tajawal">Tajawal</option>
          <option value="Amiri">Amiri (نسخ كلاسيكي)</option>
          <option value="Noto Naskh Arabic">Noto Naskh (نسخ)</option>
          <option value="Reem Kufi">Reem Kufi (كوفي)</option>
          <option value="Aref Ruqaa">Aref Ruqaa (رقعة)</option>
          <option value="IBM Plex Sans Arabic">IBM Plex Arabic</option>
          <option value="Georgia">Georgia</option>
          <option value="Courier New">Courier New</option>
        </select>
        <select class="sel-in" id="sizeSel" title="حجم الخط" aria-label="حجم الخط">
          <option value="">الحجم</option>
          <option>12</option><option>14</option><option>16</option><option>18</option><option>20</option>
          <option>24</option><option>28</option><option>32</option><option>40</option><option>48</option><option>64</option><option>72</option>
        </select>
        <select class="sel-in" id="blockSel" title="النمط" aria-label="النمط">
          <option value="p">فقرة</option>
          <option value="h1">عنوان كبير</option>
          <option value="h2">عنوان فرعي</option>
          <option value="h3">عنوان صغير</option>
          <option value="blockquote">اقتباس</option>
        </select>
      </div>
      <div class="grp">
        <button class="b" type="button" data-cmd="bold" data-state="bold" title="عريض"><b>B</b></button>
        <button class="b" type="button" data-cmd="italic" data-state="italic" title="مائل"><i>I</i></button>
        <button class="b" type="button" data-cmd="underline" data-state="underline" title="تسطير"><u>U</u></button>
        <button class="b" type="button" data-cmd="strikeThrough" data-state="strikeThrough" title="يتوسطه خط"><s>S</s></button>
        <label class="b" title="لون الخط" style="padding:0 6px"><span>A</span><input type="color" id="fgColor" value="#15191a" aria-label="لون الخط"></label>
        <label class="b" title="تظليل" style="padding:0 6px"><span>تظليل</span><input type="color" id="hlColor" value="#fff2a8" aria-label="لون التظليل"></label>
        <button class="b" type="button" id="hlOff" title="إزالة التظليل">×</button>
      </div>
      <div class="grp">
        <button class="b" type="button" data-cmd="justifyRight" data-state="justifyRight" data-ic="alR" title="محاذاة لليمين"></button>
        <button class="b" type="button" data-cmd="justifyCenter" data-state="justifyCenter" data-ic="alC" title="توسيط"></button>
        <button class="b" type="button" data-cmd="justifyLeft" data-state="justifyLeft" data-ic="alL" title="محاذاة لليسار"></button>
        <button class="b" type="button" data-cmd="justifyFull" data-state="justifyFull" data-ic="alJ" title="ضبط"></button>
        <button class="b" type="button" data-cmd="insertUnorderedList" data-state="insertUnorderedList" data-ic="ul" title="قائمة نقطية"></button>
        <button class="b" type="button" data-cmd="insertOrderedList" data-state="insertOrderedList" title="قائمة مرقمة">١.</button>
      </div>
      <div class="grp">
        <button class="b" type="button" id="dirRtl" title="اتجاه الفقرة من اليمين لليسار">عربي ←</button>
        <button class="b" type="button" id="dirLtr" title="اتجاه الفقرة من اليسار لليمين">→ English</button>
        <select class="sel-in" id="lhSel" title="تباعد الأسطر" aria-label="تباعد الأسطر">
          <option value="">الأسطر</option><option>1.3</option><option>1.5</option><option>1.7</option><option>2</option><option>2.4</option>
        </select>
      </div>
      <div class="grp">
        <button class="b" type="button" data-cmd="undo" title="تراجع">↶</button>
        <button class="b" type="button" data-cmd="redo" title="إعادة">↷</button>
      </div>
    </div>

    <div class="row tools" data-panel="insert" hidden>
      <div class="grp">
        <button class="b" type="button" id="addImg">إدراج صورة</button>
        <input type="file" id="imgIn" accept="image/*" multiple hidden>
        <span class="hint">أو الصق صورة / اسحبها إلى الصفحة</span>
      </div>
      <div class="grp">
        <span class="fld">صفوف <input class="num" id="tr" type="number" min="1" max="40" value="3"></span>
        <span class="fld">أعمدة <input class="num" id="tc" type="number" min="1" max="12" value="3"></span>
        <label class="chk"><input type="checkbox" id="th" checked> صف عنوان</label>
        <button class="b" type="button" id="addTable">إدراج جدول</button>
      </div>
      <div class="grp">
        <button class="b" type="button" id="addPb">فاصل صفحة</button>
        <button class="b" type="button" id="addHr">خط فاصل</button>
      </div>
    </div>

    <div class="row tools" data-panel="page" hidden>
      <div class="grp">
        <span class="fld">المقاس
          <select class="sel-in" id="sizeMode">
            <option value="a4p">A4 طولي</option>
            <option value="a4l">A4 عرضي</option>
            <option value="free">طول حر (صفحة واحدة طويلة)</option>
          </select>
        </span>
        <span class="fld">لون الصفحة <input type="color" id="pgColor" value="#ffffff" aria-label="لون الصفحة"></span>
        <span class="fld">التكبير
          <select class="sel-in" id="zoomSel">
            <option value="fit">تلقائي</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option>
          </select>
        </span>
      </div>
      <div class="grp">
        <span class="fld">اسم الملف <input type="text" class="nm" id="fname" value="صفحتي" maxlength="60"></span>
        <span class="fld">الصور المتعددة
          <select class="sel-in" id="imgMode">
            <option value="one">صورة واحدة طويلة</option>
            <option value="each">ملف لكل صفحة</option>
          </select>
        </span>
      </div>
      <div class="grp">
        <span class="hint" id="pageInfo"></span>
        <button class="b danger" type="button" id="newDoc">صفحة جديدة فارغة</button>
      </div>
    </div>

    <div class="row ctx" id="ctxTable" hidden>
      <span class="lbl">الجدول</span>
      <div class="grp">
        <button class="b" type="button" data-t="rowBelow">صف تحت</button>
        <button class="b" type="button" data-t="rowAbove">صف فوق</button>
        <button class="b danger" type="button" data-t="rowDel">حذف الصف</button>
      </div>
      <div class="grp">
        <button class="b" type="button" data-t="colRight">عمود يمين</button>
        <button class="b" type="button" data-t="colLeft">عمود يسار</button>
        <button class="b danger" type="button" data-t="colDel">حذف العمود</button>
      </div>
      <div class="grp">
        <span class="fld">لون الخلية <input type="color" id="cellBg" value="#e8ebea" aria-label="لون الخلية"></span>
        <span class="fld">الصف <input type="color" id="rowBg" value="#e8ebea" aria-label="لون الصف"></span>
        <button class="b" type="button" data-t="bgOff" title="إزالة لون الخلية والصف">بدون لون</button>
      </div>
      <div class="grp">
        <button class="b" type="button" data-t="hdr">صف العنوان</button>
        <button class="b" type="button" data-t="nb">بدون حدود</button>
        <button class="b" type="button" data-t="zebra">تظليل متبادل</button>
        <button class="b" type="button" data-t="tc">توسيط النص</button>
        <button class="b danger" type="button" data-t="tDel">حذف الجدول</button>
      </div>
    </div>

    <div class="row ctx" id="ctxImage" hidden>
      <span class="lbl">الصورة</span>
      <div class="grp">
        <span class="fld">العرض <input type="range" id="imgW" min="5" max="100" value="60" aria-label="عرض الصورة"></span>
        <select class="sel-in" id="imgAl" aria-label="موضع الصورة">
          <option value="c">في الوسط</option>
          <option value="r">يمين</option>
          <option value="l">يسار</option>
          <option value="fr">يمين والنص حولها</option>
          <option value="fl">يسار والنص حولها</option>
        </select>
      </div>
      <div class="grp">
        <label class="chk"><input type="checkbox" id="imgRd"> زوايا مدورة</label>
        <label class="chk"><input type="checkbox" id="imgBd"> إطار</label>
        <button class="b danger" type="button" id="imgDel">حذف الصورة</button>
      </div>
      <span class="hint">اسحب الدائرة الخضراء لتغيير الحجم</span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="fit" id="fit">
      <div class="sheet" id="sheet">
        <div class="paper" id="paper" contenteditable="true" spellcheck="false" dir="rtl" lang="ar" aria-label="الصفحة"></div>
        <div class="guides" id="guides"></div>
        <div class="handle" id="handle" hidden></div>
      </div>
    </div>
  </div>
  <div class="toast" aria-live="polite"><span id="toast"></span></div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var paper = $('#paper'), sheet = $('#sheet'), fit = $('#fit'), stage = $('#stage'), guides = $('#guides'), handle = $('#handle');
  var SIZES = { a4p: { w: 794, h: 1123 }, a4l: { w: 1123, h: 794 }, free: { w: 794, h: 0 } };
  var KEY = 'moharrir-alsafahat-v1';
  var S = { size: 'a4p', bg: '#ffffff', zoom: 'fit', name: 'صفحتي', imgMode: 'one' };
  var scale = 1, lastRange = null, lastCell = null, selImg = null, selPb = null, drag = null;

  var IC = {

    alL: '<path d="M3 6h18M3 12h12M3 18h16"/>',
    alJ: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    ul: '<path d="M10 6h11M10 12h11M10 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'
  };
  $$('[data-ic]').forEach(function (b) { b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[b.dataset.ic] + '</svg>'; });

  /* ---------- toast ---------- */
  var toastT;
  function say(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, ms || 2600);
  }

  /* ---------- sample content ---------- */
