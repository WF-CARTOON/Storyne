<title>مختبر جسور RosTrick</title>
<style>

html{background:var(--bg)}
body{margin:0;padding:0 16px 96px;background:var(--bg);color:var(--fg);font:15px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
h1{font-size:20px;margin:0}
header{padding:calc(var(--rt-statusbar-height,0px) + 14px) 0 10px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.grp{font-size:12px;font-weight:700;color:var(--mut);margin:20px 4px 4px;letter-spacing:.2px}
details.sec>summary{list-style:none;display:flex;align-items:center;padding:13px 14px;cursor:pointer;font-weight:700;min-height:52px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .nm{direction:ltr;unicode-bidi:embed;margin:0 10px}
details.sec>summary .sp{flex:1}
details.sec>summary .chev{transition:transform .15s;color:var(--mut)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:12px 14px 14px}
.bd{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px;margin-inline-start:6px}
.bd svg.i{width:14px;height:14px;margin-inline-end:4px}
.bd.ok{background:var(--okbg);color:var(--ok)}.bd.off{background:var(--warnbg);color:var(--warn)}.bd.no{background:var(--badbg);color:var(--bad)}
.note{font-size:13px;color:var(--mut);margin:2px 0 8px}
.btn{display:block;width:100%;border:0;border-radius:11px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;padding:11px 12px;margin:6px 0;min-height:46px;cursor:pointer;text-align:center}
.btn:active{background:var(--acc2)}
.btn.alt{background:var(--field);color:var(--fg);border:1px solid var(--line)}
.btn.red{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45}
.two{display:flex;flex-wrap:wrap;margin:0 -3px}.two>*{flex:1 1 130px;margin:0 3px}
.fld{display:block;width:100%;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:10px;padding:10px;font:inherit;margin:5px 0;direction:ltr;text-align:left}
.lbl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px;font-weight:600}
.lbl output{direction:ltr;font-variant-numeric:tabular-nums;color:var(--mut);font-weight:400}
input[type=range]{width:100%;margin:4px 0;accent-color:var(--acc);height:28px}
input[type=color]{width:56px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:2px}
.sw{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-weight:600}
.sw button{width:50px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none;cursor:pointer}
.sw button::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s}
.sw button.on{background:var(--acc)}.sw button.on::after{right:25px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
.seg button{flex:1;border:0;background:var(--field);color:var(--fg);font:inherit;padding:9px 4px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}.seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}
pre.out{background:var(--code);color:var(--codefg);border-radius:10px;padding:10px;margin:8px 0 0;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:190px;overflow:auto;min-height:38px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 12px;border-top:1px solid var(--line)}td:first-child{direction:ltr;text-align:left;unicode-bidi:embed}td:last-child{text-align:left;white-space:nowrap}
tr.h td{background:var(--field);font-weight:700;color:var(--mut);font-size:12px;border-top:0}
#wvbox{height:230px;border:2px dashed var(--line);border-radius:12px;margin:8px 0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center;padding:10px}
.tbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--field)}
.dl{display:flex;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding:8px 0}.dl:first-child{border-top:0}
.dl .t{flex:1 1 100%;min-width:0;margin-bottom:6px}.tbox:empty{display:none}.dl .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl .t small{color:var(--mut)}
.dl .bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.dl .bar i{display:block;height:100%;background:var(--acc)}
.dl button{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:6px 8px;margin-inline-start:5px;font:inherit;font-size:12px;cursor:pointer}
video,audio,img.pv{max-width:100%;border-radius:10px;margin-top:8px;display:block}
#logfab{position:fixed;bottom:16px;right:16px;background:var(--acc);color:var(--onacc);border:0;border-radius:26px;padding:0 16px;height:48px;font:inherit;font-weight:700;display:flex;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.3);z-index:20}
#logfab svg.i{margin-inline-end:6px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:68vh;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3);transform:translateY(105%);transition:transform .2s;z-index:30;display:flex;flex-direction:column;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
#sheet .hd{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700}
#sheet .hd .sp{flex:1}
#sheet .hd button{border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:6px 10px;margin-inline-start:6px;font:inherit}
#logbody{overflow:auto;padding:8px 12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;flex:1}
#logbody div{border-bottom:1px dashed var(--line);padding:3px 0;word-break:break-all}#logbody b{color:var(--acc)}
#toast{position:fixed;left:16px;right:16px;bottom:78px;background:#222;color:#fff;border-radius:10px;padding:11px 14px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
@media print{#logfab,#sheet,#toast,details.sec:not(#s_pdf){display:none!important}}
</style>
</head>

function ic(n){return '<svg class="i" viewBox="0 0 24 24"><path d="'+IC[n]+'"/></svg>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function J(x){if(typeof x==="string")return x;if(x===undefined)return "undefined";try{return JSON.stringify(x)}catch(e){return String(x)}}
function W(n){return window[n]||null}
function hasFn(o,f){return !!(o&&typeof o[f]==="function")}

/* ---------- السجل ---------- */
var LOG=[],logn=0;
function log(tag,msg){
  var t=new Date(),ts=("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2)+":"+("0"+t.getSeconds()).slice(-2);
  var line=ts+" ["+tag+"] "+(msg===undefined?"":J(msg)); LOG.push(line); if(LOG.length>400)LOG.shift(); logn++;
  $("logn").textContent=logn;
  var d=document.createElement("div"); d.innerHTML="<b>"+esc(ts)+"</b> ["+esc(tag)+"] "+esc(msg===undefined?"":J(msg));
  var lb=$("logbody"); lb.appendChild(d); while(lb.childNodes.length>400)lb.removeChild(lb.firstChild); lb.scrollTop=lb.scrollHeight;
  return line;
}
var toastT=0;
function toast(m){var e=$("toast");e.textContent=m;e.className="on";clearTimeout(toastT);toastT=setTimeout(function(){e.className=""},2200)}
var sheetOn=false;

/* ---------- الأقسام ---------- */
var SECS=[];
