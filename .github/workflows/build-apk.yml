# ============================================================
# RosTrick — بناء تطبيق الأندرويد (APK) على GitHub Actions
# هذا الملف تنشئه لوحة RosTrick تلقائياً في مستودعك، لا تعدّله يدوياً.
# يُشغَّل من اللوحة (زر "ابنِ التطبيق") ويقرأ الإعدادات من rostrick-build/config.json
# ويستخدم قالب التطبيق من rostrick-build/template.zip (ترسله اللوحة من assets التطبيق)
# ============================================================
name: RosTrick Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rostrick-build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (إعدادات اللوحة فقط)
        uses: actions/checkout@v4
        with:
          sparse-checkout: rostrick-build
          sparse-checkout-cone-mode: true

      - name: فك قالب التطبيق
        run: |
          test -f rostrick-build/config.json || { echo "::error::لم أجد rostrick-build/config.json — أرسل الإعدادات من اللوحة أولاً"; exit 1; }
          test -f rostrick-build/template.zip || { echo "::error::لم أجد rostrick-build/template.zip — اضغط «ابنِ التطبيق» من اللوحة ليُرسَل"; exit 1; }
          mkdir template
          unzip -q rostrick-build/template.zip -d template

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تطبيق إعدادات اللوحة على المشروع
        id: apply
        run: |
          pip install --quiet pillow
          ICON=""
          [ -f rostrick-build/icon.png ] && ICON="rostrick-build/icon.png"
          python3 template/tools/apply_config.py \
            --config rostrick-build/config.json \
            --project template \
            --icon "$ICON"

      - name: اختيار نسخة RootBeer المتاحة
        id: rootbeer
        run: |
          META=$(curl -fsSL https://repo1.maven.org/maven2/com/scottyab/rootbeer-lib/maven-metadata.xml || true)
          if echo "$META" | grep -q '<version>0.1.2</version>'; then V=0.1.2
          else V=$(echo "$META" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1); fi
          V=${V:-0.1.0}
          echo "RootBeer: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: تجهيز مفتاح التوقيع
        env:
          RT_PASS: ${{ secrets.RT_KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$RT_PASS" ]; then
            echo "::error::كلمة سر المفتاح غير موجودة في Secrets المستودع (RT_KEYSTORE_PASSPHRASE). اضغط «تجهيز البناء» في اللوحة."
            exit 1
          fi
          KS="$RUNNER_TEMP/release.p12"
          if [ -f rostrick-build/keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:RT_PASS \
              -in rostrick-build/keystore.enc -out "$KS" \
              || { echo "::error::تعذّر فك تشفير المفتاح — كلمة السر في Secrets لا تطابق المفتاح المحفوظ"; exit 1; }
            echo "KS_IS_NEW=0" >> "$GITHUB_ENV"
          else
            echo "لا يوجد مفتاح سابق: سيُنشأ مفتاح جديد (مرة واحدة فقط لهذا المستودع)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$RT_PASS" -keypass "$RT_PASS" \
              -alias rostrick -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=RosTrick, O=RosTrick"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:RT_PASS \
              -in "$KS" -out rostrick-build/keystore.enc
            echo "KS_IS_NEW=1" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$RT_PASS"
          echo "RT_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "RT_KEYSTORE_PASSWORD=$RT_PASS" >> "$GITHUB_ENV"
          echo "RT_KEY_ALIAS=rostrick" >> "$GITHUB_ENV"

      - name: تجهيز منصة أندرويد 36 (إن لم تكن موجودة على الجهاز)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" >/dev/null 2>&1 || echo "تعذّر تثبيت المنصة يدوياً، سيحاول Gradle تنزيلها"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: بناء APK
        if: steps.apply.outputs.build_apk == '1'
        working-directory: template
        run: gradle --no-daemon --stacktrace :app:assembleRelease -ProotbeerVersion=${{ steps.rootbeer.outputs.version }}

      - name: بناء AAB
        if: steps.apply.outputs.build_aab == '1'
        working-directory: template
        run: gradle --no-daemon --stacktrace :app:bundleRelease -ProotbeerVersion=${{ steps.rootbeer.outputs.version }}

      - name: التحقق من توقيع الـ AAB
        if: steps.apply.outputs.build_aab == '1'
        run: |
          AAB=$(ls template/app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -verify "$AAB" | head -3
          echo "AAB_SRC=$AAB" >> "$GITHUB_ENV"

      - name: التحقق من توقيع الـ APK
        if: steps.apply.outputs.build_apk == '1'
        run: |
          APK=$(ls template/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK_SRC=$APK" >> "$GITHUB_ENV"

      - name: التحقق من أيقونة التطبيق داخل الـ APK
        if: steps.apply.outputs.build_apk == '1'
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          ICON_PATH=$("$AAPT2" dump badging "$APK_SRC" | sed -n "s/^application-icon-640:'\(.*\)'.*/\1/p" | head -1)
          [ -z "$ICON_PATH" ] && ICON_PATH=$("$AAPT2" dump badging "$APK_SRC" | sed -n "s/^application-icon-[0-9]*:'\(.*\)'.*/\1/p" | tail -1)
          mkdir -p "$RUNNER_TEMP/apkicon" && unzip -p "$APK_SRC" "$ICON_PATH" > "$RUNNER_TEMP/apkicon/icon.png" || true
          if [ "${{ steps.apply.outputs.icon_used }}" = "1" ] && [ "${{ steps.apply.outputs.icon_style }}" = "adaptive" ]; then
            ICON_SHA="${{ steps.apply.outputs.icon_sha }}"
            echo "ICON_NOTE=أيقونة مخصصة تكيّفية (خلفية ${{ steps.apply.outputs.icon_bg }}, sha256: $ICON_SHA)" >> "$GITHUB_ENV"
            if unzip -l "$APK_SRC" | grep -q "res/mipmap-anydpi-v26/ic_launcher.xml"; then
              echo "الأيقونة التكيّفية موجودة داخل الـ APK ✓"
            else
              echo "::warning::لم أجد الأيقونة التكيّفية داخل الـ APK"
            fi
          elif [ "${{ steps.apply.outputs.icon_used }}" = "1" ]; then
            ICON_SHA="${{ steps.apply.outputs.icon_sha }}"
            echo "ICON_NOTE=أيقونة مخصصة (sha256: $ICON_SHA)" >> "$GITHUB_ENV"
            python3 - <<PY
          from PIL import Image
          src = Image.open("template/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png").convert("RGBA")
          try:
              got = Image.open("$RUNNER_TEMP/apkicon/icon.png").convert("RGBA")
              same = got.size == src.size and got.tobytes() == src.tobytes()
          except Exception as e:
              same = False
          print("الأيقونة داخل الـ APK تطابق الأيقونة المخصصة:", same)
          if not same:
              print("::warning::لم أستطع مطابقة أيقونة الـ APK مع الأيقونة المخصصة")
          PY
          else
            echo "ICON_NOTE=الأيقونة الافتراضية" >> "$GITHUB_ENV"
            echo "لا توجد أيقونة مخصصة: استُخدمت الأيقونة الافتراضية"
          fi

      - name: حفظ المفتاح المشفّر في المستودع (أول مرة فقط)
        if: env.KS_IS_NEW == '1'
        run: |
          git config user.name "rostrick-bot"
          git config user.email "rostrick-bot@users.noreply.github.com"
          git add rostrick-build/keystore.enc
          git commit -m "RosTrick: حفظ مفتاح التوقيع المشفّر"
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 2; }; done

      - name: تسمية الملفات
        run: |
          BASE="${{ steps.apply.outputs.package_name }}-v${{ steps.apply.outputs.version_name }}-${{ steps.apply.outputs.version_code }}-b${{ github.run_number }}"
          mkdir -p dist
          FILES=""
          if [ "${{ steps.apply.outputs.build_apk }}" = "1" ]; then cp "$APK_SRC" "dist/$BASE.apk"; FILES="$FILES $BASE.apk"; fi
          if [ "${{ steps.apply.outputs.build_aab }}" = "1" ]; then cp "$AAB_SRC" "dist/$BASE.aab"; FILES="$FILES $BASE.aab"; fi
          [ -z "$FILES" ] && { echo "::error::لم يُبنَ أي ملف"; exit 1; }
          echo "OUT_FILES=$FILES" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "TAG=apk-${{ steps.apply.outputs.version_code }}" >> "$GITHUB_ENV"
          echo "ICON_NOTE=${ICON_NOTE:-الأيقونة الافتراضية}" >> "$GITHUB_ENV"

      - name: توليد assetlinks.json (الروابط العميقة المتحقَّق منها)
        if: steps.apply.outputs.assetlinks_enabled == '1'
        env:
          RT_PASS: ${{ secrets.RT_KEYSTORE_PASSPHRASE }}
          AL_PKG: ${{ steps.apply.outputs.package_name }}
          AL_EXTRA: ${{ steps.apply.outputs.assetlinks_extra }}
        run: |
          FP=$(keytool -list -v -keystore "$RT_KEYSTORE_PATH" -storetype PKCS12 -storepass "$RT_PASS" -alias rostrick | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          [ -z "$FP" ] && { echo "::error::تعذّر استخراج بصمة SHA-256 من مفتاح التوقيع"; exit 1; }
          mkdir -p dist
          AL_FP="$FP" python3 - <<'PY'
          import json, os
          fps = [os.environ["AL_FP"]]
          for x in os.environ.get("AL_EXTRA", "").split(","):
              x = x.strip()
              if x and x not in fps:
                  fps.append(x)
          data = [{"relation": ["delegate_permission/common.handle_all_urls"],
                   "target": {"namespace": "android_app", "package_name": os.environ["AL_PKG"], "sha256_cert_fingerprints": fps}}]
          json.dump(data, open("dist/assetlinks.json", "w"), indent=2)
          print(open("dist/assetlinks.json").read())
          PY
          cp dist/assetlinks.json rostrick-build/assetlinks.json
          echo "AL_READY=1" >> "$GITHUB_ENV"

      - name: نشر الملفات في Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="بُني بواسطة RosTrick — ${{ steps.apply.outputs.package_name }} الإصدار ${{ steps.apply.outputs.version_name }} (${{ steps.apply.outputs.version_code }}) — بناء رقم ${{ github.run_number }} — $ICON_NOTE — المخرج: ${{ steps.apply.outputs.output_format }}"
          UPLOADS=""
          for F in $OUT_FILES; do UPLOADS="$UPLOADS dist/$F"; done
          [ "$AL_READY" = "1" ] && UPLOADS="$UPLOADS dist/assetlinks.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $UPLOADS --clobber
            gh release edit "$TAG" --notes "$NOTES" --latest
          else
            gh release create "$TAG" $UPLOADS --title "$TAG" --notes "$NOTES" --target "${{ github.sha }}" --latest
          fi
          # نُبقي آخر 10 ملفات من كل نوع (APK و AAB) في هذا الإصدار (للسجل)
          for EXT in apk aab; do
            gh release view "$TAG" --json assets -q ".assets | map(select(.name | endswith(\".$EXT\"))) | sort_by(.createdAt) | reverse | .[10:] | .[].name" | while read -r OLD; do
              [ -n "$OLD" ] && gh release delete-asset "$TAG" "$OLD" -y || true
            done
          done
          for F in $OUT_FILES; do echo "تم النشر: https://github.com/${{ github.repository }}/releases/download/$TAG/$F"; done

      - name: نشر نسخة عامة للتحميل عبر Cloudflare Worker (الكبيرة تُقسَّم لأجزاء يجمعها الـ Worker)
        run: |
          git config user.name "rostrick-bot"
          git config user.email "rostrick-bot@users.noreply.github.com"
          # الـ Worker ينشر مجلد المستودع كاملاً ويرفض أي ملف أكبر من 25MB (فيفشل نشر الموقع كله). لذلك:
          #   حتى 23MB  => __rostrick_download.<ext> في الجذر (يخدمه الـ Worker كما هو).
          #   أكبر من 23MB => أجزاء 20MB في rostrick-big/ + ملف .parts.json، وسكربت rostrick-worker.js يجمعها ويقدّمها
          #                   على نفس الرابط /__rostrick_download.<ext> (يعمل مع المستودع الخاص).
          # actions/checkout أعلاه يسحب rostrick-build فقط (sparse-checkout)؛ أجزاء rostrick-big من بناء سابق تكون خارجه فيرفض git حذفها.
          git sparse-checkout disable 2>/dev/null || true
          WORKER_MAX=$((23 * 1024 * 1024)); PART=$((20 * 1024 * 1024)); BIG_DIR="rostrick-big"
          CHANGED=0; NEED_WORKER=0
          for EXT in apk aab; do
            SRC="dist/$BASE.$EXT"
            [ -f "$SRC" ] || continue
            ROOT_COPY="__rostrick_download.$EXT"; BIG_BASE="$BIG_DIR/__rostrick_download.$EXT"
            # نظّف أي نسخة أو أجزاء سابقة لهذا النوع (بما فيها الملف الكامل من الإصدار القديم لهذه الخطوة)
            git ls-files -- "$BIG_BASE" "$BIG_BASE.parts.json" "$BIG_BASE.rtp*" | xargs -r git rm -q -f
            SIZE=$(stat -c%s "$SRC")
            if [ "$SIZE" -le "$WORKER_MAX" ]; then
              cp "$SRC" "$ROOT_COPY"; git add "$ROOT_COPY"
            else
              [ -f "$ROOT_COPY" ] && git rm -q -f "$ROOT_COPY"
              mkdir -p "$BIG_DIR"; rm -f "$BIG_BASE".rtp* "$BIG_BASE.parts.json"
              split -b "$PART" -d -a 3 --numeric-suffixes=1 "$SRC" "$BIG_BASE.rtp"
              EXT_NAME="$EXT" python3 - <<'PY'
          import json, os
          ext = os.environ["EXT_NAME"]
          d = "rostrick-big"
          base = "__rostrick_download." + ext
          names = sorted(f for f in os.listdir(d) if f.startswith(base + ".rtp"))
          parts = [{"f": f, "s": os.path.getsize(os.path.join(d, f))} for f in names]
          json.dump({"rtparts": 1, "name": base, "total": sum(p["s"] for p in parts), "parts": parts}, open(os.path.join(d, base + ".parts.json"), "w"))
          PY
              git add "$BIG_DIR"
              NEED_WORKER=1
            fi
            CHANGED=1
          done
          if [ "$NEED_WORKER" = "1" ]; then
            cat > rostrick-worker.js <<'JS'
          // RosTrick: يقدّم الملف الكبير (apk/aab) المقسّم في rostrick-big/ كملف واحد على /__rostrick_download.<ext>
          export default {
            async fetch(request, env, ctx) {
              const url = new URL(request.url);
              const m = /^\/__rostrick_download\.(apk|aab)$/.exec(url.pathname);
              const pass = () => env.ASSETS.fetch(request);
              if (!m || (request.method !== "GET" && request.method !== "HEAD")) return pass();
              const direct = await pass();
              if (direct.status !== 404) return direct;
              const ext = m[1];
              const get = (p) => env.ASSETS.fetch(new Request(url.origin + "/rostrick-big/" + p));
              const mr = await get("__rostrick_download." + ext + ".parts.json");
              if (!mr.ok) return direct;
              let mf;
              try { mf = await mr.json(); } catch (e) { return direct; }
              const parts = Array.isArray(mf.parts) ? mf.parts : [];
              const total = parts.reduce((a, p) => a + (Number(p.s) || 0), 0);
              if (!parts.length || !total) return direct;
              const headers = new Headers({
                "Content-Type": ext === "apk" ? "application/vnd.android.package-archive" : "application/octet-stream",
                "Content-Length": String(total),
                "Cache-Control": "no-cache"
              });
              if (request.method === "HEAD") return new Response(null, { headers });
              const { readable, writable } = new FixedLengthStream(total);
              ctx.waitUntil((async () => {
                try {
                  for (const p of parts) {
                    const r = await get(p.f);
                    if (!r.ok || !r.body) throw new Error("part " + p.f + " " + r.status);
                    await r.body.pipeTo(writable, { preventClose: true });
                  }
                  await writable.close();
                } catch (e) {
                  try { await writable.abort(e); } catch (_) {}
                }
              })());
              return new Response(readable, { headers });
            }
          };
          JS
            python3 - <<'PY'
          import json, os, re, sys
          def strip(t):
              out, i, n, ins = [], 0, len(t), False
              while i < n:
                  c = t[i]
                  if ins:
                      out.append(c)
                      if c == "\\" and i + 1 < n:
                          out.append(t[i + 1]); i += 2; continue
                      if c == '"': ins = False
                      i += 1; continue
                  if c == '"': ins = True; out.append(c); i += 1; continue
                  if t.startswith("//", i):
                      while i < n and t[i] != "\n": i += 1
                      continue
                  if t.startswith("/*", i):
                      j = t.find("*/", i + 2); i = n if j < 0 else j + 2; continue
                  out.append(c); i += 1
              return re.sub(r",(\s*[}\]])", r"\1", "".join(out))
          p = "wrangler.jsonc"
          if not os.path.exists(p):
              print("::warning::لا يوجد wrangler.jsonc: لن يعمل رابط الملف الكبير حتى تُنشئه اللوحة (أعد حفظ بيانات المشروع)"); sys.exit(0)
          try:
              cfg = json.loads(strip(open(p, encoding="utf-8").read()))
              a = cfg.get("assets")
              if not isinstance(cfg, dict) or not isinstance(a, dict): raise ValueError("assets")
          except Exception as e:
              print("::warning::تعذّرت قراءة wrangler.jsonc (%s): لن يعمل رابط الملف الكبير" % e); sys.exit(0)
          before = json.dumps(cfg, sort_keys=True)
          cfg["main"] = "rostrick-worker.js"
          a["binding"] = "ASSETS"
          if a.get("not_found_handling") and not a.get("run_worker_first"):
              a["run_worker_first"] = ["/__rostrick_download.*"]
          if json.dumps(cfg, sort_keys=True) != before:
              open(p, "w", encoding="utf-8").write(json.dumps(cfg, indent=2, ensure_ascii=False) + "\n")
          PY
            # .assetsignore: السكربت لا يُنشر كملف عام، ومجلد الأجزاء يجب أن يُنشر (نزيل استثناءه القديم إن وُجد)
            touch .assetsignore
            python3 - <<'PY'
          lines = open(".assetsignore", encoding="utf-8").read().splitlines()
          lines = [l for l in lines if l.strip().rstrip("/") != "rostrick-big"]
          if "rostrick-worker.js" not in [l.strip() for l in lines]: lines.append("rostrick-worker.js")
          open(".assetsignore", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
            git add .assetsignore rostrick-worker.js wrangler.jsonc 2>/dev/null || git add .assetsignore rostrick-worker.js
          fi
          if [ "$CHANGED" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "RosTrick: تحديث نسخة التحميل العامة (بناء رقم ${{ github.run_number }})"
            for i in 1 2 3; do git push && break || { git pull --rebase; sleep 2; }; done
          fi

      - name: حفظ assetlinks.json في المستودع
        if: env.AL_READY == '1'
        run: |
          git config user.name "rostrick-bot"
          git config user.email "rostrick-bot@users.noreply.github.com"
          git add rostrick-build/assetlinks.json
          if git diff --cached --quiet; then echo "assetlinks.json بلا تغيير"; else
            git commit -m "RosTrick: تحديث assetlinks.json"
            for i in 1 2 3; do git push && break || { git pull --rebase; sleep 2; }; done
          fi
