<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="rostrick-statusbar" content="color=#ffffff; icons=dark">
<meta name="theme-color" content="#ffffff">
<title>المتصفح</title>
<style>
:root{
  --bar:#ffffff; --barfg:#202124; --bg:#ffffff; --fg:#202124; --muted:#5f6368; --field:#f1f3f4; --line:#e3e5e8;
  --accent:#1a73e8; --accentbg:#e8f0fe; --danger:#d93025; --ok:#188038; --card:#ffffff; --shadow:0 2px 10px rgba(0,0,0,.18);
  --sbpad:0px;
}
:root[data-theme=dark]{
  --bar:#202124; --barfg:#e8eaed; --bg:#202124; --fg:#e8eaed; --muted:#9aa0a6; --field:#35363a; --line:#3c4043;
  --accent:#8ab4f8; --accentbg:#2b3a55; --danger:#f28b82; --ok:#81c995; --card:#2b2c2f; --shadow:0 2px 10px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.fill{fill:currentColor}
[dir=rtl] .flip{transform:scaleX(-1)}
.hide{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sbpad);background:var(--bar);transition:background .25s}
#top{background:var(--bar);color:var(--barfg);padding:6px 6px 8px;display:flex;align-items:center;gap:2px;transition:background .25s,color .25s;position:relative}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:inherit;position:relative;flex:none}
.ib:active{background:rgba(127,127,127,.22)}
.ib[disabled]{opacity:.35;pointer-events:none}
#omni{flex:1;min-width:0;height:42px;background:var(--field);border-radius:21px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;margin:0 2px}
#omni .oi{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
#omni .oi svg{width:18px;height:18px}
#omni.sec .oi{color:var(--ok)} #omni.bad .oi{color:var(--danger)}
#url{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:15px;color:var(--barfg);text-overflow:ellipsis}
#omni:not(.focus) #url{text-align:start}
#tabsbtn .n{font-size:12px;font-weight:700;border:2px solid currentColor;border-radius:6px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 3px}
#prog{position:absolute;bottom:0;inset-inline:0;height:3px;background:transparent;pointer-events:none}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#find{background:var(--bar);color:var(--barfg);padding:2px 8px 8px;display:flex;align-items:center;gap:4px}
#find input{flex:1;min-width:0;height:38px;border-radius:19px;border:0;background:var(--field);padding:0 14px;outline:0}
#find .cnt{font-size:12px;color:var(--muted);min-width:44px;text-align:center}
#view{flex:1;min-height:0;position:relative;background:var(--bg);overflow:hidden}
#ntp,#errpg,#sug{position:absolute;inset:0;overflow-y:auto;background:var(--bg)}
#sug{z-index:5;padding:6px 0}
#snack{background:#303134;color:#fff;font-size:14px;padding:0 16px;height:0;overflow:hidden;display:flex;align-items:center;justify-content:space-between;transition:height .18s}
#snack.on{height:46px}
@media (max-width:520px){#bBack,#bFwd{display:none}}
#fsbar{height:0;overflow:hidden;background:var(--bar);color:var(--muted);display:flex;align-items:center;justify-content:center}
body.fs #fsbar{height:20px}
body.fs #top,body.fs #find{display:none}

/* ===== الصفحة الجديدة ===== */
.ntp{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:36px 18px 24px}
.ntp .logo{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:18px 0 20px;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);-webkit-background-clip:text;background-clip:text;color:transparent}
.ntp .sbox{width:100%;max-width:520px;height:48px;border-radius:24px;background:var(--field);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ntp .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:520px;margin-top:28px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;min-width:0}
.sc .ic{width:52px;height:52px;border-radius:50%;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sc .ic img{width:28px;height:28px;border-radius:6px}
.sc span{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px}
.ntp.priv{color:var(--fg)} .ntp .pv{max-width:420px;text-align:start;line-height:1.9;color:var(--muted);margin-top:22px}
.ntp .pv h3{color:var(--fg);margin:0 0 6px}

/* ===== صفحة الخطأ ===== */
.err{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 26px;max-width:520px;margin:auto}
.err .big{color:var(--muted);margin-bottom:14px}.err .big svg{width:44px;height:44px}
.err h2{margin:0 0 8px;font-size:21px;font-weight:600}.err p{color:var(--muted);line-height:1.8;margin:0 0 6px}.err code{direction:ltr;display:block;font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;background:var(--accent);color:#fff;font-weight:600;margin-top:14px}
:root[data-theme=dark] .btn{color:#202124}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.red{background:var(--danger);color:#fff}

/* ===== اقتراحات ===== */
.sg{display:flex;align-items:center;gap:14px;padding:10px 16px;width:100%;text-align:start}
.sg:active{background:var(--field)}
.sg .t{min-width:0;flex:1}.sg .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg .t small{display:block;color:var(--muted);font-size:12px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg svg{color:var(--muted);width:20px;height:20px}
.fav{width:26px;height:26px;border-radius:6px;overflow:hidden;flex:none;background:var(--field);display:flex;align-items:center;justify-content:center;position:relative}
.fav img{width:20px;height:20px;position:absolute;inset:0;margin:auto;background:var(--bg)}.fav .letter{font-size:13px}
.fav.big{width:52px;height:52px;border-radius:50%}.fav.big img{width:28px;height:28px}.fav.big .letter{font-size:20px}

/* ===== القائمة السفلية ===== */
#sheet{background:var(--card);color:var(--fg);border-top:1px solid var(--line);box-shadow:var(--shadow);max-height:0;overflow:hidden;transition:max-height .22s;position:relative;z-index:3}
#sheet.on{max-height:62vh;overflow-y:auto}
#sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
.qrow{display:flex;justify-content:space-around;padding:6px 8px 10px;border-bottom:1px solid var(--line)}
.qb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);width:20%;padding:4px 0;border-radius:12px}
.qb svg{width:22px;height:22px;color:var(--fg)}.qb[disabled]{opacity:.35;pointer-events:none}.qb:active{background:var(--field)}
.mi{display:flex;align-items:center;gap:16px;width:100%;padding:12px 18px;text-align:start}
.mi:active{background:var(--field)}.mi svg{color:var(--muted)}.mi .tg{margin-inline-start:auto;color:var(--accent);font-size:13px;font-weight:600}
.zoomrow{display:flex;align-items:center;gap:10px;padding:8px 18px 12px}
.zoomrow b{flex:1;text-align:center}.zoomrow .ib{border:1px solid var(--line);width:40px}

/* ===== اللوحات الكاملة ===== */
.panel{position:absolute;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding-top:var(--sbpad)}
.panel.on{display:flex}
.ph{display:flex;align-items:center;gap:4px;padding:6px 6px;background:var(--bar);color:var(--barfg);border-bottom:1px solid var(--line);flex:none}
.ph h2{margin:0;font-size:18px;font-weight:600;flex:1;padding:0 6px}
.pb{flex:1;overflow-y:auto;padding-bottom:30px}
.search{margin:10px 12px;height:42px;border-radius:21px;background:var(--field);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;color:var(--fg)}
.sec{padding:14px 18px 6px;font-size:13px;color:var(--accent);font-weight:700}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.row:active,.rowb:active{background:var(--field)}
.rowb{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:start}
.hib{opacity:.62}.hibtag{position:absolute;top:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}.hibtag svg{width:13px;height:13px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;line-height:1.9}
.empty svg{width:42px;height:42px;margin:0 auto 10px;opacity:.6}
.seg{display:flex;background:var(--field);border-radius:20px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:17px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.set{display:flex;align-items:center;gap:12px;padding:12px 18px;min-height:52px}
.set .t{flex:1;min-width:0}.set .t b{display:block;font-weight:500}.set .t small{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:2px}
.set select,.set input[type=text],.set input[type=url]{background:var(--field);border:0;border-radius:10px;height:38px;padding:0 10px;color:var(--fg);max-width:48%;outline:0}
.set input[type=text],.set input[type=url]{direction:ltr}
.set input[type=color]{width:46px;height:34px;border:0;padding:0;background:none}
.set input[type=range]{width:46%}
.sw{width:46px;height:26px;border-radius:13px;background:#9aa0a6;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{background:var(--accent)}.sw.on::after{inset-inline-start:23px}
.live{margin:6px 18px 8px;padding:10px 12px;border-radius:12px;background:var(--field);font:12px/1.7 ui-monospace,Menlo,monospace;direction:ltr;text-align:left;white-space:pre-wrap;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;padding:4px 18px 10px}.btnrow .btn{margin-top:0;height:36px;padding:0 14px;font-size:13px}

/* ===== شبكة التبويبات ===== */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.tcard.cur{border:2px solid var(--accent)}
.tcard .th{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;font-size:13px}
.tcard .th b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tcard .th .ib{width:28px;height:28px}.tcard .th .ib svg{width:16px;height:16px}
.tcard .pv{height:104px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;position:relative}
.tcard .pv small{position:absolute;bottom:6px;inset-inline:8px;font-size:11px;font-weight:400;text-align:center;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}

/* ===== حوار ===== */
#dlg{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px}
#dlg.on{display:flex}
#dlg .box{background:var(--card);color:var(--fg);border-radius:20px;padding:20px;width:100%;max-width:380px;box-shadow:var(--shadow)}
#dlg h3{margin:0 0 10px;font-size:18px}#dlg p{margin:0 0 6px;color:var(--muted);line-height:1.8}
#dlg input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:0 12px;margin:6px 0;outline:0;direction:ltr}
#dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#dlg .acts .btn{margin-top:0;height:38px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}.chk input{width:20px;height:20px;accent-color:var(--accent)}
/* ===== العارض: مشغّل وصور ونصوص ===== */
#p-viewer{background:#000;color:#fff;padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
.vw{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.vw video,.vw .vimgw{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vgest{position:absolute;inset:0;touch-action:none}
.vctl{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;direction:ltr;transition:opacity .2s;z-index:2}
.vctl.off{opacity:0}.vctl.off *{pointer-events:none!important}
.vtop,.vbot{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px 8px}
.vtop{background:linear-gradient(rgba(0,0,0,.7),transparent)}
.vbot{flex-direction:column;align-items:stretch;background:linear-gradient(transparent,rgba(0,0,0,.75));padding:10px 10px 8px}
.vtitle{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto;text-align:start;padding:0 6px}
.vib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;flex:none}
.vib:active{background:rgba(255,255,255,.22)}.vib svg{width:24px;height:24px}.vib.on{color:#8ab4f8}
.vib b{position:absolute;font-size:9px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-42%)}
.vib.big{width:62px;height:62px}.vib.big svg{width:36px;height:36px}
.vtx{min-width:44px;height:36px;padding:0 8px;border-radius:18px;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.vtx:active{background:rgba(255,255,255,.22)}.vtx.on{color:#8ab4f8}
.vrow{display:flex;align-items:center;justify-content:center;gap:4px}
.vseekrow{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.vseekrow span{min-width:42px;text-align:center}
#vseek{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
#vseek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,#8ab4f8 var(--p,0%),rgba(255,255,255,.3) var(--p,0%))}
#vseek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 4px rgba(0,0,0,.6)}
.vhud{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:10px 18px;border-radius:16px;display:none;flex-direction:column;align-items:center;gap:6px;min-width:130px;pointer-events:none;direction:ltr;z-index:3;font-weight:700}
.vhud.on{display:flex}.vhud svg{width:26px;height:26px}.vhud .bar{width:110px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}.vhud .bar i{display:block;height:100%;background:#fff}
#vsub{position:absolute;inset-inline:6%;bottom:16%;text-align:center;font-size:var(--subsz,18px);line-height:1.55;text-shadow:0 0 4px #000,0 0 3px #000;pointer-events:none;white-space:pre-line;z-index:1}
#vsub span{background:rgba(0,0,0,.5);padding:1px 8px;border-radius:5px}
.vmenu{position:absolute;inset-inline:0;bottom:0;max-height:72%;overflow:auto;background:#1e1f22;color:#fff;border-radius:18px 18px 0 0;z-index:6;padding:6px 0 14px;direction:rtl;box-shadow:0 -4px 20px rgba(0,0,0,.6)}
.vmenu h4{margin:12px 18px 4px;font-size:13px;color:#9aa0a6;font-weight:600}
.vmenu button{display:flex;width:100%;align-items:center;gap:12px;padding:12px 18px;text-align:start;color:#fff}.vmenu button:active{background:rgba(255,255,255,.1)}.vmenu button.on{color:#8ab4f8;font-weight:700}
.vmenu .stp{display:flex;align-items:center;justify-content:space-between;padding:6px 18px}.vmenu .stp .vtx{border:1px solid #3c4043}
.vunlock{position:absolute;inset-inline-start:16px;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);z-index:4;display:none;align-items:center;justify-content:center}
.vunlock.on{display:flex}
.vspin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:1;flex-direction:column;gap:10px;font-size:13px}
.vspin.on{display:flex}.vspin i{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:vsp .8s linear infinite}
@keyframes vsp{to{transform:rotate(360deg)}}
.verr{position:absolute;inset:0;z-index:5;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;line-height:1.8}
.verr.on{display:flex}
.vcover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:70px 24px 190px;text-align:center}
.vcover .disc{width:min(52vw,230px);height:min(52vw,230px);border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a4a7a,#141a2e);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.vcover .disc svg{width:38%;height:38%;color:#8ab4f8}.vcover b{font-size:18px;direction:auto;word-break:break-word}.vcover small{color:#9aa0a6}
.vtxt{position:absolute;inset:0;overflow:auto;background:#101114;padding:64px 14px 24px;font:var(--tfs,14px)/1.7 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;-webkit-user-select:text;user-select:text}
.vtxt pre{margin:0;white-space:pre-wrap;word-break:break-word}.vtxt.nw pre{white-space:pre;word-break:normal}
.vimgw{touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vimgw img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;-webkit-user-drag:none}
#nonat{position:absolute;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:2}
#nonat.on{display:flex}
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <button class="ib" id="bBack" data-act="back" aria-label="رجوع"><svg class="flip" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button class="ib" id="bFwd" data-act="fwd" aria-label="للأمام"><svg class="flip" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <div id="omni">
      <span class="oi" id="oIcon"></span>
      <input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ابحث أو اكتب عنوان موقع">
      <button class="ib" id="bClear" data-act="clearurl" style="width:30px;height:30px" aria-label="مسح"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button class="ib" id="bStar" data-act="star" style="width:30px;height:30px" aria-label="مفضلة"></button>
      <button class="ib" id="bReload" data-act="reload" style="width:30px;height:30px" aria-label="تحديث"></button>

window.addEventListener("rtstatusbar", function () { var lv = $("sbLive"); if (lv) lv.textContent = sbReadout(); });
if (window.matchMedia) try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", chrome); } catch (e) {}
window.addEventListener("resize", function () { var t = cur(); place(t); });

/* ===== زر الرجوع في أندرويد: ينفّذ أقرب إجراء بدل الخروج ===== */
var exitArmed = false, exitT = 0;
var guardOn = false;
function armGuard() { guardOn = true; try { history.pushState({ rtb: 1 }, ""); } catch (e) {} }
function handleBack() {
  if (dialogOn) { closeDialog(); return true; }
  if (sheetOn) { closeSheet(); return true; }
  if (omniFocus) { setOmniFocus(false); return true; }
  if (openPanels.length) { closePanel(); return true; }
  if (findOn) { hideFind(); return true; }
  if (fs) { fsSet(false); return true; }
  var t = cur(); if (t && t.vid && t.canBack) { WV.back(t.vid); return true; }
  if (t && t.url && t.parent && tabById(t.parent)) { closeTab(t.id); return true; }
  if (t && t.url) { goNtp(t); return true; }
  return false;
}
/* مع RosTrickBack لا نحتاج حارس السجل: الجسر يسلّمنا الضغطة مباشرة، والضغط مرتين للخروج برسالتنا نحن */
function regBack() {
  if (!BK) return;
  bkOffs.forEach(function (f) { try { f(); } catch (e) {} }); bkOffs = [];
  BK.exitMode(S.exitMode);
  if (S.dblExit) bkOffs.push(BK.doubleBackToExit({ timeout: 2000, always: true, mode: S.exitMode, onFirst: function () { snack("اضغط رجوع مرة أخرى للخروج", 2000); hap("tick"); } }));
  bkOffs.push(BK.onBack(function () { return handleBack(); }));
}
window.addEventListener("popstate", function () {
  if (BK) return;
  if (handleBack()) { armGuard(); return; }
  if (exitArmed) return; // الضغطة الثانية: لا نعيد الحارس فيخرج التطبيق
  exitArmed = true; snack("اضغط رجوع مرة أخرى للخروج", 2000);
  clearTimeout(exitT); exitT = setTimeout(function () { if (exitArmed) { exitArmed = false; armGuard(); } }, 2000);
});
// أي لمسة أثناء مهلة الخروج تعيد الحارس حتى لا يخرج التطبيق بالخطأ
document.addEventListener("pointerdown", function () { if (!BK && exitArmed) { exitArmed = false; clearTimeout(exitT); armGuard(); } }, true);

/* ============================ الإقلاع ============================ */
function boot() {
  WV = window.RosTrickWebView; SB = window.RosTrickStatusBar;
  if (!WV) { $("nonat").classList.add("on"); return; }
  WV.on(onWv);
  DL = window.RosTrickDownloads || null; BK = window.RosTrickBack || null; AP = window.RosTrickApp || null;
  if (BK) regBack();
  if (AP) {
    try { AP.nativeFeel({ zoom: false }); } catch (e) {}
    AP.on("keyboard", function (d) { kbOpen = !!d.open; document.documentElement.classList.toggle("kb", kbOpen); var c = cur(); if (c) place(c); });
    AP.on("pause", function () { saveSession(); var m = $("vmedia"); if (VW && VW.kind === "video" && m) m.pause(); });
  }
  var DV = window.RosTrickDevice;
  if (DV) {
    DV.on("network", function (d) { snack(d.online ? "عاد الاتصال بالإنترنت" : "لا يوجد اتصال بالإنترنت", 2600); hap(d.online ? "tick" : "reject"); });
    secureOn = null; syncSecure();
  }
  if (DL) DL.on(function (it, type) {
    if (privDl[it.url]) return;
    if (type === "start") snack("بدأ التنزيل: " + (it.name || host(it.url)), 3500, "التنزيلات", function () { openPanel("downloads"); });
    else if (type === "done") snack("اكتمل التنزيل: " + it.name, 6000, "فتح", function () { openDownload(it.id); });
    else if (type === "failed") snack("فشل التنزيل: " + (it.name || ""), 3500);
    if (openPanels.indexOf("downloads") > -1) renderDowns();
  });
  var ses = store.get("session", null), restored = false;
  if (ses && ses.tabs && ses.tabs.length) {
    ses.tabs.forEach(function (x) { tabs.push({ id: x.id, url: x.url || "", title: x.title || "", vid: null, loading: false, progress: 0, canBack: false, canFwd: false, priv: false, desktop: !!x.desktop, err: null, theme: null, parent: null, last: 0, shown: false, scroll: null, creating: null }); tseq++; });
    curId = tabById(ses.cur) ? ses.cur : tabs[0].id; restored = true; tabById(curId).last = Date.now();
    if (cur().url) ensureView(cur());
  }
  if (!restored) { var q = new URLSearchParams(location.search).get("u"); newTab(q ? { url: normalize(q) } : {}); }
  // الحارس يُضاف عند أول لمسة فقط: كروم يتجاهل مدخلات السجل المضافة قبل أي تفاعل من المستخدم
  if (!BK) document.addEventListener("pointerdown", function () { if (!guardOn) armGuard(); }, { capture: true, once: true });
  chrome(); syncNative(); render();
}
var started = false, tries = 0;
function start() { if (started) return; started = true; boot(); }
if (window.RosTrickWebView) start();
else { window.addEventListener("rtnative-ready", start); (function w() { if (started) return; if (window.RosTrickWebView) return start(); if (++tries > 30) return start(); setTimeout(w, 100); })(); }
})();
</script>
