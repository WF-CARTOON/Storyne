<style id="vx-base">

body{--p:#2f7d4a;--bg:#f6f7f9;--tx:#1f2933;--hb:#f6f7f9;--ht:#1f2933;--cd:#fff;--r:16px;--ff:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);line-height:1.8;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.vx-img{display:block;max-width:100%;height:auto;max-height:75vh;object-fit:cover}.vx-img.r{border-radius:var(--r)}
.vx-btn{display:block;text-align:center;text-decoration:none;background:var(--p);color:#fff;padding:.75em 1.2em;border-radius:var(--r);font-weight:700;border:2px solid var(--p);min-height:48px;transition:transform .15s,opacity .15s}.vx-btn:active{transform:scale(.97);opacity:.9}.vx-btn.o{background:transparent;color:var(--p)}
