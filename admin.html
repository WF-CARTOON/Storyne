<div id="page-lock-screen-protection">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h2>هذه صفحة خاصة!</h2>
        <p>يرجى إدخال كلمة المرور لتستطيع رؤيتها!</p>
        <input type="password" id="page-lock-pass-input" placeholder="كلمة المرور">
        <button onclick="verifyPagePassword()">دخول</button>
        <div id="page-lock-error-msg">كلمة المرور غير صحيحة!</div>
    </div>
</div>
<script>
(function () {
    var SPS_JSON_PATH = "sps-pages.json";
    var SPS_PAGE_KEY = "admin.html";
    var SPS_USER = "WF-CARTOON";
    var SPS_REPO = "Storyne";
    var spsPasswordValue = null;
    var spsReady = false;

    function spsApplyConfig(cfg) {
        spsPasswordValue = (cfg && typeof cfg[SPS_PAGE_KEY] === "string") ? cfg[SPS_PAGE_KEY] : "";
        spsReady = true;
    }

    async function spsFetchPasswordsConfig() {
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                var localData = Android.readLocalFile("sps-pages.json");
                if (localData && localData.trim() !== "") {
                    spsApplyConfig(JSON.parse(localData));
                    return;
                }
            }
            var res = await fetch("sps-pages.json?t=" + Date.now());
            if (res.ok) { spsApplyConfig(await res.json()); return; }
            throw new Error();
        } catch (e) {
            try {
                var resAlt = await fetch("https://raw.githubusercontent.com/" + SPS_USER + "/" + SPS_REPO + "/main/" + SPS_JSON_PATH + "?t=" + Date.now());
                if (resAlt.ok) { spsApplyConfig(await resAlt.json()); return; }
                spsApplyConfig(null);
            } catch (err) {
                spsApplyConfig(null);
            }
        }
    }

    spsFetchPasswordsConfig();

    window.verifyPagePassword = function () {
        var inputVal = document.getElementById("page-lock-pass-input").value;
        var errorEl = document.getElementById("page-lock-error-msg");
        if (!spsReady) {
            errorEl.textContent = "يرجى الانتظار لحظة ثم إعادة المحاولة...";
            errorEl.style.display = "block";
            return;
        }
        if (spsPasswordValue && inputVal === spsPasswordValue) {
            document.getElementById("page-lock-screen-protection").remove();
            var lockStyle = document.getElementById("page-lock-style");
            if (lockStyle) lockStyle.remove();
        } else {
            errorEl.textContent = "كلمة المرور غير صحيحة!";
            errorEl.style.display = "block";
        }
    };
})();
</script>

<div id="app">
<div class="row"><b>🛡 لوحة الإدارة</b><button onclick="tg()">🌓</button></div>
<div id="mn">
<div class="card"><b>إرسال إشعار</b><input id="nu" placeholder="اسم المستخدم (فارغ = للجميع)"><input id="nt" placeholder="نص الإشعار"><button onclick="sn()">إرسال</button></div>
<select id="fl" onchange="ls()"><option value="">كل الألعاب</option><option value="pending">قيد المراجعة</option><option value="approved">مقبولة</option><option value="rejected">مرفوضة</option><option value="suspended">معلّقة</option><option value="draft">مسودات</option></select>
<div id="ls"></div></div></div>
<script>
const $=s=>document.querySelector(s),L=localStorage,app=$('#app');
// ===== إعدادات Firebase: ضعها هنا =====
const FB={url:'',secret:''}; // url مثال: 'https://xxxx-default-rtdb.firebaseio.com' — secret اختياري
const cfg=()=>window.SSP_FB||FB;
async function db(p,m='GET',b){const c=cfg();if(!c.url)throw'ضع رابط RTDB في الإعدادات';const[a,q]=p.split('?');const r=await fetch(c.url.replace(/\/$/,'')+'/'+a+'.json?'+(q||'')+(c.secret?'&auth='+c.secret:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw'خطأ '+r.status;return r.json()}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function tg(){L.ssp_t=app.dataset.t=app.dataset.t=='dark'?'light':'dark'}
app.dataset.t=L.ssp_t||'dark';
const ST={draft:'مسودة',pending:'قيد المراجعة',approved:'مقبولة',rejected:'مرفوضة',suspended:'معلّقة'};
async function nf(uid,t){await db('notifs/'+uid,'POST',{t,ts:Date.now()})}
async function sn(){try{const u=$('#nu').value.trim().toLowerCase(),t=$('#nt').value.trim();if(!t)return;await nf(u?(await H(u)).slice(0,16):'all',t);$('#nt').value='';alert('أُرسل')}catch(e){alert(e)}}
async function ls(){const el=$('#ls');try{const g=await db('games')||{},f=$('#fl').value;el.innerHTML='';
for(const[id,x]of Object.entries(g)){if(f&&x.status!=f)continue;const d=document.createElement('div');d.className='card';
d.innerHTML=`<b>${E(x.title)}</b> <span class=m>${E(x.au)} · ${ST[x.status]||x.status} · ❤ ${Object.keys(x.likes||{}).length}</span><div class=row><button>قبول</button><button>رفض</button><button>تعليق/تعطيل</button><button>حذف</button><button>التعليقات (${Object.keys(x.comments||{}).length})</button></div><div class=cx></div>`;
const b=d.querySelectorAll('button'),set=(s,m)=>async()=>{await db('games/'+id+'/status','PUT',s);await nf(x.uid,`لعبتك «${x.title}» ${m}`);ls()};
b[0].onclick=set('approved','تم قبولها ونشرها');b[1].onclick=set('rejected','تم رفضها');b[2].onclick=set('suspended','تم تعليقها');
b[3].className='d';b[3].onclick=async()=>{if(confirm('حذف نهائي؟')){await db('games/'+id,'DELETE');await db('gdata/'+id,'DELETE');await nf(x.uid,`تم حذف لعبتك «${x.title}»`);ls()}};
b[4].onclick=()=>{const c=d.querySelector('.cx');c.innerHTML='';for(const[k,v]of Object.entries(x.comments||{})){const r=document.createElement('div');r.className='row';r.innerHTML=`<span><b>${E(v.u)}:</b> ${E(v.t)}</span><button>🗑</button>`;r.querySelector('button').onclick=async()=>{await db(`games/${id}/comments/${k}`,'DELETE');r.remove()};c.append(r)}};
el.append(d)}}catch(e){el.textContent=e}}
ls();
</script>
