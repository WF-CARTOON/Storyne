<!DOCTYPE html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المنصة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Reem+Kufi&family=Aref+Ruqaa&family=Lalezar&display=swap');
*{box-sizing:border-box}[hidden]{display:none!important}
html{--bg:#0e1118;--pn:#161a24;--p2:#1e2331;--tx:#ece7db;--mu:#9aa1b4;--ac:#e0b862;--on:#1a1408;--ln:#272d3d;--rd:#e5675d;--gn:#3fb27f;--sh:0 10px 30px #0006;color-scheme:dark;scroll-behavior:smooth}
html[data-t=day]{--bg:#f4f1e9;--pn:#fffdf8;--p2:#efeadf;--tx:#25221b;--mu:#6c675b;--ac:#9a6410;--on:#fff;--ln:#ddd6c5;--rd:#c4493f;--gn:#238a5c;--sh:0 10px 28px #3a2f1a1c;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.75 Tajawal,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:960px;margin:auto;padding:20px 18px 70px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
textarea{min-height:84px;resize:vertical}
button{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:8px 18px;min-height:40px;cursor:pointer;font-weight:700;transition:.15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}button.g:hover{background:var(--p2)}
button.r{background:var(--rd);color:#fff}button.k{background:var(--gn);color:#fff}button.s{min-height:32px;padding:3px 12px;font-size:.88em}
button.on{outline:2px solid var(--ac);outline-offset:1px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.sub{background:var(--p2)}
.mu{color:var(--mu)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
h1,h2,h3{font-family:Amiri,serif;margin:.5em 0;line-height:1.3}h1{font-size:2.4em}h2{font-size:1.7em}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:20px;width:min(94vw,480px);max-height:88vh;padding:20px;box-shadow:var(--sh)}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}dialog>*{margin:10px 0}
#tt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:99px;z-index:99;display:none;box-shadow:var(--sh);font-weight:700}
.st,.chip{display:inline-block;font-size:.8em;border-radius:99px;padding:1px 12px;border:1px solid var(--ln);background:var(--p2);color:var(--mu)}
.st.approved{color:var(--gn);border-color:var(--gn)}.st.pending{color:var(--ac);border-color:var(--ac)}.st.rejected,.st.suspended{color:var(--rd);border-color:var(--rd)}
.nv{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--ln);background:color-mix(in srgb,var(--pn) 88%,transparent);backdrop-filter:blur(10px)}
.nv a{color:var(--mu);text-decoration:none;padding:6px 16px;border-radius:10px;font-weight:700}.nv a:hover{background:var(--p2);color:var(--tx)}.nv a.on{background:var(--ac);color:var(--on)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.br{font:700 1.35em Amiri,serif;color:var(--ac);padding:2px 10px;margin-inline-end:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.stat{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:10px 16px}.stat b{display:block;font:700 1.9em Amiri,serif;color:var(--ac);line-height:1.2}
</style>
<header class="nv"><span class="br">✦ روايات</span><a href="home.html">الرئيسية</a><a href="create.html">إنشاء</a><a class="on" href="admin.html">الإدارة</a></header>
<div class="w">
 <div class="row"><span class="sp"></span><button class="g" onclick="tth()">☾ / ☀</button><button class="g" id="out" hidden onclick="sessionStorage.removeItem('sg_admin');location.reload()">خروج</button></div>
 <h1>لوحة إدارة المنصة</h1>
 <div id="lo" class="card"><p>كلمة مرور الإدارة</p><input id="pw" type="password" onkeydown="event.key=='Enter'&&enter()"><p></p><button onclick="enter()">دخول</button></div>
 <div id="ad" hidden>
  <div class="card"><b>إشعار عام لكل المستخدمين</b><p></p><textarea id="bc" placeholder="نص الإشعار"></textarea><p></p><button onclick="bcast()">إرسال للجميع</button></div>
  <div class="stats" id="sts"></div><div class="row" id="tabs"></div><div id="ls"></div>
 </div>
</div><div id="tt"></div>
<script>
const DB='https://clean-sequencer-422716-g8-default-rtdb.firebaseio.com',KEY='';
const ADMIN_PASS=''; // ضع كلمة مرور الإدارة هنا
const GAMES_PAGE='home.html';
const $=s=>document.querySelector(s),h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;k.startsWith('on')?e[k]=v:k=='class'?e.className=v:e.setAttribute(k,v===true?'':v)}c.flat().forEach(x=>e.append(x?.nodeType?x:(x??'')));return e};
const api=async(m,p,b)=>{const r=await fetch(DB+'/'+p+'.json'+(KEY?'?auth='+KEY:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
const get=p=>api('GET',p),put=(p,b)=>api('PUT',p,b),del=p=>api('DELETE',p),patch=(p,b)=>api('PATCH',p,b);
let _tt;const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',2800)};
const dlg=(...c)=>{const d=h('dialog',{},...c);d.onclose=()=>d.remove();document.body.append(d);d.showModal();return d};
const closeBtn=()=>h('button',{class:'g',onclick:e=>e.target.closest('dialog').close()},'إغلاق');
document.documentElement.dataset.t=localStorage.sg_theme||'night';
const tth=()=>{const d=document.documentElement;d.dataset.t=localStorage.sg_theme=d.dataset.t=='day'?'night':'day'};

const ST={pending:'قيد المراجعة',approved:'منشورة',rejected:'مرفوضة',suspended:'معلّقة'};
const fmt=t=>t?new Date(t).toLocaleDateString('ar'):'';
let G={},Us={},F='pending',TAB='g',UQ='';
function enter(){if(!ADMIN_PASS)return toast('لم تُضبط كلمة مرور الإدارة في الكود بعد');if($('#pw').value!==ADMIN_PASS)return toast('كلمة المرور غير صحيحة');sessionStorage.sg_admin='1';init()}
function init(){$('#lo').hidden=1;$('#ad').hidden=0;$('#out').hidden=0;load()}
const nt=(uid,m)=>put('notifs/'+uid+'/n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{m,d:Date.now()});
function ask(title,ph,ok,opt){const t=h('textarea',{placeholder:ph});const d=dlg(h('h3',{},title),t,h('div',{class:'row'},h('button',{onclick:()=>{const v=t.value.trim();if(!v&&!opt)return toast('اكتب النص أولًا');d.close();ok(v)}},'تأكيد'),closeBtn()))}
async function bcast(){const m=$('#bc').value.trim();if(!m)return toast('اكتب نص الإشعار');try{await nt('_all',m);$('#bc').value='';toast('أُرسل الإشعار للجميع')}catch(e){toast('تعذّر الإرسال')}}
async function load(){try{const[a,b]=await Promise.all([get('games'),get('users')]);G=a||{};Us=b||{}}catch(e){return toast('لا اتصال بالخادم')}draw()}
function draw(){const gs=Object.values(G),sx=$('#sts');sx.innerHTML='';[['بانتظار المراجعة',gs.filter(g=>g.status=='pending').length],['منشورة',gs.filter(g=>g.status=='approved').length],['كل الروايات',gs.length],['المستخدمون',Object.keys(Us).length]].forEach(([l,n])=>sx.append(h('div',{class:'stat'},h('b',{},n),h('span',{class:'mu'},l))));const t=$('#tabs');t.innerHTML='';[['g','الألعاب ('+Object.keys(G).length+')'],['u','المستخدمون ('+Object.keys(Us).length+')']].forEach(([k,l])=>t.append(h('button',{class:'g'+(TAB==k?' on':''),onclick:()=>{TAB=k;draw()}},l)));TAB=='g'?games():users()}
function users(){const b=$('#ls');b.innerHTML='';const L=h('div');
const list=()=>{L.innerHTML='';const q=UQ.trim().toLowerCase();const a=Object.entries(Us).filter(([k,u])=>!q||((u.name||'')+' '+(u.acc||'')+' '+k).toLowerCase().includes(q)).sort((x,y)=>(y[1].created||0)-(x[1].created||0));
if(!a.length)L.append(h('p',{class:'mu'},'لا يوجد مستخدمون مطابقون.'));
a.forEach(([id,u])=>{const n=Object.values(G).filter(g=>g.owner==id).length;L.append(h('div',{class:'card row'},h('div',{class:'sp'},h('b',{},u.name||id),h('div',{class:'mu'},'@'+(u.acc||id)+(u.created?' · انضم '+fmt(u.created):''))),h('span',{class:'chip'},n+' رواية'),h('button',{onclick:()=>ask('إشعار إلى '+(u.name||id),'نص الإشعار',m=>nt(id,m).then(()=>toast('أُرسل')).catch(()=>toast('تعذّر الإرسال')))},'🔔 إشعار')))})};
b.append(h('input',{type:'search',placeholder:'ابحث بالاسم أو الحساب…',value:UQ,oninput:e=>{UQ=e.target.value;list()}}),L);list()}
function games(){const b=$('#ls');b.innerHTML='';const f=h('div',{class:'row'});[['all','الكل'],...Object.entries(ST)].forEach(([k,l])=>{const n=Object.values(G).filter(g=>k=='all'||g.status==k).length;f.append(h('button',{class:'g s'+(F==k?' on':''),onclick:()=>{F=k;draw()}},l+' ('+n+')'))});b.append(f);
const a=Object.entries(G).filter(([k,g])=>F=='all'||g.status==F).sort((x,y)=>(y[1].updated||0)-(x[1].updated||0));if(!a.length)b.append(h('p',{class:'mu'},'لا توجد ألعاب في هذا القسم.'));
a.forEach(([k,g])=>{const cm=h('div'),T=g.title+(g.part>1?' (الجزء '+g.part+')':'');b.append(h('div',{class:'card'},h('div',{class:'row'},h('b',{},T),h('span',{class:'st '+g.status},ST[g.status]||g.status),h('span',{class:'sp'}),h('span',{class:'mu'},(g.ownerName||'')+' @'+g.owner+' · '+fmt(g.updated))),g.desc?h('p',{class:'mu'},g.desc.slice(0,160)):'',g.note?h('p',{class:'mu'},'ملاحظة: '+g.note):'',
h('div',{class:'row'},g.status!='approved'?h('button',{class:'k',onclick:()=>setSt(k,'approved','تم قبول لعبتك «'+g.title+'» وهي الآن منشورة.')},'قبول'):'',
g.status=='pending'?h('button',{class:'r',onclick:()=>ask('سبب الرفض (اختياري)','السبب',r=>setSt(k,'rejected','تم رفض لعبتك «'+g.title+'».'+(r?' السبب: '+r:''),r),1)},'رفض'):'',
g.status=='approved'?h('button',{class:'g',onclick:()=>ask('سبب التعليق (اختياري)','السبب',r=>setSt(k,'suspended','تم تعليق لعبتك «'+g.title+'».'+(r?' السبب: '+r:''),r),1)},'تعليق'):'',
g.status=='suspended'?h('button',{class:'k',onclick:()=>setSt(k,'approved','أُعيد تفعيل لعبتك «'+g.title+'».')},'تفعيل'):'',
h('button',{class:'g',onclick:()=>prev(k)},'معاينة'),h('button',{class:'g',onclick:()=>cms(k,cm)},'التعليقات'),h('button',{class:'g',onclick:()=>ask('إشعار إلى '+g.ownerName,'نص الإشعار',m=>nt(g.owner,m).then(()=>toast('أُرسل')))},'إشعار للمالك'),h('button',{class:'r',onclick:()=>rm(k)},'حذف')),cm))})}
async function setSt(k,s,m,note){try{await patch('games/'+k,{status:s,note:note||null});await nt(G[k].owner,m);G[k].status=s;G[k].note=note||null;draw();toast('تم')}catch(e){toast('تعذّر التنفيذ')}}
async function rm(k){if(!confirm('حذف «'+G[k].title+'» مع كل تعليقاتها وإعجاباتها؟'))return;try{await Promise.all(['games','stories','comments','likes'].map(p=>del(p+'/'+k)));await nt(G[k].owner,'تم حذف لعبتك «'+G[k].title+'» من المنصة.');delete G[k];draw()}catch(e){toast('تعذّر الحذف')}}
async function cms(k,box){if(box.innerHTML){box.innerHTML='';return}let c={};try{c=await get('comments/'+k)||{}}catch(e){return toast('لا اتصال')}const ks=Object.keys(c);if(!ks.length)box.append(h('p',{class:'mu'},'لا توجد تعليقات'));ks.forEach(i=>{const x=c[i],r=h('div',{class:'card sub row'},h('span',{class:'sp'},h('b',{},x.n+': '),x.t),h('button',{class:'r s',onclick:async()=>{try{await del('comments/'+k+'/'+i);r.remove()}catch(e){toast('تعذّر الحذف')}}},'حذف'));box.append(r)})}
async function prev(k){try{localStorage.sg_preview=JSON.stringify(await get('stories/'+k));open(GAMES_PAGE+'?preview=1')}catch(e){toast('تعذّر التحميل')}}
if(sessionStorage.sg_admin&&ADMIN_PASS)init();
</script>
